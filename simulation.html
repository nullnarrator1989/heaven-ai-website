<style>
:root{
  --bg:#080d1e; --bg2:#0b1226; --panel:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  --ink:#eaf0f8; --muted:#a8b6cc; --dim:#7e8da6;
  --gold:#f2c77e; --gold-d:#d9a955; --cyan:#3fc0dd; --coral:#e8763f; --navy:#102846;
  --plate:#f5f8fc;
  --r:18px; --maxw:1080px;
  --ar:"Segoe UI",Tahoma,"SF Arabic","Geeza Pro","Noto Naskh Arabic","Droid Arabic Naskh",system-ui,sans-serif;
  --en:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ar); line-height:1.75;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; text-rendering:optimizeLegibility;
}
html[lang="en"] body{font-family:var(--en)}
/* --- night sky --- */
.sky{position:fixed;inset:0;z-index:-2;pointer-events:none}
.sky::before{content:"";position:absolute;inset:0;
  background:
   radial-gradient(900px 600px at 78% -10%, rgba(232,118,63,.16), transparent 60%),
   radial-gradient(800px 700px at 12% 8%, rgba(63,192,221,.14), transparent 62%),
   radial-gradient(1100px 800px at 50% 108%, rgba(242,199,126,.10), transparent 60%),
   linear-gradient(180deg,#080d1e 0%,#0a1024 45%,#080d1e 100%);}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
   radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent),
   radial-gradient(1.2px 1.2px at 27% 42%, #cfe8ff, transparent),
   radial-gradient(1.6px 1.6px at 48% 12%, #fff, transparent),
   radial-gradient(1.1px 1.1px at 68% 33%, #ffe6bd, transparent),
   radial-gradient(1.5px 1.5px at 84% 21%, #fff, transparent),
   radial-gradient(1.2px 1.2px at 92% 62%, #cfe8ff, transparent),
   radial-gradient(1.1px 1.1px at 8% 72%, #fff, transparent),
   radial-gradient(1.3px 1.3px at 36% 84%, #ffe6bd, transparent),
   radial-gradient(1.2px 1.2px at 58% 68%, #fff, transparent),
   radial-gradient(1.4px 1.4px at 76% 88%, #cfe8ff, transparent);
  animation:tw 7s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.32}to{opacity:.62}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
a{color:inherit}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{inset-inline-start:12px;top:12px;background:var(--gold);color:#0b1026;padding:10px 14px;border-radius:10px;z-index:99}

/* --- header --- */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(8,13,30,.88),rgba(8,13,30,.62));border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.brand img{width:36px;height:auto;display:block}
.bname{display:flex;flex-direction:column;line-height:1.15}
.bname b{font-size:15px;letter-spacing:.22em;font-weight:700;color:#fff}
.bname span{font-size:9.5px;color:var(--gold);letter-spacing:.02em;white-space:nowrap}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:9px;white-space:nowrap;transition:.18s}
nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;margin-inline-start:8px}
.lang button{background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.18s}
.lang button[aria-pressed="true"]{background:var(--gold);color:#141a2b;font-weight:700}
.burger{display:none;margin-inline-start:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:16px;cursor:pointer}
@media(max-width:860px){
  nav{position:fixed;inset:66px 0 auto 0;flex-direction:column;align-items:stretch;gap:0;
      background:rgba(8,13,30,.98);border-bottom:1px solid var(--line);padding:8px 12px 14px;display:none}
  nav.open{display:flex}
  nav a{padding:13px 8px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14.5px}
  .lang{margin-inline-start:auto}
  .burger{display:block}
}

/* --- hero --- */
.hero{position:relative;padding:66px 0 30px;text-align:center}
.arch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(560px,92vw);height:340px;
  border-radius:50% 50% 12px 12px/58% 58% 12px 12px;z-index:-1;
  background:radial-gradient(60% 70% at 50% 78%, rgba(242,199,126,.20), transparent 70%);
  border:1px solid rgba(242,199,126,.14);border-bottom:0;box-shadow:0 -20px 90px rgba(242,199,126,.10) inset}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--gold);
  border:1px solid rgba(242,199,126,.32);background:rgba(242,199,126,.07);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:block;box-shadow:0 0 10px var(--gold)}
.plate{display:inline-block;background:var(--plate);border-radius:26px;padding:22px 26px 18px;margin-bottom:26px;
  box-shadow:0 26px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(242,199,126,.28), 0 0 60px rgba(63,192,221,.12)}
.plate img{width:min(290px,62vw);height:auto;display:block}
h1{font-size:clamp(26px,6.4vw,46px);line-height:1.3;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 30%,#cdd9ea);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
.lede{font-size:clamp(14.5px,2.4vw,17.5px);color:var(--muted);max-width:660px;margin:0 auto 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:14.5px;font-weight:600;
  padding:14px 26px;border-radius:999px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:.2s}
.btn-gold{background:linear-gradient(180deg,#f7d79a,#e5b462);color:#141a2b;box-shadow:0 12px 34px rgba(242,199,126,.26)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(242,199,126,.36)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.03)}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.micro{font-size:12px;color:var(--dim)}

/* --- sections --- */
section{padding:58px 0; scroll-margin-top:78px}
#workforce{scroll-margin-top:78px}
.eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(21px,4.4vw,31px);line-height:1.4;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;max-width:720px;margin-bottom:30px}
.thread{width:72px;height:2px;border-radius:2px;margin-top:18px;
  background:linear-gradient(90deg,var(--coral),var(--gold),var(--cyan))}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.22s}
.card:hover{border-color:rgba(242,199,126,.30);background:rgba(242,199,126,.045);transform:translateY(-2px)}
.card h3{font-size:15px;font-weight:700;margin-bottom:7px;color:#fff}
.card p{font-size:13.6px;color:var(--muted)}
.card .num{font-family:var(--en);font-size:11px;letter-spacing:.18em;color:var(--gold);display:block;margin-bottom:9px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.col.yes{border-color:rgba(63,192,221,.28)}
.col.no{border-color:rgba(232,118,63,.26)}
.col h3{font-size:14px;letter-spacing:.06em;margin-bottom:14px;text-transform:uppercase}
.col.yes h3{color:var(--cyan)} .col.no h3{color:var(--coral)}
.col ul{list-style:none;display:grid;gap:11px}
.col li{font-size:13.6px;color:var(--muted);padding-inline-start:22px;position:relative}
.col li::before{content:"";position:absolute;inset-inline-start:0;top:9px;width:8px;height:8px;border-radius:50%}
.col.yes li::before{background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
.col.no li::before{background:var(--coral);box-shadow:0 0 9px var(--coral)}
/* steps */
.steps{display:grid;gap:0;margin-top:8px}
.step{display:grid;grid-template-columns:44px 1fr;gap:18px;padding:16px 0;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;inset-inline-start:21px;top:52px;bottom:-4px;width:1px;
  background:linear-gradient(180deg,rgba(242,199,126,.5),rgba(63,192,221,.14))}
.sn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:14px;
  color:var(--gold);border:1px solid rgba(242,199,126,.36);background:rgba(242,199,126,.07);flex-shrink:0}
.step h3{font-size:15px;margin-bottom:5px;color:#fff;padding-top:9px}
.step p{font-size:13.8px;color:var(--muted)}
.note{margin-top:24px;border-inline-start:2px solid var(--gold);background:rgba(242,199,126,.05);
  border-radius:0 12px 12px 0;padding:15px 18px;font-size:13.6px;color:var(--muted)}
html[dir="rtl"] .note{border-radius:12px 0 0 12px}
/* agents */
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.agent b{display:block;font-size:14px;color:#fff;margin-bottom:5px}
.agent small{font-size:11px;color:var(--gold);letter-spacing:.12em;font-family:var(--en);display:block;margin-bottom:8px}
.agent p{font-size:13px;color:var(--muted)}
.agent.gate{border-color:rgba(232,118,63,.4);background:rgba(232,118,63,.06);grid-column:1/-1}
.agent.gate b{color:var(--gold)}
/* doors */
.door{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:.22s}
.door:hover{border-color:rgba(242,199,126,.34);transform:translateY(-3px)}
.door .ic{font-size:22px;margin-bottom:12px}
.door h3{font-size:16.5px;color:#fff;margin-bottom:8px}
.door p{font-size:13.6px;color:var(--muted);margin-bottom:18px;flex:1}
.door a{align-self:flex-start;font-size:13.5px;font-weight:600;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(242,199,126,.4);padding-bottom:2px}
.door a:hover{border-color:var(--gold)}
/* honesty */
.honest{border:1px solid rgba(232,118,63,.24);background:rgba(232,118,63,.045);border-radius:var(--r);padding:24px}
.honest h3{color:var(--gold);font-size:15px;margin-bottom:14px}
.honest ul{list-style:none;display:grid;gap:11px}
.honest li{font-size:13.6px;color:var(--muted);padding-inline-start:20px;position:relative}
.honest li::before{content:"—";position:absolute;inset-inline-start:0;color:var(--coral)}
/* invitation */
.invite{text-align:center;padding:76px 0 40px}
.invite .arch2{width:min(420px,80vw);height:210px;margin:0 auto 26px;border-radius:50% 50% 10px 10px/60% 60% 10px 10px;
  background:radial-gradient(60% 80% at 50% 85%, rgba(242,199,126,.26), transparent 72%);
  border:1px solid rgba(242,199,126,.2);border-bottom:0}
.invite h2{font-size:clamp(23px,5vw,36px)}
footer{border-top:1px solid var(--line);padding:38px 0 30px;margin-top:30px;background:rgba(0,0,0,.22)}
.frow{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;align-items:flex-start}
.flinks{display:flex;flex-wrap:wrap;gap:18px;font-size:13.5px}
.flinks a{color:var(--muted);text-decoration:none}
.flinks a:hover{color:var(--gold)}
.fnote{font-size:12px;color:var(--dim);margin-top:18px;line-height:1.9}
.fbrand{display:flex;align-items:center;gap:12px}
.fbrand img{width:34px;height:auto}
.fbrand div{line-height:1.3}
.fbrand b{letter-spacing:.2em;font-size:14px;color:#fff}
.fbrand span{font-size:10.5px;color:var(--gold);display:block}
/* reveal */
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .stars{animation:none}
  .rv{opacity:1;transform:none;transition:none}
  .card:hover,.door:hover,.btn:hover{transform:none}
}
<style>
/* ===== HEAVEN simulation — scoped styles ===== */
#hv-sim{
  --panel2:rgba(255,255,255,.035); --line2:rgba(255,255,255,.10);
  position:relative; border:1px solid var(--line2); border-radius:22px; overflow:hidden;
  background:linear-gradient(180deg,rgba(10,16,36,.9),rgba(7,11,26,.94));
  box-shadow:0 30px 90px rgba(0,0,0,.45); margin-top:30px;
}
#hv-sim .sim-label{
  position:absolute; top:0; inset-inline-start:0; z-index:6; display:flex; align-items:center; gap:7px;
  font-family:var(--en); font-size:9.5px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase;
  background:rgba(8,13,30,.86); border:1px solid rgba(242,199,126,.24); border-start-start-radius:21px;
  border-end-end-radius:12px; padding:7px 13px; backdrop-filter:blur(6px);
}
#hv-sim .sim-label i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block;box-shadow:0 0 8px var(--gold)}

/* --- scenario picker + metrics --- */
#hv-sim .sim-top{
  display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px;
  padding:52px 18px 14px; border-bottom:1px solid var(--line2);
}
@media(max-width:860px){#hv-sim .sim-top{grid-template-columns:1fr;padding-top:56px}}
#hv-sim .scen{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
@media(max-width:560px){#hv-sim .scen{grid-template-columns:1fr}}
#hv-sim .scen button{
  text-align:start; background:rgba(255,255,255,.025); border:1px solid var(--line2); color:var(--muted);
  border-radius:13px; padding:11px 13px; font:inherit; font-size:12.4px; line-height:1.5; cursor:pointer; transition:.2s;
}
#hv-sim .scen button:hover{border-color:rgba(242,199,126,.3); color:var(--ink)}
#hv-sim .scen button[aria-pressed="true"]{
  border-color:rgba(242,199,126,.55); background:rgba(242,199,126,.08); color:#fff; box-shadow:0 0 0 1px rgba(242,199,126,.18) inset;
}
#hv-sim .scen button b{display:block; font-size:13px; margin-bottom:3px; font-weight:600}
#hv-sim .scen button span{display:block; font-size:11.4px; color:var(--dim); line-height:1.5}
#hv-sim .metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; align-content:start}
#hv-sim .metric{background:rgba(255,255,255,.025); border:1px solid var(--line2); border-radius:12px; padding:9px 12px}
#hv-sim .metric span{display:block; font-size:10px; color:var(--dim); letter-spacing:.06em}
#hv-sim .metric b{font-size:13px; color:var(--ink); font-weight:600}
#hv-sim .metric:nth-child(5){grid-column:1/-1}

/* --- scene --- */
#hv-sim .sim-stage{position:relative; height:clamp(300px,54vh,540px); background:#070b1a}
#hv-sim .sim-stage canvas{position:absolute; inset:0; display:block}
#hv-sim #hv-sky{animation:hv-tw 8s ease-in-out infinite alternate}
@keyframes hv-tw{from{opacity:.82}to{opacity:1}}
#hv-sim .hud{
  position:absolute; top:12px; inset-inline-end:12px; z-index:5; text-align:end;
  font-size:11px; color:var(--muted); pointer-events:none; max-width:56%;
}
#hv-sim .hud .hudk{display:block; font-size:9.5px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase}
#hv-sim .hudstat{font-size:13.5px; font-weight:600; color:var(--gold)}
#hv-sim .simhint{
  position:absolute; bottom:10px; inset-inline-start:12px; z-index:5;
  font-size:10.5px; color:var(--dim); background:rgba(8,13,30,.7); border:1px solid var(--line2);
  border-radius:999px; padding:5px 11px; pointer-events:none;
}
#hv-sim .hudctl{position:absolute; bottom:10px; inset-inline-end:12px; z-index:5; display:flex; gap:6px}
#hv-sim .hudctl select{
  background:rgba(8,13,30,.8); color:var(--muted); border:1px solid var(--line2); border-radius:999px;
  font:inherit; font-size:10.5px; padding:5px 8px; cursor:pointer;
}

/* --- stage chips --- */
#hv-sim .stagechips{display:flex; gap:7px; overflow-x:auto; padding:13px 18px; border-bottom:1px solid var(--line2);
  scrollbar-width:none}
#hv-sim .stagechips::-webkit-scrollbar{display:none}
#hv-sim .chip{
  flex:0 0 auto; font-size:11.5px; color:var(--dim); border:1px solid var(--line2); border-radius:999px;
  padding:6px 12px; white-space:nowrap; cursor:pointer; transition:.2s; background:rgba(255,255,255,.02);
}
#hv-sim .chip:hover{color:var(--ink); border-color:rgba(255,255,255,.22)}
#hv-sim .chip.past{color:var(--muted)}
#hv-sim .chip.on{color:#101828; background:linear-gradient(180deg,#f7d79a,#e5b462); border-color:transparent; font-weight:700}
#hv-sim .chip.gatechip.on{background:linear-gradient(180deg,#f0b45c,#d98f2c); color:#23180a}

/* --- bottom panels --- */
#hv-sim .sim-bottom{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:0; border-bottom:1px solid var(--line2)}
@media(max-width:860px){#hv-sim .sim-bottom{grid-template-columns:1fr}}
#hv-sim .panel{padding:16px 18px}
#hv-sim .panel + .panel{border-inline-start:1px solid var(--line2)}
@media(max-width:860px){#hv-sim .panel + .panel{border-inline-start:0;border-top:1px solid var(--line2)}}
#hv-sim .ptitle{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); margin-bottom:11px}
#hv-sim .crow,#hv-sim .irow{display:flex; gap:10px; font-size:12.4px; padding:5px 0; border-bottom:1px dashed rgba(255,255,255,.055)}
#hv-sim .crow:last-child,#hv-sim .irow:last-child{border-bottom:0}
#hv-sim .crow span,#hv-sim .irow span{color:var(--dim); flex:0 0 84px}
#hv-sim .crow b,#hv-sim .irow b{color:var(--ink); font-weight:500}
#hv-sim .ihead{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap}
#hv-sim .ihead b{font-size:15px; color:#fff}
#hv-sim .ibadge{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line2); color:var(--dim);
  border-radius:999px; padding:3px 9px}
#hv-sim .ibadge.on{color:var(--gold); border-color:rgba(242,199,126,.42); background:rgba(242,199,126,.08)}
#hv-sim .irole{font-size:13px; color:var(--muted); margin-bottom:11px}
#hv-sim .inever{margin-top:10px; font-size:12px; color:var(--muted); border-inline-start:2px solid var(--coral);
  padding:2px 0 2px 10px; background:rgba(232,118,63,.05); border-radius:0 8px 8px 0}
html[dir="rtl"] #hv-sim .inever{padding:2px 10px 2px 0;border-radius:8px 0 0 8px}
#hv-sim .inever span{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--coral); margin-bottom:3px}
#hv-sim .lempty{font-size:12.5px; color:var(--dim); line-height:1.9}

/* --- log --- */
#hv-sim .logbox{border-top:1px solid var(--line2)}
#hv-sim .logbody{max-height:230px; overflow-y:auto; padding:12px 18px; font-family:var(--en); font-variant-numeric:tabular-nums}
#hv-sim .lrow{display:grid; grid-template-columns:44px 92px 1fr; gap:10px; align-items:baseline;
  font-size:11.8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.045); animation:hv-in .32s ease}
@keyframes hv-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#hv-sim .ln{color:var(--dim); font-size:10.5px}
#hv-sim .la{color:var(--cyan); font-size:10.5px; letter-spacing:.03em}
#hv-sim .lt{color:var(--muted); font-family:var(--ar); font-size:12.2px}
html[lang="en"] #hv-sim .lt{font-family:var(--en)}
#hv-sim .lrow.ok .lt{color:#8fe2b6} #hv-sim .lrow.warn .lt{color:#f0c179}
#hv-sim .lrow.bad .lt{color:#f09a72} #hv-sim .lrow.bad .ln,#hv-sim .lrow.bad .la{color:var(--coral)}
@media(max-width:560px){
  #hv-sim .lrow{grid-template-columns:38px 1fr; gap:6px}
  #hv-sim .la{display:none}
}

/* --- controls --- */
#hv-sim .simctl{display:flex; flex-wrap:wrap; gap:9px; align-items:center; padding:14px 18px; border-top:1px solid var(--line2)}
#hv-sim .simctl .spacer{flex:1}
#hv-sim .btn.sm,#hv-sim button.btn-gold.sm,#hv-sim button.btn-ghost.sm{
  font:inherit; font-size:12.5px; font-weight:600; padding:9px 17px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line2); background:rgba(255,255,255,.035); color:var(--ink); transition:.2s;
}
#hv-sim button.btn-gold.sm{background:linear-gradient(180deg,#f7d79a,#e5b462); color:#141a2b; border-color:transparent}
#hv-sim button.btn-gold.sm:hover{transform:translateY(-1px)}
#hv-sim button.btn-ghost.sm:hover{border-color:rgba(255,255,255,.26)}
#hv-sim button.sm.on{background:rgba(242,199,126,.14); border-color:rgba(242,199,126,.45); color:var(--gold)}
#hv-sim button.sm.danger:hover{border-color:rgba(232,118,63,.5); color:#f0a37c}
#hv-sim .spd{display:flex; gap:2px; border:1px solid var(--line2); border-radius:999px; padding:2px}
#hv-sim .spd button{background:none; border:0; color:var(--dim); font:inherit; font-size:10.5px; padding:5px 10px;
  border-radius:999px; cursor:pointer}
#hv-sim .spd button[aria-pressed="true"]{background:rgba(255,255,255,.1); color:var(--ink)}

/* --- gate bar --- */
#hv-sim .gatebar{
  display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center;
  padding:16px 18px; border-top:1px solid rgba(242,199,126,.3);
  background:linear-gradient(180deg,rgba(242,199,126,.10),rgba(232,118,63,.05));
  animation:hv-gate .4s ease;
}
@keyframes hv-gate{from{opacity:0}to{opacity:1}}
@media(max-width:700px){#hv-sim .gatebar{grid-template-columns:1fr}}
#hv-sim .gateq .gk{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber,#e8a23f)}
#hv-sim .gateq p{font-size:13.6px; color:#fff; margin-top:4px; line-height:1.65}
#hv-sim .gact{display:flex; gap:9px; flex-wrap:wrap}
#hv-sim .gatebar[hidden]{display:none}
@media(prefers-reduced-motion:reduce){
  #hv-sim #hv-sky{animation:none}
  #hv-sim .lrow{animation:none}
  #hv-sim .gatebar{animation:none}
  #hv-sim button:hover{transform:none}
}
/* compact variant for the standalone full-screen page */
body.simfull #hv-sim{border-radius:0; border-inline:0; margin-top:0; min-height:calc(100vh - 66px)}
body.simfull #hv-sim .sim-stage{height:clamp(320px,56vh,620px)}

</style>

  <span class="pill"><i></i><span data-ar="محاكاة تفاعلية · بيانات خيالية" data-en="Interactive simulation · fictional data"></span></span>
  <h1 data-ar="شاهد المنظومة تعمل" data-en="Watch the system run"></h1>
  <p class="lede" data-ar="سبعة وكلاء محدودي الصلاحية، وطابور مهام، ومطابقة معلنة الأسباب، وبوابة قرار بشري — كل ذلك يعمل داخل متصفحك بلا اتصال بشبكة." data-en="Seven narrowly scoped agents, a task queue, matching with published reasons, and a human decision gate — all running inside your browser with no network connection."></p>

  </div>
</div>
<section id="workforce" class="wrap">
  <p class="eyebrow" data-ar="منظومة العمل" data-en="The workforce"></p>
  <h2 data-ar="شاهد المسار يعمل — خطوة بخطوة، بيد بشرية على البوابة" data-en="Watch the path run — step by step, with a human hand on the gate"></h2>
  <p class="sub" data-ar="محاكاة تفاعلية لمنظومة HEAVEN: سبعة وكلاء محدودي الصلاحية، وطابور مهام، ومطابقة معلنة الأسباب، وبوابة قرار بشري. كل الأسماء والأرقام والحالات في هذه الصفحة خيالية، والمحرك يعمل داخل متصفحك بلا أي اتصال بشبكة." data-en="An interactive simulation of the HEAVEN system: seven narrowly scoped agents, a task queue, matching with published reasons, and a human decision gate. Every name, number and case on this page is fictional, and the engine runs inside your browser with no network connection at all."></p>

  <div class="sim" id="hv-sim">
    <div class="sim-label"><i></i> HEAVEN interactive simulation · fictional data</div>

    <div class="sim-top">
      <div class="scen" role="group" aria-label="scenario paths"></div>
      <div class="metrics"></div>
    </div>

    <div class="sim-stage">
      <canvas id="hv-sky" aria-hidden="true"></canvas>
      <canvas id="hv-scene" role="img" aria-label="interactive simulation of the HEAVEN workflow; tap a node to inspect it"></canvas>
      <div class="hud"><span class="hudk" data-ar="الحالة" data-en="Status"></span><span class="hudstat"></span></div>
      <span class="simhint" data-ar="المس أي عقدة لتعرف دورها وحدودها" data-en="Tap any node to see its role and its limits"></span>
      <div class="hudctl">
        <select id="hvq" data-quality aria-label="quality">
          <option value="high" data-ar="جودة عالية" data-en="High quality"></option>
          <option value="med" data-ar="متوسطة" data-en="Medium"></option>
          <option value="low" data-ar="خفيفة" data-en="Light"></option>
        </select>
      </div>
    </div>

    <div class="stagechips" role="list"></div>

    <div class="sim-bottom">
      <div class="panel">
        <p class="ptitle" data-ar="حالة الحالة الجارية" data-en="Active case status"></p>
        <div class="casebody"></div>
      </div>
      <div class="panel">
        <p class="ptitle" data-ar="مفتش الوكلاء" data-en="Agent inspector"></p>
        <div class="inspbody"></div>
      </div>
    </div>

    <div class="logbox">
      <p class="ptitle" style="padding:14px 18px 0" data-ar="سجل أفعال الوكلاء — تدفق الأحداث" data-en="Agent action history — live event stream"></p>
      <div class="logbody"></div>
    </div>

    <div class="gatebar" hidden></div>

    <div class="simctl">
      <button class="btn-gold sm" data-act="start" data-ar="ابدأ المحاكاة" data-en="Start simulation"></button>
      <button class="btn-ghost sm" data-act="auto" data-ar="تشغيل تلقائي" data-en="Auto-play"></button>
      <button class="btn-ghost sm" data-act="reset" data-ar="إعادة" data-en="Reset"></button>
      <div class="spacer"></div>
      <div class="spd" role="group" aria-label="speed">
        <button data-speed="2400" aria-pressed="false" data-ar="هادئ" data-en="Slow"></button>
        <button data-speed="1500" aria-pressed="true" data-ar="عادي" data-en="Normal"></button>
        <button data-speed="750" aria-pressed="false" data-ar="سريع" data-en="Fast"></button>
      </div>
    </div>
  </div>

  <noscript>
    <p class="note" style="margin-top:16px">المحاكاة تحتاج JavaScript. يمكنك دائماً استخدام المنصة مباشرة على perchance.org/heaven-ai — والمحتوى أعلاه يشرح المنظومة كاملة.</p>
  </noscript>

  <div class="note" style="margin-top:22px">
    <b data-ar="ما لا تدّعيه هذه المحاكاة:" data-en="What this simulation does not claim:"></b>
    <span data-ar="لا نماذج ذكاء اصطناعي مُشغَّلة، ولا مزوّدو خدمات حقيقيون، ولا اتصال بخادم. سبعة وكلاء منطق محلي حتمي داخل متصفحك، والبيانات خيالية بالكامل، وإعادة التشغيل تعطي النتيجة نفسها. الهدف إظهار آلية القرار — لا إيهام بأرقام حقيقية." data-en="No AI models are running, no real service providers exist, and there is no backend contact. The seven agents are deterministic local logic inside your browser, the data is entirely fictional, and a replay produces an identical run. The purpose is to show the decision mechanism — never to imply real numbers."></span>
  </div>
</section>

<script>/* HEAVEN — shared bilingual layer (AR default, full RTL mirroring) */
(function () {
  'use strict';
  var listeners = [];
  var HV = {
    lang: 'ar',
    on: function (fn) { listeners.push(fn); },
    apply: function (root) {
      var scope = root || document;
      var nodes = scope.querySelectorAll('[data-ar]');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (el.tagName === 'HTML' || el.tagName === 'CANVAS') continue;
        var v = el.getAttribute('data-' + HV.lang);
        if (v !== null) el.textContent = v;
      }
      var lAr = document.getElementById('lAr'), lEn = document.getElementById('lEn');
      if (lAr && lEn) {
        lAr.setAttribute('aria-pressed', String(HV.lang === 'ar'));
        lEn.setAttribute('aria-pressed', String(HV.lang === 'en'));
      }
    },
    set: function (lang) {
      HV.lang = (lang === 'en') ? 'en' : 'ar';
      document.documentElement.lang = HV.lang;
      document.documentElement.dir = (HV.lang === 'ar') ? 'rtl' : 'ltr';
      HV.apply(document);
      try { localStorage.setItem('heaven-lang', HV.lang); } catch (e) {}
      for (var i = 0; i < listeners.length; i++) { try { listeners[i](HV.lang); } catch (e) {} }
    }
  };
  window.HV = HV;

  function boot() {
    var lAr = document.getElementById('lAr'), lEn = document.getElementById('lEn');
    if (lAr) lAr.addEventListener('click', function () { HV.set('ar'); });
    if (lEn) lEn.addEventListener('click', function () { HV.set('en'); });

    var burger = document.getElementById('burger'), nav = document.getElementById('nav');
    if (burger && nav) {
      burger.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        burger.setAttribute('aria-expanded', String(open));
      });
      var links = nav.querySelectorAll('a');
      for (var i = 0; i < links.length; i++) {
        links[i].addEventListener('click', function () {
          nav.classList.remove('open'); burger.setAttribute('aria-expanded', 'false');
        });
      }
    }

    var yr = document.getElementById('yr');
    if (yr) yr.textContent = new Date().getFullYear();

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var els = document.querySelectorAll('.rv');
    if (reduce || !('IntersectionObserver' in window)) {
      for (var j = 0; j < els.length; j++) els[j].classList.add('in');
    } else {
      var io = new IntersectionObserver(function (en) {
        en.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
      for (var k = 0; k < els.length; k++) io.observe(els[k]);
    }

    var saved = 'ar';
    try { saved = localStorage.getItem('heaven-lang') || 'ar'; } catch (e) {}
    HV.set(saved);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

/* ---------- engine (pure, testable) ---------- */
function createEngine(){
  var st = { sid:'success', queue:[], i:0, paused:null, seq:0, log:[], active:null, last:null,
             stage:0, done:false, tone:null, gateCount:0, caseMarker:null };
  function reset(sid){
    st.sid = sid || st.sid;
    var s = SCENARIOS[st.sid];
    st.queue = s.pre.slice(); st.i = 0; st.paused = null; st.seq = 0; st.log = [];
    st.active = null; st.last = null; st.stage = 0; st.done = false; st.tone = null; st.gateCount = 0;
    st.caseMarker = null;
    return s;
  }
  function emit(step, kindLabel){
    st.seq++;
    var e = { n:st.seq, t:Date.now(), agent:step.ag, k:step.k, tone:step.tone||null,
              ar:step.ar, en:step.en };
    st.log.unshift(e);
    if (st.log.length > 80) st.log.pop();
    st.last = e;
    return e;
  }
  function agentStage(id){
    if (id === 'gate') return 5;
    for (var d=0; d<NODE_DEFS.length; d++){ if (NODE_DEFS[d].id === id) return NODE_DEFS[d].stage; }
    return st.stage;
  }
  function push(list){ st.queue = list.slice(); st.i = 0; }
  function advance(){
    if (st.paused) return {type:'paused'};
    var s = SCENARIOS[st.sid];
    if (st.queue.length === 0){
      // pre-branch exhausted with no gate -> nothing left
      return finish();
    }
    var step = st.queue.shift();
    st.active = step.ag === 'gate' ? 'gate' : step.ag;
    st.stage = agentStage(step.ag);
    if (step.k === 'gate'){
      st.gateCount++;
      emit(step);
      st.paused = { kind:'gate',
        ar:s.gate_ar, en:s.gate_en,
        approve_ar:'موافقة بشرية', approve_en:'Approve (human)',
        decline_ar:'رفض', decline_en:'Decline',
        approve_label_ar:'قرار بشري مسجَّل: موافقة', approve_label_en:'Human decision logged: approved',
        decline_label_ar:'قرار بشري مسجَّل: رفض', decline_label_en:'Human decision logged: declined' };
      return {type:'gate', step:step};
    }
    if (step.k === 'clarify'){
      emit(step);
      st.paused = { kind:'clarify',
        ar:s.clarify_ar, en:s.clarify_en,
        cta_ar:'أرسل الإيضاح', cta_en:'Send the clarification' };
      return {type:'clarify', step:step};
    }
    if (step.k === 'handoff'){ emit(step); return {type:'handoff', step:step, to:step.to}; }
    if (step.k === 'outcome'){ emit(step); st.tone = step.tone||'ok'; st.done = true;
      st.caseMarker = (step.tone === 'warn') ? 'warn' : (step.tone === 'fail' ? 'fail' : null);
      return {type:'outcome', step:step}; }
    emit(step);
    return {type:'work', step:step};
  }
  function finish(){
    st.done = true; st.active = null;
    return {type:'end'};
  }
  function decide(kind){
    var s = SCENARIOS[st.sid];
    if (!st.paused) return {type:'none'};
    var p = st.paused; st.paused = null;
    if (p.kind === 'gate'){
      var branch = (kind === 'decline') ? s.decline : s.approve;
      push(branch.slice());
    } else {
      push((s.after||[]).slice());
    }
    return {type:'resumed'};
  }
  return {
    st:st, reset:reset, advance:advance, decide:decide,
    scenario:function(){ return SCENARIOS[st.sid]; },
    progress:function(){ var s=SCENARIOS[st.sid]; var tot=s.pre.length+ (s.approve?s.approve.length:0);
      var doneCount = st.seq; return {done:doneCount, total:tot}; }
  };
}

/* ---------- geometries for the core ---------- */
function buildGeometries(n){
  var sph = [], cube = [], tor = [], i;
  for (i=0; i<n; i++){
    var y = 1 - (i/(n-1))*2;
    var r = Math.sqrt(Math.max(0, 1 - y*y));
    var phi = i * 2.399963229728653;
    var x = Math.cos(phi)*r, z = Math.sin(phi)*r;
    sph.push({x:x, y:y, z:z});
    var m = Math.max(Math.abs(x), Math.abs(y), Math.abs(z)) || 1e-6;
    cube.push({x:x/m, y:y/m, z:z/m});
    var u = (i/n) * Math.PI * 2 * 1.0;
    var v = ((i*7)%n)/n * Math.PI * 2;
    var R = 0.72, rr = 0.34;
    tor.push({ x:(R + rr*Math.cos(v))*Math.cos(u), y: rr*Math.sin(v), z:(R + rr*Math.cos(v))*Math.sin(u) });
  }
  // filament links between near neighbours (on the sphere), capped for performance

          var past = (st.seq && n.stage <= st.stage) ? ' past' : '';
          return '<span class="chip' + on + past + '" data-node="' + n.id + '">' +
                 esc(lang() === 'ar' ? n.ar : n.en) + '</span>';
        }).join('') + '<span class="chip gatechip' + (st.active === 'gate' ? ' on' : '') + '" data-node="gate">' +
          esc(lang() === 'ar' ? 'بوابة بشرية' : 'Human gate') + '</span>';
      }
      // case card
      if (elCase) {
        var k2 = s.kase;
        var rows2 = [
          [lang() === 'ar' ? 'الحالة' : 'Case', lang() === 'ar' ? k2.house_ar : k2.house_en],
          [lang() === 'ar' ? 'الحاجة' : 'Need', lang() === 'ar' ? k2.need_ar : k2.need_en],
          [lang() === 'ar' ? 'القيود' : 'Constraints', lang() === 'ar' ? k2.con_ar : k2.con_en],
          [lang() === 'ar' ? 'المرحلة' : 'Stage', st.last ? stageName(st.last.agent) : '—'],
          [lang() === 'ar' ? 'النتيجة' : 'Outcome', st.done ? (st.tone === 'ok' ? (lang() === 'ar' ? 'مؤكَّد' : 'Confirmed') : (lang() === 'ar' ? 'غير مؤكَّد' : 'Unconfirmed')) : (lang() === 'ar' ? 'قيد المعالجة' : 'In progress')]
        ];
        elCase.innerHTML = rows2.map(function (r) {
          return '<div class="crow"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
        }).join('');
      }
      // log
      if (elLog) {
        if (!st.log.length) {
          elLog.innerHTML = '<div class="lempty">' + (lang() === 'ar'
            ? 'السجل فارغ — اختر مساراً واضغط «ابدأ». كل البيانات خيالية.'
            : 'Log empty — pick a path and press Start. All data is fictional.') + '</div>';
        } else {
          elLog.innerHTML = st.log.map(function (e) {
            var tone = e.tone === 'ok' ? ' ok' : (e.tone ? ' warn' : (e.k === 'fail' ? ' bad' : ''));
            return '<div class="lrow' + tone + '"><span class="ln">#' + pad(e.n) + '</span>' +
              '<span class="la">' + esc(stageName(e.agent)) + '</span>' +
              '<span class="lt">' + esc(lang() === 'ar' ? e.ar : e.en) + '</span></div>';
          }).join('');
        }
      }
      renderInspector();
      renderGate();
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function stageName(id) {
      if (id === 'gate') return lang() === 'ar' ? 'المراجعة البشرية' : 'Human review';
      var f = NODE_DEFS.filter(function (n) { return n.id === id; })[0];
      return f ? (lang() === 'ar' ? f.ar : f.en) : id;
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function renderInspector() {
      if (!elInsp) return;
      var d = null;
      if (sel === 'gate') d = GATE_DEF;
      else if (sel) d = NODE_DEFS.filter(function (n) { return n.id === sel; })[0];
      if (!d) {
        elInsp.innerHTML = '<div class="lempty">' + (lang() === 'ar'
          ? 'المس أي عقدة في المشهد لتعرف دورها وحدودها.'
          : 'Tap any node in the scene to see its role and its limits.') + '</div>';
        return;
      }
      var st = eng.st;
      var isNow = (st.active === d.id);
      elInsp.innerHTML =
        '<div class="ihead"><b>' + esc(lang() === 'ar' ? d.ar : d.en) + '</b>' +
        '<span class="ibadge' + (isNow ? ' on' : '') + '">' +
        esc(isNow ? (lang() === 'ar' ? 'نشط الآن' : 'Active now') : (lang() === 'ar' ? 'في الانتظار' : 'Idle')) + '</span></div>' +
        '<p class="irole">' + esc(lang() === 'ar' ? d.role_ar : d.role_en) + '</p>' +
        '<div class="irow"><span>' + esc(lang() === 'ar' ? 'المدخل' : 'Input') + '</span><b>' + esc(lang() === 'ar' ? d.in_ar : d.in_en) + '</b></div>' +
        '<div class="irow"><span>' + esc(lang() === 'ar' ? 'المخرج' : 'Output') + '</span><b>' + esc(lang() === 'ar' ? d.out_ar : d.out_en) + '</b></div>' +
        '<div class="inever"><span>' + esc(lang() === 'ar' ? 'ما لا يفعله أبداً' : 'What it never does') + '</span>' +
        esc(lang() === 'ar' ? d.never_ar : d.never_en) + '</div>';
    }

    function renderGate() {
      if (!elGate) return;
      var st = eng.st;
      if (!st.paused) { elGate.hidden = true; elGate.innerHTML = ''; scene.hot('gate', false); return; }
      elGate.hidden = false;
      var p = st.paused;
      var q = lang() === 'ar' ? p.ar : p.en;
      var btns = (p.kind === 'gate')
        ? '<button class="btn-gold sm" data-act="approve">' + esc(lang() === 'ar' ? p.approve_ar : p.approve_en) + '</button>' +
          '<button class="btn-ghost sm danger" data-act="decline">' + esc(lang() === 'ar' ? p.decline_ar : p.decline_en) + '</button>'
        : '<button class="btn-gold sm" data-act="clarify">' + esc(lang() === 'ar' ? p.cta_ar : p.cta_en) + '</button>';
      elGate.innerHTML = '<div class="gateq"><span class="gk">' +
        esc(p.kind === 'gate' ? (lang() === 'ar' ? 'قرار مؤثر' : 'Consequential step') : (lang() === 'ar' ? 'توقف وإيضاح' : 'Halt and clarify')) +
        '</span><p>' + esc(q) + '</p></div><div class="gact">' + btns + '</div>';
      scene.hot('gate', true);
    }

    /* --- stepping --- */
    function apply(r) {
      if (!r) return;
      if (r.type === 'handoff' && r.to) scene.handoff(r.step.ag, r.to);
      if (r.type === 'gate' || r.type === 'clarify') { stopAuto(); }
      if (r.type === 'outcome') {
        scene.marker(r.step.tone && r.step.tone !== 'ok');
        stopAuto();
      }
      if (r.type === 'work' || r.type === 'pass' || r.type === 'fail') {
        scene.clearHot(); if (r.step.ag !== 'gate') scene.hot(r.step.ag, true);
      }
      renderAll();
    }
    function start() {
      if (eng.st.done) resetRun(eng.st.sid);
      if (eng.st.paused) return;
      apply(eng.advance());
    }
    function step() { start(); }
    function resetRun(sid) {
      stopAuto();
      var s = eng.reset(sid);
      scene.clearHot(); scene.marker(false); scene.select(null); sel = null;
      renderAll();
      if (scene.isSlow()) scene.frame();
      void s;
    }
    function autoOn() {
      if (auto) return;
      auto = true; syncAutoBtn();
      tick();
    }
    function tick() {
      if (!auto) return;
      if (eng.st.done || eng.st.paused) { stopAuto(); return; }
      start();
      timer = setTimeout(tick, speed);
    }
    function stopAuto() { auto = false; if (timer) { clearTimeout(timer); timer = null; } syncAutoBtn(); }
    function syncAutoBtn() {
      var b = elQ('[data-act="auto"]');
      if (b) { b.textContent = auto ? (lang() === 'ar' ? 'إيقاف تلقائي' : 'Stop auto') : (lang() === 'ar' ? 'تشغيل تلقائي' : 'Auto-play'); b.classList.toggle('on', auto); }
    }

    function setSpeed(v) {

    }

    /* --- events --- */
    root.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act],[data-scen],[data-node],[data-speed]') : null;
      if (!t) return;
      if (t.hasAttribute('data-scen')) { resetRun(t.getAttribute('data-scen')); return; }
      if (t.hasAttribute('data-speed')) { setSpeed(Number(t.getAttribute('data-speed'))); return; }
      if (t.hasAttribute('data-node')) {
        sel = t.getAttribute('data-node'); scene.select(sel); renderInspector(); return;
      }
      var act = t.getAttribute('data-act');
      if (act === 'start' || act === 'step') { stopAuto(); step(); }
      else if (act === 'auto') { auto ? stopAuto() : autoOn(); }
      else if (act === 'reset') { resetRun(eng.st.sid); }
      else if (act === 'approve' || act === 'decline' || act === 'clarify') {
        if (act === 'decline') scene.hot('gate', false);
        eng.decide(act === 'decline' ? 'decline' : 'ok');
        renderAll(); apply(eng.advance());
      }
    });

    // canvas picking: tap near a node
    var cv = root.querySelector('#hv-scene');
    if (cv) cv.addEventListener('click', function (ev) {
      var r = cv.getBoundingClientRect();
      var hit = scene.pick(ev.clientX - r.left, ev.clientY - r.top);
      if (hit) { sel = hit; scene.select(hit); renderInspector(); }
    });

    // language hook
    if (window.HV && window.HV.on) window.HV.on(function () { renderAll(); syncAutoBtn(); scene.frame(); });

    // visibility
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) {
        en.forEach(function (x) { scene.setVisible(x.isIntersecting); });
      }, { threshold: 0.05 }).observe(root);
    }
    document.addEventListener('visibilitychange', function () { scene.setVisible(!document.hidden); });
    if (window.ResizeObserver) new ResizeObserver(function () { scene.resize(); }).observe(root.querySelector('.sim-stage'));
    window.addEventListener('resize', function () { scene.resize(); });

    var qsel = root.querySelector('[data-quality]');
    if (qsel) qsel.addEventListener('change', function () { scene.setQuality(qsel.value); });

    try { scene.resize(); } catch (e) { if (window.console) console.error('[heaven] scene resize failed', e); }
    try { scene.frame(); } catch (e) { if (window.console) console.error('[heaven] first frame failed', e); }
    try { scene.start(); } catch (e) { if (window.console) console.error('[heaven] loop failed', e); }
    syncAutoBtn();
    renderAll();
    setSpeed(1500);
    if (elHint) elHint.hidden = false;
  }

  if (typeof window !== 'undefined' && typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  }
})();
</script>
