<style>
:root{

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{

}
[hidden]{display:none !important;}
.wrap{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
.brand{font-weight:800; letter-spacing:.18em; font-size:.85rem; color:var(--gold);}
.langbtn{background:transparent; border:1px solid var(--line); color:var(--ink);
  border-radius:999px; padding:8px 16px; font-size:.95rem; cursor:pointer; min-height:44px;}
.langbtn:active{transform:scale(.97);}
h1{font-size:1.9rem; line-height:1.3; margin:.4em 0 .2em;}
h1 .ar{display:block; font-size:1.5rem; color:var(--gold2); font-weight:700;}
.sub{color:var(--dim); margin:0 0 14px;}
.card{background:linear-gradient(180deg,var(--card),#151b3a); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px; margin:12px 0;}
.card h2{margin:.1em 0 .4em; font-size:1.25rem;}
.card h2 .ar{display:block; font-size:1.05rem; color:var(--gold2);}
p{margin:.5em 0;}
.small{font-size:.85rem; color:var(--dim);}
.btn{display:block; width:100%; margin:8px 0; padding:13px 14px; border-radius:12px;
  border:1px solid var(--line); background:#232c5c; color:var(--ink);
  font-size:1rem; line-height:1.5; cursor:pointer; min-height:48px; text-align:center;}
.btn small{display:block; font-size:.82rem; color:var(--dim);}
.btn:active{transform:scale(.99);}
.btn.primary{background:var(--btn); border-color:var(--btn); color:var(--btnink); font-weight:700;}
.btn.primary small{color:#5a4a1c;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.45; cursor:default;}
.btn .ar{display:block; font-size:.92em;}
.kv{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
.tag{font-size:.75rem; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--dim);}
.tag.hot{border-color:var(--gold); color:var(--gold);}
#sky{width:100%; height:auto; display:block; border-radius:var(--radius);
  background:radial-gradient(80% 70% at 50% 30%, #232c5e 0%, #0b1026 70%);
  border:1px solid var(--line);}
.house{cursor:pointer;}
.house circle.glow{fill:#3a4670; transition:fill 1s ease;}
.house.lit circle.glow{fill:var(--gold);}
.house text{fill:var(--ink); font-size:11px; text-anchor:middle;}
.house .st{fill:var(--dim); font-size:9px;}
.thread{stroke:#3a4670; stroke-width:2; transition:stroke 1s ease;}
.thread.lit{stroke:var(--gold); filter:drop-shadow(0 0 4px var(--gold));}
#commHouse{transition:filter 1.2s ease;}
#commHouse.lit{filter:drop-shadow(0 0 18px var(--gold));}
.tw{fill:#fff; opacity:.7; animation:tw 3s infinite ease-in-out;}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes dawn{from{opacity:0}to{opacity:1}}
.dawnshow{animation:dawn 2.5s ease forwards;}
.persona{display:flex; gap:10px; align-items:flex-start; background:#141a3c;
  border:1px solid var(--line); border-radius:12px; padding:10px; margin:8px 0;}
.avatar{flex:0 0 42px; width:42px; height:42px; border-radius:50%; display:flex;

.avatarwrap{position:relative; flex:0 0 42px; width:42px; height:42px;}
.avatarwrap .avatar{position:absolute; inset:0;}
.avatarimg{position:absolute; inset:0; width:42px; height:42px; border-radius:50%; object-fit:cover; opacity:0; transition:opacity .4s ease;}
.avatarimg.on{opacity:1;}
.persona.active{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
.say{display:flex; gap:10px; align-items:flex-start;}
.sayimg{flex:0 0 40px; width:40px; height:40px; border-radius:50%; object-fit:cover; border:1px solid var(--gold);}
.sitehead{flex-wrap:wrap;}
.sitelogo{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--gold); font-weight:800; letter-spacing:.12em; font-size:.85rem;}
.sitelogo img{width:34px; height:auto;}
.sitenav{display:flex; gap:12px;}
.sitenav a{color:var(--ink); font-size:.85rem;}
.titlemark img{width:84px; height:auto; display:block; margin:2px auto;}
#footLinks a{color:var(--gold2);}
@media (prefers-reduced-motion: reduce){.avatarimg{transition:none;}}
.persona button{margin-inline-start:auto; flex-shrink:0; background:transparent;

.say{background:#0e1330; border-inline-start:3px solid var(--gold); border-radius:8px;

.say .who{color:var(--gold2); font-size:.8rem; font-weight:700;}
.firewall{border:1px dashed var(--gold); border-radius:var(--radius); padding:14px; margin:12px 0;}
.firewall strong{color:var(--gold2);}
.nightbar{display:flex; justify-content:space-between; align-items:center; margin:6px 0;}
.nightbar .pill{border:1px solid var(--gold); color:var(--gold); border-radius:999px; padding:4px 14px; font-size:.85rem; white-space:nowrap;}
.result{border-radius:12px; padding:12px 14px; margin:10px 0;}
.result.good{background:rgba(143,227,176,.12); border:1px solid var(--good);}
.result.bad{background:rgba(255,157,157,.10); border:1px solid var(--bad);}
.result strong{display:block; margin-bottom:4px;}
.journal{font-size:.9rem; color:var(--dim);}
.journal li{margin-bottom:6px;}
.enterarch{text-align:center; padding:18px 0 6px;}
.enterarch a{display:inline-block; margin:8px 6px; padding:14px 26px; border-radius:12px;
  background:var(--btn); color:var(--btnink); font-weight:800; text-decoration:none; min-height:48px;}
.enterarch a .ar{display:block; font-size:.85em; font-weight:600;}
.enterarch a.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:600;}
footer{margin-top:26px; text-align:center;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important;}
}
@media (min-width:560px){ h1{font-size:2.3rem;} .wrap{padding-top:26px;} }
</style>
</head>

},
ar:{
 slogan:"لنبنِ المكان الذي تمنّينا وجوده",
 tSub:"قصة قصيرة قابلة للعب عن العالم الذي نبنيه معاً. جيران خياليون، ورسالة حقيقية.",

 start:"← أضئ النور الأول",

 lit:(a,b)=>`${a} من ${b} بيوت مضاءة`,

 endNight:"← استرح حتى الصباح",

 askedWho:{noor:["نور","المستمعة","🌙"], idris:["إدريس","الاستراتيجي","🧭"], salim:["سالم","الشكاك","🪔"]},
 ask:"اسأل",

 endFullT:"الفجر فوق الحي",
 endFull:"ستة خيوط من النور، وسقف واحد يتوهج، وحي تعلم شكله. لم تنقذ أحداً — بل أصغيت ووازنت واخترت وعدت. هذه هي الحرفة كلها: صلة واحدة، وفعل فهم واحد، وشخص واحد في كل مرة.",
 endPartT:"الفجر يأتي على أي حال",
 endPart:(a,b)=>`الفجر يأتي حتى للأعمال غير المكتملة: ${a} من ${b} بيوت مضاءة، والباقي ما زال ينتظر — كما في العالم الحقيقي كل ليلة. ما بنيته قائم. وما بقي دعوة لا فشل.`,
 eFire:"<strong>هؤلاء الجيران كانوا خياليين.</strong> لا شيء مما فعلته هنا ساعد أو أضر إنساناً حقيقياً. أما HEAVEN الحقيقية فتصل أناساً حقيقيين يحتاجون المساعدة بأناس حقيقيين يستطيعون تقديمها — بتنسيق الذكاء الاصطناعي ورعاية بشرية.",

 foot:"دعوة من HEAVEN · محاكاة خيالية · المنصة الحقيقية تفتح بالروابط أعلاه",
 navHome:"صفحة HEAVEN",
 navApp:"افتح المنصة",
 footHome:"صفحة HEAVEN",
 footApp:"افتح المنصة",
 markAlt:"شعار HEAVEN",
 counselNote:"نور وإدريس وسالم مرشدون خياليون.",
 why:{
  skill:{en:"", ar:"المهارة مفقودة"},
  lang:{en:"", ar:"لا لغة مشتركة"},
  window:{en:"", ar:"الوقت غير مناسب"},
  far:{en:"", ar:"بعيد لا يمكن الوصول"},
  hours:{en:"", ar:"لا ساعات متبقية الليلة"}
 },
 miss:(h,r)=>`${h} يذهب لكن لا يتماسك — ${r}.`,
 journalGood:(p,h)=>`🌟 ${p} + ${h}: خيط نور.`,
 journalBad:(p,h)=>`🌫 ${p} + ${h}: ليس هذه المرة — الحاجة تنتظر.`,
 jrH:"يوميات المساء — ما علمتنا الليلة"
}};
/* ================= STATE ================= */
let lang = "en";
let night = 1, resolved = {}, hoursLeft = {}, journalLines = [], activeReq = null;
const $ = id => document.getElementById(id);
const t = () => T[lang];
const L = o => o[lang];
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  $("langBtn").textContent = l === "ar" ? "English" : "عربي";
  $("brandSlogan").textContent = t().slogan;
  renderAll();
}
function show(id){
  ["scr-title","scr-world","scr-req","scr-end"].forEach(s => $(s).hidden = (s !== id));
  window.scrollTo(0,0);
}
/* ================= SKY ================= */
const SVGNS = "http://www.w3.org/2000/svg";
function stars(svg, n, w, h, seed){
  let s = seed;
  const rnd = () => (s = (s*1103515245+12345)&0x7fffffff) / 0x7fffffff;
  for(let i=0;i<n;i++){
    const c = document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx", (rnd()*w).toFixed(0)); c.setAttribute("cy", (rnd()*h).toFixed(0));
    c.setAttribute("r", (rnd()*1.3+0.4).toFixed(1)); c.setAttribute("class","tw");
    c.style.animationDelay = (rnd()*3).toFixed(1)+"s";
    svg.appendChild(c);
  }
}
function drawTitleSky(){
  const svg = $("skyTitle"); svg.innerHTML = "";
  stars(svg, 40, 400, 180, 7);
  [[60,110],[150,70],[250,120],[330,60]].forEach((p,i)=>{
    const c = document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx",p[0]); c.setAttribute("cy",p[1]); c.setAttribute("r",5);
    c.setAttribute("fill","#f5c86e"); c.setAttribute("class","tw");
    c.style.animationDelay = (i*0.7)+"s"; svg.appendChild(c);
  });
}
function houseShape(svg, p, lit, open){
  const g = document.createElementNS(SVGNS,"g");
  g.setAttribute("class","house"+(lit?" lit":""));
  g.setAttribute("transform",`translate(${p.x},${p.y})`);
  const glow = document.createElementNS(SVGNS,"circle");
  glow.setAttribute("r","20"); glow.setAttribute("class","glow"); g.appendChild(glow);
  const roof = document.createElementNS(SVGNS,"polygon");
  roof.setAttribute("points","-11,0 0,-11 11,0"); roof.setAttribute("fill", lit?"#f5c86e":"#2c3763");
  g.appendChild(roof);
  const body = document.createElementNS(SVGNS,"rect");
  body.setAttribute("x","-9"); body.setAttribute("y","0"); body.setAttribute("width","18");
  body.setAttribute("height","13"); body.setAttribute("rx","2"); body.setAttribute("fill", lit?"#ffe3a3":"#4a5688");
  g.appendChild(body);
  const nm = document.createElementNS(SVGNS,"text");
  nm.setAttribute("y","28"); nm.textContent = p.label; g.appendChild(nm);
  const st = document.createElementNS(SVGNS,"text");
  st.setAttribute("y","39"); st.setAttribute("class","st"); st.textContent = p.sub; g.appendChild(st);
  if(open){ g.addEventListener("click", ()=>openReq(p.id)); g.setAttribute("role","button"); g.setAttribute("tabindex","0");
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openReq(p.id);} }); }
  svg.appendChild(g);
}
function drawWorld(){
  const svg = $("sky"); svg.innerHTML = "";
  stars(svg, 45, 400, 300, 21);
  PEOPLE.forEach(p=>{
    if(resolved[p.id]){
      const ln = document.createElementNS(SVGNS,"line");
      ln.setAttribute("x1",p.x); ln.setAttribute("y1",p.y);
      ln.setAttribute("x2",200); ln.setAttribute("y2",150);
      ln.setAttribute("class","thread lit"); svg.appendChild(ln);
    }
  });
  const ch = document.createElementNS(SVGNS,"g");
  ch.setAttribute("id","commHouse");
  const litN = Object.keys(resolved).length;
  if(litN >= 6) ch.setAttribute("class","lit");
  ch.setAttribute("transform","translate(200,150)");
  const halo = document.createElementNS(SVGNS,"circle");
  halo.setAttribute("r","26"); halo.setAttribute("fill", litN>=6 ? "#f5c86e" : "#232c5c");
  ch.appendChild(halo);
  const roof = document.createElementNS(SVGNS,"polygon");
  roof.setAttribute("points","-16,0 0,-16 16,0"); roof.setAttribute("fill", litN>=3 ? "#f5c86e" : "#2c3763");
  ch.appendChild(roof);
  const bd = document.createElementNS(SVGNS,"rect");
  bd.setAttribute("x","-13"); bd.setAttribute("y","0"); bd.setAttribute("width","26");
  bd.setAttribute("height","18"); bd.setAttribute("rx","3"); bd.setAttribute("fill", litN>=1 ? "#ffe3a3" : "#4a5688");
  ch.appendChild(bd);
  const tx = document.createElementNS(SVGNS,"text");
  tx.setAttribute("y","34"); tx.textContent = lang==="ar" ? "بيت المجتمع" : "Community house";
  ch.appendChild(tx);
  svg.appendChild(ch);
  PEOPLE.forEach(p=>{
    const open = !resolved[p.id] && p.night <= night;
    houseShape(svg, {x:p.x, y:p.y, id:p.id, label:L(p.name),
      sub: resolved[p.id] ? "✦" : (p.night<=night ? "?" : "…")}, !!resolved[p.id], open);
  });
}
/* ================= SCREENS ================= */
function activeReqs(){ return PEOPLE.filter(p => p.night <= night && !resolved[p.id]); }
function renderAll(){
  $("tSub").textContent = t().tSub;
  $("titleMark").alt = t().markAlt;
  $("navHomeEl").textContent = t().navHome;
  $("navAppEl").textContent = t().navApp;
  $("tFire").innerHTML = t().tFire;
  $("startBtn").innerHTML = t().start;
  $("footNote").textContent = t().foot;
  $("footLinks").innerHTML = "<a href=\"index.html\">" + t().footHome + "</a> · <a href=\"https://perchance.org/heaven-ai\">" + t().footApp + "</a>";
  drawTitleSky(); drawWorld(); renderWorldText(); renderJournal();
  if(activeReq) renderReq(activeReq);
}
function renderWorldText(){
  $("nightPill").textContent = t().night(night);
  $("litCount").textContent = t().lit(Object.keys(resolved).length, PEOPLE.length);
  $("wAskH").textContent = lang==="ar" ? "طلبات الليلة" : "Tonight's asks";
  $("wAskP").textContent = t().wAskP;
  $("wHelpH").textContent = lang==="ar" ? "الأيدي المستيقظة" : "Awake hands";
  $("endNightBtn").textContent = t().endNight;
  $("wJrH").textContent = t().jrH;
  const rl = $("reqList"); rl.innerHTML = "";
  activeReqs().forEach(p=>{
    const b = document.createElement("button");
    b.className = "btn";
    b.innerHTML = `${L(p.name)} <span class="tag${p.urg>=3?" hot":""}">${"!".repeat(p.urg)} ${L(p.need)}</span><span class="ar">${lang==="en"?p.name.ar:""}</span>`;
    b.addEventListener("click", ()=>openReq(p.id));
    rl.appendChild(b);
  });
  if(!activeReqs().length){
    const d = document.createElement("div");
    d.className = "small"; d.textContent = t().nightDone(0);
    rl.appendChild(d);
  }
  const hl = $("helpList"); hl.innerHTML = "";
  HELPERS.forEach(h=>{
    const d = document.createElement("div");
    d.style.marginBottom = "8px";
    d.innerHTML = `<strong>${L(h.name)}</strong> · ${t().hrs(hoursLeft[h.id])}<br><span>${L(h.caps)}</span>`;
    hl.appendChild(d);
  });
}
function renderJournal(){
  const j = $("journal"); j.innerHTML = "";
  if(!journalLines.length){
    const li = document.createElement("li");
    li.textContent = lang==="ar" ? "الليلة صامتة بعد…" : "The night is quiet, so far…";
    j.appendChild(li); return;
  }
  journalLines.slice(-8).forEach(s=>{
    const li = document.createElement("li"); li.textContent = s; j.appendChild(li);
  });
}
function startGame(){
  night = 1; resolved = {}; journalLines = []; activeReq = null;
  hoursLeft = {}; HELPERS.forEach(h => hoursLeft[h.id] = h.hours);
  show("scr-world"); renderAll();
}
function openReq(id){ activeReq = id; renderReq(id); show("scr-req"); }
function renderReq(id){
  const p = PEOPLE.find(x => x.id === id);
  $("rName").innerHTML = `${L(p.name)}<span class="ar">${lang==="en"?p.name.ar:""}</span>`;
  $("rTags").innerHTML =
    `<span class="tag">${L(p.need)}</span><span class="tag">${L(p.lang)}</span>` +
    (p.urg>=2 ? `<span class="tag hot">${"!".repeat(p.urg)}</span>` : "");
  $("rStory").textContent = L(p.story);
  $("rChooseH").textContent = t().choose;
  $("backBtn").textContent = t().back;
  $("counselNoteEl").textContent = t().counselNote;
  const cz = $("counsel"); cz.innerHTML = "";
  Object.keys(t().askedWho).forEach(k=>{
    const w = t().askedWho[k];
    const row = document.createElement("div"); row.className = "persona";
    row.innerHTML = `<span class="avatarwrap"><span class="avatar">${w[2]}</span><img class="avatarimg" src="${AVATAR[k]}" alt="${AVATAR_ALT[lang][k]}" onload="this.classList.add('on')" onerror="this.remove()"></span><div><strong>${w[0]}</strong><br><span class="small">${w[1]}</span></div>`;
    const b = document.createElement("button"); b.textContent = t().ask;
    b.addEventListener("click", ()=>{
      document.querySelectorAll(".persona").forEach(function(r){ r.classList.remove("active"); });
      row.classList.add("active");
      $("sayBox").innerHTML = `<div class="say"><img class="sayimg" src="${AVATAR[k]}" alt="${AVATAR_ALT[lang][k]}" onerror="this.remove()"><div><div class="who">${w[0]} · ${w[1]}</div>${L(p.counsel[k])}</div></div>`;
    });
    row.appendChild(b); cz.appendChild(row);
  });
  const ol = $("optList"); ol.innerHTML = "";
  HELPERS.forEach(h=>{
    const left = hoursLeft[h.id];
    const b = document.createElement("button");
    b.className = "btn";
    b.disabled = left <= 0;
    b.innerHTML = `${L(h.name)} <span class="small">(${t().hrs(left)})</span><br><small>${L(h.caps)}</small>`;
    if(left > 0) b.addEventListener("click", ()=>commit(p, h));
    ol.appendChild(b);
  });
  const w = document.createElement("button");
  w.className = "btn ghost"; w.textContent = t().wait;
  w.addEventListener("click", ()=>{ activeReq = null; show("scr-world"); renderAll(); });
  ol.appendChild(w);
}
function checkMatch(p, h){
  if(hoursLeft[h.id] <= 0) return {ok:false, why:L(t().why.hours)};
  if(h.skills.indexOf(p.skill) < 0) return {ok:false, why:L(t().why.skill)};
  if(h.langs.indexOf(p.plang) < 0) return {ok:false, why:L(t().why.lang)};
  if(p.window !== "any" && h.windows.indexOf(p.window) < 0) return {ok:false, why:L(t().why.window)};
  if(p.district === "far" && !h.far) return {ok:false, why:L(t().why.far)};
  return {ok:true};
}
function commit(p, h){
  const r = checkMatch(p, h);
  hoursLeft[h.id] = Math.max(0, hoursLeft[h.id] - 1);
  const ol = $("optList");
  const box = document.createElement("div");
  if(r.ok){
    resolved[p.id] = h.id;
    journalLines.push(t().journalGood(L(p.name), L(h.name)));
    box.className = "result good";
    box.innerHTML = `<strong>✦ ${t().said.good}</strong>${L(h.name)}${t().goodExtra}`;
  } else {
    journalLines.push(t().journalBad(L(p.name), L(h.name)));
    box.className = "result bad";
    box.innerHTML = `<strong>${t().said.bad}</strong>${t().miss(L(h.name), r.why)}${t().badExtra}`;
  }
  ol.innerHTML = ""; ol.appendChild(box);
  const back = document.createElement("button");
  back.className = "btn primary"; back.textContent = t().back;
  back.addEventListener("click", ()=>{ activeReq = null; show("scr-world"); renderAll(); });
  ol.appendChild(back);
  drawWorld();
}
function endNight(){
  activeReq = null;
  if(night >= 3){ endGame(); return; }
  night++;
  hoursLeft = {}; HELPERS.forEach(h => hoursLeft[h.id] = h.hours);
  const left = activeReqs().length;
  journalLines.push(left === 0 ? t().nightDone(0) : t().carried);
  show("scr-world"); renderAll();
}
function endGame(){
  const n = Object.keys(resolved).length, full = n >= PEOPLE.length;
  $("eTitle").textContent = full ? t().endFullT : t().endPartT;
  $("eBody").textContent = full ? t().endFull : t().endPart(n, PEOPLE.length);
  $("eFire").innerHTML = t().eFire;
  $("eNote").textContent = t().eNote;
  $("againBtn").textContent = t().again;
  show("scr-end");
}
/* ================= WIRE ================= */
$("langBtn").addEventListener("click", ()=>setLang(lang === "en" ? "ar" : "en"));
$("startBtn").addEventListener("click", startGame);
$("endNightBtn").addEventListener("click", endNight);
$("backBtn").addEventListener("click", ()=>{ activeReq = null; show("scr-world"); renderAll(); });
$("againBtn").addEventListener("click", ()=>{ show("scr-title"); renderAll(); });
setLang("en");
</script>
</body>
