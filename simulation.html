<style>/* ============================================================
   HEAVEN — app shell + simulation stage
   Mobile-first application layout: fixed viewport, internal
   scrolling, bottom tab bar, bottom sheet. No page scrolling.
   ============================================================ */
:root{
  --bg:#070b18; --bg2:#0a1024; --panel:rgba(255,255,255,.045); --panel-solid:#0d1striped;
  --glass:rgba(13,20,42,.66); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --ink:#eaf0f8; --muted:#a3b2c9; --dim:#78889f;
  --gold:#f2c77e; --gold2:#e5b462; --cyan:#3fc0dd; --teal:#17c9c0; --coral:#e8763f; --navy:#102846;
  --ok:#5fd39a; --amber:#e8a23f;
  --ar:"Segoe UI",Tahoma,"SF Arabic","Geeza Pro","Noto Naskh Arabic","Droid Arabic Naskh",system-ui,sans-serif;
  --en:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tabbar:62px; --header:54px;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  height:100dvh; min-height:100dvh; overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--ink); font-family:var(--ar); line-height:1.7;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
html[lang="en"] body{font-family:var(--en)}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.only-mobile{display:none}
@media(max-width:760px){ .only-mobile{display:initial} .only-desktop{display:none!important} }

/* ---------------- header ---------------- */
header{
  flex:0 0 auto; height:var(--header); display:flex; align-items:center; gap:10px;
  padding:0 12px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(8,13,30,.96),rgba(8,13,30,.82));
  backdrop-filter:blur(14px); position:relative; z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:30px;height:30px;object-fit:contain;border-radius:7px;background:#f4f7fb;padding:1px}
.bname{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.bname b{font-size:13.5px;letter-spacing:.2em;color:#fff;white-space:nowrap}
.bname span{font-size:9px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hspace{margin-inline-start:auto;display:flex;align-items:center;gap:7px}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(255,255,255,.03)}
.lang button{background:none;border:0;color:var(--dim);font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--gold);color:#141a2b;font-weight:700}
.cta-top{
  display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#f7d79a,#e5b462);
  color:#141a2b;font-weight:700;font-size:12px;padding:9px 13px;border-radius:999px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(242,199,126,.2);
}
.cta-top:active{transform:translateY(1px)}

/* ---------------- views ---------------- */
main{flex:1 1 auto; position:relative; overflow:hidden; z-index:1}
.view{
  position:absolute; inset:0; display:none; flex-direction:column;
  opacity:0; transition:opacity .22s ease;
}
.view.active{display:flex;opacity:1}
.view-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 14px 22px}
.wrap{max-width:980px;margin:0 auto;width:100%}

/* ---------------- typography ---------------- */
h1{font-size:clamp(19px,5.2vw,30px);line-height:1.32;font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(17px,4.4vw,24px);line-height:1.36;font-weight:700}
h3{font-size:15px;font-weight:700;color:#fff}
p{color:var(--muted);font-size:14px}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.sub{color:var(--muted);font-size:13.6px;max-width:70ch}
.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:6px}
.sec-head{margin-bottom:12px}
.hint{font-size:11.5px;color:var(--dim);line-height:1.7}

/* ---------------- tab bar ---------------- */
.tabbar{
  flex:0 0 auto; display:flex; align-items:stretch; justify-content:center; gap:0;
  border-top:1px solid var(--line); background:linear-gradient(180deg,rgba(8,13,30,.9),rgba(6,9,20,.98));
  backdrop-filter:blur(16px); position:relative; z-index:40; height:var(--tabbar);
}
.tabbar .inner{display:flex;width:100%;max-width:640px;margin:0 auto}
.tab{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:none; border:0; color:var(--dim); cursor:pointer; min-height:48px; padding:6px 2px;
  position:relative; transition:color .18s;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;letter-spacing:.01em;line-height:1.2;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--gold)}
.tab[aria-selected="true"]::before{
  content:"";position:absolute;top:0;inset-inline:22%;height:2px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--coral),var(--gold),var(--cyan));
}
.tab.live::after{
  content:"";position:absolute;top:8px;inset-inline-end:calc(50% - 16px);width:6px;height:6px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 8px var(--ok);
}

/* ---------------- simulation stage ---------------- */
#view-sim{padding:0}
.stage-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.stage{
  position:relative;flex:1 1 auto;min-height:210px;overflow:hidden;
  border-bottom:1px solid var(--line); background:#05080f;
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-badge{
  position:absolute;top:8px;inset-inline-start:8px;z-index:6;display:flex;align-items:center;gap:6px;
  font-family:var(--en);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  background:rgba(6,10,22,.8);border:1px solid rgba(242,199,126,.22);border-radius:999px;padding:4px 9px;
  backdrop-filter:blur(6px);pointer-events:none;
}
.stage-badge i{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:hb 2.4s ease-in-out infinite}
@keyframes hb{50%{opacity:.35}}
.stage-status{
  position:absolute;top:8px;inset-inline-end:8px;z-index:6;text-align:end;pointer-events:none;
  background:rgba(6,10,22,.66);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:11px;padding:5px 10px;
}
.stage-status .k{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-family:var(--en)}
.stage-status b{font-size:12.5px;color:var(--gold);font-weight:600}

/* layer chips over the stage */
.layers{
  position:absolute;bottom:8px;inset-inline-start:8px;z-index:7;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 16px);
}
.layer{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);
  background:rgba(6,10,22,.78);border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  cursor:pointer;backdrop-filter:blur(8px);min-height:32px;transition:.18s;
}
.layer .dot{width:6px;height:6px;border-radius:50%;background:#3b4a63}
.layer[aria-pressed="true"]{color:#fff;border-color:rgba(63,192,221,.4);background:rgba(63,192,221,.12)}
.layer[aria-pressed="true"] .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.layer.ops[aria-pressed="true"]{border-color:rgba(232,162,63,.45);background:rgba(232,162,63,.12)}
.layer.ops[aria-pressed="true"] .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}

.zoombar{position:absolute;bottom:8px;inset-inline-end:8px;z-index:7;display:flex;flex-direction:column;gap:5px}
.zbtn{
  width:34px;height:34px;border-radius:11px;background:rgba(6,10,22,.8);border:1px solid var(--line);
  color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);
}
.zbtn:active{background:rgba(255,255,255,.12)}

/* ---------------- HUD panels (operations layer) ---------------- */
.hud{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
@media(max-width:760px){
  .hud-top{flex-direction:column;gap:6px}
  .hud-top .panel{width:auto;padding:7px 10px}
  .hud-top .pt{font-size:8px;margin-bottom:5px}
  .miniflow{margin-bottom:5px}
  .hud .mrow{display:inline-flex;gap:6px;border-bottom:0;padding:0;margin-inline-end:12px;font-size:10px}
  .mrow span{color:var(--dim)}
  .panel.perf .bars{height:18px;margin-bottom:5px}
  .panel.term{bottom:46px;max-width:none;inset-inline:8px;margin:0;padding:7px 10px}
  .termbody{font-size:9px;line-height:1.55;max-height:42px}
  .layers{bottom:8px}
}
.hud .panel{
  position:absolute;background:var(--glass);border:1px solid var(--line);border-radius:13px;
  backdrop-filter:blur(10px);padding:9px 11px;box-shadow:0 12px 34px rgba(0,0,0,.4);pointer-events:auto;
  opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s;
}
.hud.on .panel{opacity:1;transform:none}
.hud .pt{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:7px;font-family:var(--en)}
.hud-top{position:absolute;top:8px;inset-inline:8px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.hud-top .panel{position:static;width:150px;pointer-events:auto}
.panel.term{bottom:8px;inset-inline:8px;max-width:330px;margin-inline:auto;font-family:var(--en)}
.panel.net{display:none}
@media(min-width:1000px){
  .panel.net{display:block;bottom:8px;inset-inline-start:8px;width:172px}
  .hud-top .panel{width:172px}
  .panel.term{inset-inline-end:52px;margin-inline:0;inset-inline-start:auto}
}
/* the badge + status card are redundant while the ops layer is open */
.stage.ops-on .stage-badge, .stage.ops-on .stage-status{opacity:0;transition:opacity .25s}
.badge-short{display:none}
@media(max-width:700px){ .badge-long{display:none} .badge-short{display:inline} }
/* task analysis mini-flow */
.miniflow{display:flex;align-items:center;gap:3px;margin-bottom:8px}
.miniflow i{flex:1 1 0;height:3px;border-radius:2px;background:rgba(255,255,255,.13)}
.miniflow i.done{background:var(--cyan)}
.miniflow i.now{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:2.5px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.mrow:last-child{border-bottom:0}
.mrow span{color:var(--dim)}
.mrow b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--en)}
.bars{display:flex;align-items:flex-end;gap:2px;height:26px;margin-bottom:7px}
.bars i{flex:1 1 0;background:linear-gradient(180deg,var(--cyan),rgba(63,192,221,.2));border-radius:2px 2px 0 0;transition:height .3s}
.bars i.g{background:linear-gradient(180deg,var(--gold),rgba(242,199,126,.2))}
/* terminal */
.termbody{font-size:9.5px;line-height:1.65;font-variant-numeric:tabular-nums;max-height:66px;overflow:hidden}
.termbody .tl{display:flex;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.termbody .tl b{color:var(--dim);font-weight:500}
.termbody .tl.ok b{color:var(--ok)} .termbody .tl.warn b{color:var(--amber)} .termbody .tl.bad b{color:var(--coral)}
.termbody .tl span{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .termbody .tl span{font-family:var(--ar)}

/* ---------------- controls under the stage ---------------- */
.controls{flex:0 0 auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,rgba(8,13,30,.6),transparent)}
.crow1{display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;
  padding:12px 18px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--ink);cursor:pointer;min-height:44px;transition:.18s;white-space:nowrap;
}
.btn.gold{background:linear-gradient(180deg,#f7d79a,#e5b462);color:#141a2b;border-color:transparent;box-shadow:0 8px 22px rgba(242,199,126,.22);flex:1 1 auto}
.btn.ghost{background:rgba(255,255,255,.035)}
.btn.icon{width:44px;padding:0;flex:0 0 auto}
.btn:active{transform:translateY(1px)}
.btn.on{background:rgba(242,199,126,.15);border-color:rgba(242,199,126,.45);color:var(--gold)}
.btn.danger:active{border-color:var(--coral);color:#f2a682}
.ctrls-row2{display:flex;gap:8px;align-items:center}
.spd{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(255,255,255,.03)}
.spd button{background:none;border:0;color:var(--dim);font-size:10.5px;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:30px}
.spd button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--ink)}
.scen-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;scroll-snap-type:x proximity}
.scen-row::-webkit-scrollbar{display:none}
.scen-btn{
  flex:0 0 auto;max-width:230px;text-align:start;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--muted);transition:.18s;scroll-snap-align:start;
}
.scen-btn b{display:block;font-size:12px;color:#fff;font-weight:600;margin-bottom:2px}
.scen-btn small{font-size:10.5px;color:var(--dim);line-height:1.45;display:block}
.scen-btn[aria-pressed="true"]{border-color:rgba(242,199,126,.5);background:rgba(242,199,126,.1);color:var(--ink)}
.scen-btn[aria-pressed="true"] small{color:var(--muted)}

/* ---------------- gate bar ---------------- */
.gatebar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 12px;
  border-top:1px solid rgba(242,199,126,.32);background:linear-gradient(180deg,rgba(242,199,126,.13),rgba(232,118,63,.06));
  animation:gatein .3s ease;
}
@keyframes gatein{from{opacity:0;transform:translateY(6px)}}
.gatebar[hidden]{display:none}
.gatebar .gq{flex:1 1 auto;min-width:0}
.gatebar .gk{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-family:var(--en)}
.gatebar p{font-size:12.6px;color:#fff;line-height:1.5;margin-top:2px}
.gatebar .gact{display:flex;gap:7px;flex:0 0 auto}
.gatebar .btn{padding:10px 14px;font-size:12px;min-height:42px}
@media(max-width:520px){ .gatebar{flex-direction:column;align-items:stretch} .gatebar .gact .btn{flex:1 1 0} }

/* ---------------- bottom sheet ---------------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(4,7,16,.6);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:61;max-height:76dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0b1226,#080d1e);border-top:1px solid var(--line2);
  border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -20px 60px rgba(0,0,0,.55);
}
.sheet.on{transform:none}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:9px auto 4px;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sheet-head h3{font-size:14px}
.sheet-head .x{margin-inline-start:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.sheet-body{overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}

/* ---------------- log rows ---------------- */
.logrow{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);animation:lin .3s ease}
@keyframes lin{from{opacity:0;transform:translateY(-3px)}}
.logrow .n{font-family:var(--en);font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:1px}
.logrow .t{font-size:12.4px;color:var(--muted);line-height:1.6}
.logrow .a{font-size:9.5px;color:var(--cyan);letter-spacing:.02em;display:block;margin-bottom:1px}
.logrow.ok .t{color:#93e3ba} .logrow.ok .a{color:var(--ok)}
.logrow.warn .t{color:#f0c179} .logrow.warn .a{color:var(--amber)}
.logrow.bad .t{color:#f2a682} .logrow.bad .a{color:var(--coral)}
.empty{font-size:12.5px;color:var(--dim);line-height:1.85}

/* case + inspector cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kv{display:flex;gap:10px;font-size:12.4px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--dim);flex:0 0 78px}
.kv b{color:var(--ink);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;background:rgba(255,255,255,.02);transition:.18s;min-height:36px;display:inline-flex;align-items:center}
.chip.on{color:#101828;background:linear-gradient(180deg,#f7d79a,#e5b462);border-color:transparent;font-weight:700}
.chip.past{color:var(--muted)}
.chip.gate.on{background:linear-gradient(180deg,#f0b45c,#d98f2c);color:#23180a}

/* ---------------- content sections ---------------- */
.grid{display:grid;gap:11px}
.g2{grid-template-columns:1fr}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:1fr}
@media(min-width:620px){.g3{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
.steps{display:grid;gap:9px}
.step{display:grid;grid-template-columns:34px 1fr;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.step .sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:12px;color:var(--gold);border:1px solid rgba(242,199,126,.34);background:rgba(242,199,126,.07)}
.step h3{font-size:13.6px;margin-bottom:3px}
.step p{font-size:12.6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.col.yes{border-color:rgba(63,192,221,.26)} .col.no{border-color:rgba(232,118,63,.24)}
.col h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.col.yes h3{color:var(--cyan)} .col.no h3{color:var(--coral)}
.col ul{list-style:none;display:grid;gap:9px}
.col li{font-size:12.6px;color:var(--muted);padding-inline-start:18px;position:relative}
.col li::before{content:"";position:absolute;inset-inline-start:0;top:8px;width:7px;height:7px;border-radius:50%}
.col.yes li::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.col.no li::before{background:var(--coral);box-shadow:0 0 8px var(--coral)}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.agent small{display:block;font-family:var(--en);font-size:9px;letter-spacing:.13em;color:var(--gold);margin-bottom:5px}
.agent b{display:block;font-size:13.4px;color:#fff;margin-bottom:4px}
.agent p{font-size:12.4px}
.agent .never{margin-top:7px;font-size:11.6px;color:var(--muted);border-inline-start:2px solid var(--coral);padding-inline-start:8px}
.agent.gate{border-color:rgba(232,162,63,.42);background:rgba(232,162,63,.07)}
.door{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.door .ic{font-size:17px;margin-bottom:7px}
.door h3{font-size:14px;margin-bottom:5px}
.door p{font-size:12.6px;margin-bottom:12px;flex:1}
.door a{font-size:12.6px;font-weight:600;color:var(--gold);border-bottom:1px solid rgba(242,199,126,.4);padding-bottom:2px;align-self:flex-start}
.honest{border:1px solid rgba(232,118,63,.22);background:rgba(232,118,63,.05);border-radius:var(--radius);padding:14px}
.honest h3{color:var(--gold);font-size:13px;margin-bottom:9px}
.honest ul{list-style:none;display:grid;gap:8px}
.honest li{font-size:12.4px;color:var(--muted);padding-inline-start:16px;position:relative}
.honest li::before{content:"—";position:absolute;inset-inline-start:0;color:var(--coral)}
.note{border-inline-start:2px solid var(--gold);background:rgba(242,199,126,.05);border-radius:0 11px 11px 0;padding:11px 13px;font-size:12.4px;color:var(--muted)}
html[dir="rtl"] .note{border-radius:11px 0 0 11px}
.hero-lite{text-align:center;padding:6px 0 16px}
.hero-lite .plate{display:inline-block;background:#f5f8fc;border-radius:18px;padding:12px 16px;margin-bottom:14px;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px rgba(242,199,126,.22)}
.hero-lite .plate img{width:min(190px,52vw)}
.hero-lite h1{margin-bottom:9px}
.hero-lite .lede{font-size:13.4px;color:var(--muted);max-width:56ch;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;color:var(--gold);border:1px solid rgba(242,199,126,.3);background:rgba(242,199,126,.07);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.pill i{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.cta-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.thread{width:56px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--coral),var(--gold),var(--cyan));margin-top:12px}
footer{padding:16px 0 6px;border-top:1px solid var(--line);margin-top:18px}
.fnote{font-size:11px;color:var(--dim);line-height:1.9}
.flinks{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-bottom:10px}
.flinks a{color:var(--muted)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{inset-inline-start:8px;top:8px;background:var(--gold);color:#0b1026;padding:9px 12px;border-radius:9px;z-index:99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .view{transition:none}
}


/* ============================================================
   MOBILE HUD — slim metric strips at the top of the stage.
   Must stay last in this file: it has to override the desktop
   .hud-top / .panel widths declared earlier.
   ============================================================ */
@media(max-width:760px){
  .hud-top{flex-direction:column;gap:6px}
  .hud-top .panel{width:auto;padding:7px 10px;border-radius:12px}
  .hud-top .pt{display:none}
  .panel.perf .bars{display:none}
  .miniflow{margin-bottom:6px}
  .hud .mrow{display:inline-flex;gap:5px;border-bottom:0;padding:0;margin-inline-end:11px;font-size:10.4px;line-height:1.5}
  .panel.term{bottom:52px;inset-inline:8px;max-width:none;margin:0;padding:7px 10px}
  .termbody{font-size:9px;line-height:1.5;max-height:40px}
  .layers{bottom:8px;gap:4px}
  .layer{font-size:10px;padding:6px 10px;min-height:32px}
  .zoombar{bottom:8px}
}


/* ============================================================
   SHORT SCREENS — a 360x640 phone has ~230px of stage. The op
   layer must yield space to the core instead of consuming it.
   ============================================================ */
@media(max-height:720px){
  .panel.term{display:none}                 /* the log lives in the sheet on short screens */
  .hud-top{gap:4px}
  .hud-top .panel{padding:5px 9px}
  .hud .mrow{font-size:9.6px;margin-inline-end:9px}
  .miniflow{margin-bottom:4px}
  .layers .layer{font-size:9.6px;padding:5px 9px;min-height:29px}
  .stage-status b{font-size:11.5px}
}
@media(max-height:640px){
  .miniflow{display:none}
  .hud-top .panel{padding:4px 8px}
  .hud .mrow{font-size:9.2px}
  .zbtn{width:30px;height:30px;font-size:13px}
}
/* while a human decision is pending, the scenario picker is noise on phones */
@media(max-width:760px){
  .stage-wrap.gated .scen-row{display:none}
  .stage-wrap.gated .stage{min-height:200px}
}

  <!-- ══════════ 2 · HOW IT WORKS ══════════ -->
  <section class="view" id="view-how" role="tabpanel" aria-labelledby="tab-how">
    <div class="view-scroll"><div class="wrap">
      <div class="sec-head">
        <p class="eyebrow" data-ar="كيف تعمل" data-en="How it works"></p>
        <h2 data-ar="ست خطوات، ويد بشرية على البوابة" data-en="Six steps — with a human hand on the gate"></h2>
      </div>
      <div class="steps sec">
        <div class="step"><div class="sn">01</div><div><h3 data-ar="يصف الشخص حاجته بكلماته" data-en="A person describes their need in their own words"></h3><p data-ar="بالعربية أو الإنجليزية، بلا نماذج معقدة وبلا مصطلحات." data-en="In Arabic or English — no complex forms, no jargon."></p></div></div>
        <div class="step"><div class="sn">02</div><div><h3 data-ar="يعيد النظام صياغة ما فهمه" data-en="The system reflects back what it understood"></h3><p data-ar="ملخّص قابل للتصحيح، يفصل الوقائع عن أي استنتاج آلي." data-en="A correctable summary that separates facts from machine inference."></p></div></div>
        <div class="step"><div class="sn">03</div><div><h3 data-ar="تُعرض الخيارات مع سببها" data-en="Options are shown with their reason"></h3><p data-ar="مصدر القدرة، وشرطها، وسبب اقتراحها — لا قائمة عشوائية." data-en="The capacity's source, its condition, and why it was suggested — never a random list."></p></div></div>
        <div class="step"><div class="sn">04</div><div><h3 data-ar="الخطوات المؤثرة تتوقف عند إنسان" data-en="Consequential steps stop for a person"></h3><p data-ar="لا قرار آلي نهائي في منع أساسي أو خطر جسيم." data-en="No automated final decision on a basic denial or serious risk."></p></div></div>
        <div class="step"><div class="sn">05</div><div><h3 data-ar="المساعدة الحقيقية يقدمها البشر" data-en="Real help is delivered by people"></h3><p data-ar="طعام، سكن، مواصلات، رعاية، تعليم — والمنصة تنسّق فقط." data-en="Food, shelter, transport, care, teaching — the platform only coordinates."></p></div></div>
        <div class="step"><div class="sn">06</div><div><h3 data-ar="النتيجة تُؤكَّد أو تُسجَّل كتعثّر" data-en="The outcome is confirmed — or recorded as a stall"></h3><p data-ar="لا يُعلن «تم» بلا تأكيد. الموافقة ليست تسليماً." data-en="“Done” is never declared without confirmation. Approval is not delivery."></p></div></div>
      </div>
      <div class="sec">
        <p class="eyebrow" data-ar="طبقات المنظومة" data-en="System layers"></p>
        <div class="grid g3">
          <div class="agent"><small>LAYER 01 · AGENTS</small><b data-ar="طبقة الوكلاء" data-en="Agent layer"></b><p data-ar="سبعة وكلاء محدودي الصلاحية: استقبال، تحقق، استكشاف، مطابقة، تنسيق، مراجعة، متابعة. لكل وكيل مهمة واحدة وحدود معلنة." data-en="Seven narrowly scoped agents: intake, verification, discovery, matching, coordination, review, follow-up. One task each, with published limits."></p></div>
          <div class="agent"><small>LAYER 02 · DATA</small><b data-ar="طبقة البيانات" data-en="Data layer"></b><p data-ar="طابور مهام دائم، وإيجارات مؤقتة للمهام، وإعادة محاولة بحدود، ومنع تكرار الإشعارات — وكل خطوة تُسجَّل برقم متسلسل." data-en="A durable task queue, time-bounded leases, bounded retries, and notification de-duplication — every step logged with a sequence number."></p></div>
          <div class="agent gate"><small>LAYER 03 · HUMAN</small><b data-ar="الطبقة البشرية" data-en="Human layer"></b><p data-ar="بوابة القرار: الإحالة إلى طرف خارجي لا تُرسل إلا بقرار بشري مسجَّل باسم صاحبه. والحالات غير المؤكَّدة تبقى ظاهرة." data-en="The decision gate: a referral to an outside party is never sent without a human decision recorded under a name. Unconfirmed cases stay visible."></p></div>
        </div>
      </div>
      <div class="note"><b data-ar="الذكاء الاصطناعي ينظّم ويقترح — والمساعدة الحقيقية يأتي بها البشر." data-en="AI organizes and suggests — real help is delivered by people."></b></div>
    </div></div>
  </section>

  <!-- ══════════ 3 · AGENTS ══════════ -->
  <section class="view" id="view-agents" role="tabpanel" aria-labelledby="tab-agents">
    <div class="view-scroll"><div class="wrap">
      <div class="sec-head">
        <p class="eyebrow" data-ar="منظومة الوكلاء" data-en="The agent system"></p>
        <h2 data-ar="كل وكيل أداة محدودة الصلاحية" data-en="Every agent is a narrowly scoped tool"></h2>
        <p class="sub" data-ar="لا شخص مستقل، ولا سلطة خفية. لكل وكيل مالك بشري، ومدخل ومخرج معلنان، وحدّ لا يتجاوزه أبداً — وعند الشك أو الفشل يتوقف ويظهر بديل مفهوم." data-en="Not an autonomous person, not a hidden authority. Each agent has a human owner, a stated input and output, and a line it never crosses — and when uncertain or failing, it stops and a comprehensible fallback appears."></p>
      </div>
      <div class="grid g2" id="agentgrid"></div>
    </div></div>
  </section>

        <h1 data-ar="لنبنِ المكان الذي تمنّينا وجوده." data-en="Build the Place We Wish Existed."></h1>
        <p class="lede" data-ar="HEAVEN جسر هادئ بين من يحتاج المساعدة ومن يستطيع تقديمها. مشروع تنسيق إنساني يسعى إلى تقريب المساعدة ممن يحتاجها — بلا ضجيج، وبلا وعود زائفة." data-en="HEAVEN is a quiet bridge between people who need help and people able to give it. A humanitarian coordination project working to bring assistance closer to the people who need it — quietly, and without false promises."></p>
        <div class="cta-row">
          <button class="btn ghost" data-tab="how" data-ar="كيف تعمل؟" data-en="How does it work?"></button>
          <a class="btn gold" href="https://perchance.org/heaven-ai" target="_blank" rel="noopener"><span data-ar="افتح منصة HEAVEN" data-en="Open the HEAVEN platform"></span> <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="sec">
        <p class="eyebrow" data-ar="عن HEAVEN" data-en="About HEAVEN"></p>
        <h2 data-ar="المشكلة ليست في التعاطف — بل في التنسيق" data-en="The problem isn’t compassion — it’s coordination"></h2>
        <p class="sub" data-ar="كثيرون يريدون المساعدة، وكثيرون يحتاجونها، لكن العثور على بعضهم صعب. HEAVEN يعالج فجوة التنسيق، لا وجود الحاجة — ويخدم طالبي المساعدة والمساهمين الأفراد والمنظمات القادرة على تقديم العون." data-en="Many people want to help, and many need help — but finding each other is hard. HEAVEN addresses the coordination gap, not the existence of need — serving people seeking assistance, individual contributors, and organizations able to provide support."></p>
        <div class="thread"></div>
      </div>
      <div class="sec grid g2">
        <div class="col yes">
          <h3 data-ar="ما هي HEAVEN" data-en="What HEAVEN is"></h3>
          <ul>
            <li data-ar="طبقة تنسيق تربط الحاجة بالقدرة المتاحة." data-en="A coordination layer connecting need with available capacity."></li>
            <li data-ar="تعرض القدرة بحدودها ومصدرها وتوقيتها." data-en="It shows capacity with its limits, source, and timing."></li>
            <li data-ar="تحفظ الخيار والموافقة لكل طرف." data-en="It preserves choice and consent for every party."></li>
            <li data-ar="تشرح سبب كل اقتراح، وتعرض أكثر من خيار متى أمكن." data-en="It explains why each option is suggested, and offers more than one where possible."></li>
          </ul>
        </div>
        <div class="col no">
          <h3 data-ar="ما ليست عليه" data-en="What HEAVEN is not"></h3>
          <ul>
            <li data-ar="ليست جهة تجمع التبرعات أو تصرف أموالاً." data-en="Not a fundraising body and it does not disburse money."></li>
            <li data-ar="ليست خدمة طوارئ." data-en="Not an emergency service."></li>
            <li data-ar="لا تضمن نتيجة، ولا تراقب اللقاءات الواقعية." data-en="It guarantees no outcome and does not supervise real-world meetings."></li>
            <li data-ar="ليست سوقاً يبيع بيانات الناس أو أولويتهم." data-en="Not a marketplace selling people’s data or their priority."></li>
          </ul>
        </div>
      </div>
      <div class="sec grid g2">
        <div class="card"><p class="eyebrow" data-ar="رسالتنا" data-en="Our mission"></p><p style="font-size:15px;color:#fff;line-height:1.75" data-ar="أن نجعل طلب المساعدة أسهل، وتقديمها أكثر أماناً، وتنسيقها أوضح." data-en="Make asking for help easier, offering help safer, and coordinating it clearer."></p></div>
        <div class="card"><p class="eyebrow" data-ar="رؤيتنا" data-en="Our vision"></p><p style="font-size:15px;color:#fff;line-height:1.75" data-ar="عالمٌ لا يضيع فيه طلب صادق بسبب غياب التنسيق، ولا تُهدَر فيه يدٌ ممدودة بسبب غياب الطريق." data-en="A world where no sincere request is lost for lack of coordination, and no willing hand is wasted for lack of a path."></p></div>
      </div>
      <div class="honest sec">
        <h3 data-ar="حدود نتحدث عنها بوضوح" data-en="Limits we state plainly"></h3>
        <ul>
          <li data-ar="لسنا خدمة طوارئ. في الخطر الفوري اتصل بخدمات الطوارئ المحلية." data-en="We are not an emergency service. In immediate danger, contact local emergency services."></li>
          <li data-ar="المتابعة البشرية تجري في أيام العمل؛ المنصة متاحة تقنياً والمتابعة ليست على مدار الساعة." data-en="Human follow-up runs on business days; the platform is technically available, and follow-up is not round-the-clock."></li>
          <li data-ar="لا تتضمن خطة المشروع مساعدات نقدية مباشرة." data-en="The project plan includes no direct cash assistance."></li>
          <li data-ar="لا ننشر أرقاماً عن حجم المجتمع أو نتائج ميدانية، ولا ندّعي تشغيلاً ذاتياً مستمراً." data-en="We publish no community-size figures or field outcomes, and claim no continuous autonomous operation."></li>
          <li data-ar="شارة التحقق تعني اكتمال التحقق المتاح في تلك اللحظة، لا ضماناً من HEAVEN." data-en="A verification badge means the available checks were completed at that time — not a guarantee from HEAVEN."></li>
          <li data-ar="أي رابط أو قائمة هنا ليست تحققاً مستقلاً من شخص أو منظمة." data-en="No link or listing here is an independent endorsement of a person or organization."></li>
        </ul>
      </div>
    </div></div>
  </section>

<script>/* HEAVEN — shared bilingual layer (AR default, full RTL mirroring) */
(function () {
  'use strict';
  var listeners = [];
  var HV = {
    lang: 'ar',
    on: function (fn) { listeners.push(fn); },
    apply: function (root) {
      var scope = root || document;
      var nodes = scope.querySelectorAll('[data-ar]');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (el.tagName === 'HTML' || el.tagName === 'CANVAS') continue;
        var v = el.getAttribute('data-' + HV.lang);
        if (v !== null) el.textContent = v;
      }
      var lAr = document.getElementById('lAr'), lEn = document.getElementById('lEn');
      if (lAr && lEn) {
        lAr.setAttribute('aria-pressed', String(HV.lang === 'ar'));
        lEn.setAttribute('aria-pressed', String(HV.lang === 'en'));
      }
    },
    set: function (lang) {
      HV.lang = (lang === 'en') ? 'en' : 'ar';
      document.documentElement.lang = HV.lang;
      document.documentElement.dir = (HV.lang === 'ar') ? 'rtl' : 'ltr';
      HV.apply(document);
      try { localStorage.setItem('heaven-lang', HV.lang); } catch (e) {}
      for (var i = 0; i < listeners.length; i++) { try { listeners[i](HV.lang); } catch (e) {} }
    }
  };
  window.HV = HV;

  function boot() {
    var lAr = document.getElementById('lAr'), lEn = document.getElementById('lEn');
    if (lAr) lAr.addEventListener('click', function () { HV.set('ar'); });
    if (lEn) lEn.addEventListener('click', function () { HV.set('en'); });

    var burger = document.getElementById('burger'), nav = document.getElementById('nav');
    if (burger && nav) {
      burger.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        burger.setAttribute('aria-expanded', String(open));
      });
      var links = nav.querySelectorAll('a');
      for (var i = 0; i < links.length; i++) {
        links[i].addEventListener('click', function () {
          nav.classList.remove('open'); burger.setAttribute('aria-expanded', 'false');
        });
      }
    }

    var yr = document.getElementById('yr');
    if (yr) yr.textContent = new Date().getFullYear();

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var els = document.querySelectorAll('.rv');
    if (reduce || !('IntersectionObserver' in window)) {
      for (var j = 0; j < els.length; j++) els[j].classList.add('in');
    } else {
      var io = new IntersectionObserver(function (en) {
        en.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
      for (var k = 0; k < els.length; k++) io.observe(els[k]);
    }

    var saved = 'ar';
    try { saved = localStorage.getItem('heaven-lang') || 'ar'; } catch (e) {}
    HV.set(saved);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

/* ---------- engine (pure, testable) ---------- */
function createEngine(){
  var st = { sid:'success', queue:[], i:0, paused:null, seq:0, log:[], active:null, last:null,
             stage:0, done:false, tone:null, gateCount:0, caseMarker:null,
             counts:{ work:0, handoff:0, pass:0, fail:0, gate:0, clarify:0, outcome:0 } };
  function reset(sid){
    st.sid = sid || st.sid;
    var s = SCENARIOS[st.sid];
    st.queue = s.pre.slice(); st.i = 0; st.paused = null; st.seq = 0; st.log = [];
    st.active = null; st.last = null; st.stage = 0; st.done = false; st.tone = null; st.gateCount = 0;
    st.caseMarker = null;
    st.counts = { work:0, handoff:0, pass:0, fail:0, gate:0, clarify:0, outcome:0 };
    return s;
  }
  function emit(step){
    st.seq++;
    if (step.k && st.counts[step.k] !== undefined) st.counts[step.k]++;
    LIVE.tick(st, step);
    var e = { n:st.seq, t:Date.now(), agent:step.ag, k:step.k, tone:step.tone||null,
              ar:step.ar, en:step.en };
    st.log.unshift(e);
    if (st.log.length > 80) st.log.pop();
    st.last = e;
    return e;
  }
  function agentStage(id){
    if (id === 'gate') return 5;
    for (var d=0; d<NODE_DEFS.length; d++){ if (NODE_DEFS[d].id === id) return NODE_DEFS[d].stage; }
    return st.stage;
  }
  function push(list){ st.queue = list.slice(); st.i = 0; }
  function advance(){
    if (st.paused) return {type:'paused'};
    var s = SCENARIOS[st.sid];
    if (st.queue.length === 0){
      // pre-branch exhausted with no gate -> nothing left
      return finish();
    }
    var step = st.queue.shift();
    st.active = step.ag === 'gate' ? 'gate' : step.ag;
    st.stage = agentStage(step.ag);
    if (step.k === 'gate'){
      st.gateCount++;
      emit(step);
      st.paused = { kind:'gate',
        ar:s.gate_ar, en:s.gate_en,
        approve_ar:'موافقة بشرية', approve_en:'Approve (human)',
        decline_ar:'رفض', decline_en:'Decline',
        approve_label_ar:'قرار بشري مسجَّل: موافقة', approve_label_en:'Human decision logged: approved',
        decline_label_ar:'قرار بشري مسجَّل: رفض', decline_label_en:'Human decision logged: declined' };
      return {type:'gate', step:step};
    }
    if (step.k === 'clarify'){
      emit(step);
      st.paused = { kind:'clarify',
        ar:s.clarify_ar, en:s.clarify_en,
        cta_ar:'أرسل الإيضاح', cta_en:'Send the clarification' };
      return {type:'clarify', step:step};
    }
    if (step.k === 'handoff'){ emit(step); return {type:'handoff', step:step, to:step.to}; }
    if (step.k === 'outcome'){ emit(step); st.tone = step.tone||'ok'; st.done = true;
      st.caseMarker = (step.tone === 'warn') ? 'warn' : (step.tone === 'fail' ? 'fail' : null);
      return {type:'outcome', step:step}; }
    emit(step);
    return {type:'work', step:step};
  }
  function finish(){
    st.done = true; st.active = null;
    return {type:'end'};
  }
  function decide(kind){
    var s = SCENARIOS[st.sid];
    if (!st.paused) return {type:'none'};
    var p = st.paused; st.paused = null;
    if (p.kind === 'gate'){
      var branch = (kind === 'decline') ? s.decline : s.approve;
      push(branch.slice());
    } else {
      push((s.after||[]).slice());
    }
    return {type:'resumed'};
  }
  return {
    st:st, reset:reset, advance:advance, decide:decide,
    scenario:function(){ return SCENARIOS[st.sid]; },
    progress:function(){ var s=SCENARIOS[st.sid]; var tot=s.pre.length+ (s.approve?s.approve.length:0);
      var doneCount = st.seq; return {done:doneCount, total:tot}; },
    telemetry:function(){ return st.tele || LIVE.blank(); }
  };
}

/* ---------- live telemetry (deterministic: same run, same numbers) ---------- */
var LIVE = {
  tick: function(st, step){
    if (!st.tele) st.tele = LIVE.blank();
    var t = st.tele;
    t.seq = st.seq;
    if (step.k === 'handoff'){ t.handoffs++; t.transfers++; }
    if (step.k === 'pass') t.candidatesPassed++;
    if (step.k === 'fail') t.candidatesRejected++;
    if (step.k === 'gate'){ t.gatesQueued++; t.queueDepth++; }
    if (step.k === 'clarify'){ t.halted++; }
    if (step.k === 'outcome'){ t.outcomes++; }
    if (step.k === 'work') t.operations++;
    // bounded-queue model: work drains the queue, everything else enqueues
    if (step.k !== 'work' && step.k !== 'outcome') t.queueDepth = Math.min(9, t.queueDepth + 1);
    if (step.k === 'work' && t.queueDepth > 0) t.queueDepth--;
    // deterministic pseudo-latency from the sequence number (no randomness)
    var h = (t.seq * 2654435761) % 4294967296;
    t.latency = 38 + (h % 57);
    t.neurons = 140 + st.seq * 96 + (h % 40);
  },
  blank: function(){
    return { seq:0, queueDepth:0, handoffs:0, transfers:0, operations:0, candidatesPassed:0,
             candidatesRejected:0, gatesQueued:0, halted:0, outcomes:0, retries:0, deduped:0,
             latency:0, neurons:0, leases:0 };
  }
};

/* ---------- geometries for the core ---------- */
function buildGeometries(n){
  var sph = [], cube = [], tor = [], i;
  for (i=0; i<n; i++){
    var y = 1 - (i/(n-1))*2;
    var r = Math.sqrt(Math.max(0, 1 - y*y));
    var phi = i * 2.399963229728653;
    var x = Math.cos(phi)*r, z = Math.sin(phi)*r;
    sph.push({x:x, y:y, z:z});
    var m = Math.max(Math.abs(x), Math.abs(y), Math.abs(z)) || 1e-6;
    cube.push({x:x/m, y:y/m, z:z/m});
    var u = (i/n) * Math.PI * 2 * 1.0;
    var v = ((i*7)%n)/n * Math.PI * 2;
    var R = 0.72, rr = 0.34;
    tor.push({ x:(R + rr*Math.cos(v))*Math.cos(u), y: rr*Math.sin(v), z:(R + rr*Math.cos(v))*Math.sin(u) });
  }
  // filament links between near neighbours (on the sphere), capped for performance
  var links = [], cap = Math.min(220, n), j, k;
  for (i=0; i<cap; i++){
    for (j=i+1; j<cap; j++){
      var dx=sph[i].x-sph[j].x, dy=sph[i].y-sph[j].y, dz=sph[i].z-sph[j].z;
      if (dx*dx+dy*dy+dz*dz < 0.045){ links.push([i,j]); if (links.length>620) break; }
    }
    if (links.length>620) break;
  }
  return {sph:sph, cube:cube, tor:tor, links:links};
}

      var n = Math.round((W * H) / 7000);
      for (var i = 0; i < n; i++) {
        stars.push({ x: r() * W, y: r() * H, a: 0.12 + r() * 0.5, s: r() < 0.9 ? 1 : 1.6,
                     w: r() > 0.75, tw: r() * 6 });
      }
    }
    function resize() {
      if (!sprites.length) makeSprites();
      if (!geom) rebuild();
      var r = cv.getBoundingClientRect();
      W = Math.max(220, Math.round(r.width)); H = Math.max(190, Math.round(r.height));
      DPR = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cx = W / 2; cy = H * 0.505;
      scl = 1.02 * Math.min(W, H);
      vignette = null;
      makeStars();
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#05080f'); g.addColorStop(0.5, '#080e20'); g.addColorStop(1, '#05080f');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (slow) frame();
    }
    function project(x, y, z) {
      var cyw = Math.cos(yaw), syw = Math.sin(yaw);
      var X = x * cyw + z * syw, Z = z * cyw - x * syw;
      var cp = Math.cos(pitch), sp = Math.sin(pitch);
      var Y = y * cp - Z * sp, Z2 = Z * cp + y * sp;
      var zc = Z2 + camD;
      if (zc < 0.22) return null;
      var s = (scl * zoom) / zc;
      return { x: cx + X * s, y: cy + Y * s, z: zc, s: s };
    }
    function depth(z) { return Math.max(0.05, Math.min(1, (camD + 1.05 - z) / 2.15)); }

    function morph(tm) {
      var c = tm % 16;
      function e(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
      if (c < 3.2) return { a: 'sph', b: 'sph', k: 0 };
      if (c < 5.0) return { a: 'sph', b: 'tor', k: e((c - 3.2) / 1.8) };
      if (c < 7.4) return { a: 'tor', b: 'tor', k: 0 };
      if (c < 9.2) return { a: 'tor', b: 'cube', k: e((c - 7.4) / 1.8) };
      if (c < 11.6) return { a: 'cube', b: 'cube', k: 0 };
      if (c < 13.4) return { a: 'cube', b: 'sph', k: e((c - 11.6) / 1.8) };
      return { a: 'sph', b: 'sph', k: 0 };
    }

    function drawSky() {
      ctx.fillStyle = 'rgba(5,8,15,0.34)'; ctx.fillRect(0, 0, W, H);
      var gl = [[0.8, 0.06, 0.42, '232,118,63', 0.085], [0.16, 0.1, 0.4, '63,192,221', 0.085],
                [0.5, 1.06, 0.5, '242,199,126', 0.07]];
      ctx.globalCompositeOperation = 'lighter';
      gl.forEach(function (g) {
        var rg = ctx.createRadialGradient(W * g[0], H * g[1], 0, W * g[0], H * g[1], Math.max(W, H) * g[2]);
        rg.addColorStop(0, 'rgba(' + g[3] + ',' + g[4] + ')'); rg.addColorStop(1, 'rgba(' + g[3] + ',0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      });
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i], a = s.a * (0.72 + 0.28 * Math.sin(time * 1.4 + s.tw));
        ctx.fillStyle = 'rgba(' + (s.w ? '255,236,205' : '204,224,255') + ',' + a.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.s / 2, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      if (!vignette) {
        vignette = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.22, cx, cy, Math.max(W, H) * 0.78);
        vignette.addColorStop(0, 'rgba(5,8,15,0)');
        vignette.addColorStop(0.62, 'rgba(5,8,15,0.30)');
        vignette.addColorStop(1, 'rgba(5,8,15,0.78)');
      }
      ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    }

    function drawPlatform() {
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < 3; i++) {
        var rr = 1.05 + i * 0.72;
        ctx.beginPath();
        for (var k = 0; k <= 72; k++) {
          var p = ringPos(k / 72 * SLOT_COUNT, rr);
          var pr = project(p.x, p.y, p.z);
          if (!pr) continue;
          if (k === 0) ctx.moveTo(pr.x, pr.y); else ctx.lineTo(pr.x, pr.y);
        }
        ctx.strokeStyle = 'rgba(63,192,221,' + (0.16 - i * 0.045).toFixed(3) + ')';
        ctx.lineWidth = i === 1 ? 1.4 : 0.9;
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawSwarm() {
      if (!layers.swarm) return;
      ctx.globalCompositeOperation = 'lighter';
      var i, k, n;
      // flowing ribbons
      for (i = 0; i < ribbons.length; i++) {
        var R = ribbons[i], spd = 0.055 * R.dir;
        for (k = 0; k < R.n; k++) {
          var tt = k / R.n, ph = (tt + time * spd) % 1;
          var ang = R.a0 + ph * R.turns * TAU * R.dir;
          var rad = R.r0 + (R.r1 - R.r0) * (1 - ph) ;
          var yy = Math.sin(ph * Math.PI * 1.7 + R.ph) * R.amp * (0.35 + ph);
          var pr = project(Math.cos(ang) * rad, yy, Math.sin(ang) * rad);
          if (!pr) continue;
          var d = depth(pr.z);
          var sz = (0.7 + d * 1.5) * (1 - Math.abs(ph - 0.45) * 0.7) * (zoom);
          if (sz <= 0.2) continue;
          var col = R.warm ? '255,168,110' : '110,205,255';
          ctx.fillStyle = 'rgba(' + col + ',' + (0.10 + d * 0.30).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(pr.x, pr.y, sz, 0, TAU); ctx.fill();
        }
      }
      // satellite clusters
      for (i = 0; i < clusters.length; i++) {
        var C = clusters[i], a = C.ang + time * C.spin;
        var bx = Math.cos(a) * C.rad, bz = Math.sin(a) * C.rad, by = C.y + Math.sin(time * 0.5 + i) * 0.16;
        var rr = rnd(C.seed);
        for (k = 0; k < C.n; k++) {
          var ox = (rr() - 0.5) * 0.42, oy = (rr() - 0.5) * 0.42, oz = (rr() - 0.5) * 0.42;
          var pr2 = project(bx + ox, by + oy, bz + oz);
          if (!pr2) continue;
          var d2 = depth(pr2.z);
          ctx.fillStyle = 'rgba(150,220,255,' + (0.18 + d2 * 0.4).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(pr2.x, pr2.y, 1.1 + d2 * 1.5, 0, TAU); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawCore() {
      if (!layers.mesh) return;
      var m = morph(time), cosS = Math.cos(time * 0.2), sinS = Math.sin(time * 0.2);
      var puls = 0.5 + 0.5 * Math.sin(time * 2.0);
      var P = [], i, n = geom.sph.length;
      for (i = 0; i < n; i++) {
        var A = geom[m.a][i], B = geom[m.b][i], k = m.k;
        var x = A.x + (B.x - A.x) * k, y = A.y + (B.y - A.y) * k, z = A.z + (B.z - A.z) * k;
        var xr = x * cosS - z * sinS, zr = x * sinS + z * cosS;
        var pr = project(xr, y, zr);
        if (!pr) { P.push(null); continue; }
        var d = depth(pr.z);
        P.push({ x: pr.x, y: pr.y, z: pr.z, d: d, ci: dots[i].ci, r: (1.35 + d * 2.5) * (0.85 + dots[i].jit) });
      }
      ctx.globalCompositeOperation = 'lighter';
      // filaments
      var lk = geom.links, maxL = quality === 'low' ? 260 : lk.length;
      ctx.lineWidth = 0.65;
      for (i = 0; i < maxL; i++) {
        var A2 = P[lk[i][0]], B2 = P[lk[i][1]];
        if (!A2 || !B2) continue;
        var dd = (A2.d + B2.d) / 2;
        ctx.strokeStyle = 'rgba(88,178,235,' + (0.035 + dd * 0.10).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(A2.x, A2.y); ctx.lineTo(B2.x, B2.y); ctx.stroke();
      }
      // points
      for (i = 0; i < P.length; i++) {
        var p = P[i]; if (!p) continue;
        var rr = p.r * (1 + (p.d > 0.75 ? puls * 0.08 : 0));
        ctx.globalAlpha = 0.20 + p.d * 0.42;
        ctx.drawImage(sprites[p.ci], p.x - rr * 2.9, p.y - rr * 2.9, rr * 5.8, rr * 5.8);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawPackets() {
      ctx.globalCompositeOperation = 'lighter';
      for (var i = packets.length - 1; i >= 0; i--) {
        var k = packets[i]; k.t += 0.016;
        if (k.t > k.dur + 0.3) { packets.splice(i, 1); continue; }
        var tt = Math.max(0, Math.min(1, k.t / k.dur));
        if (tt >= 1) continue;
        var e = tt < 0.5 ? 2 * tt * tt : 1 - Math.pow(-2 * tt + 2, 2) / 2;
        var u = 1 - e;
        var x = u * u * k.p0.x + 2 * u * e * k.mid.x + e * e * k.p1.x;
        var y = u * u * k.p0.y + 2 * u * e * k.mid.y + e * e * k.p1.y;
        var z = u * u * k.p0.z + 2 * u * e * k.mid.z + e * e * k.p1.z;
        var pr = project(x, y, z); if (!pr) continue;
        var R = 13 * (1 + zoom * 0.15);
        var g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, R);
        g.addColorStop(0, 'rgba(' + k.c + ',0.95)'); g.addColorStop(1, 'rgba(' + k.c + ',0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pr.x, pr.y, R, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function hexPath(x, y, r, rot) {
      ctx.beginPath();
      for (var i = 0; i < 6; i++) {
        var a = rot + i * TAU / 6;
        var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function drawNodes() {
      if (!layers.mesh) { nodeScreens = {}; return; }
      var list = NODE_DEFS.map(function (n) { return { id: n.id, def: n, slot: SLOTS[n.id], gate: false }; });
      list.push({ id: 'gate', def: GATE_DEF, slot: SLOTS.gate, gate: true });
      list.forEach(function (o) {
        var p = ringPos(o.slot, RING_R);
        var pr = project(p.x, p.y, p.z);
        o.pr = pr; o.d = pr ? depth(pr.z) : 0;
      });
      list.sort(function (a, b) { return (b.pr ? b.pr.z : 0) - (a.pr ? a.pr.z : 0); });
      nodeScreens = {};
      ctx.globalCompositeOperation = 'lighter';
      list.forEach(function (o) {
        if (!o.pr) return;
        var isHot = !!hot[o.id] || selected === o.id;
        var fl = flash[o.id] || 0;
        var base = o.gate ? '236,172,74' : '86,196,235';
        var R = (o.gate ? 13.5 : 11.5) * (0.7 + o.d * 0.5) * (0.85 + zoom * 0.15);
        // glow
        var gR = R * (isHot ? 3.4 : 2.3) * (1 + fl * 0.4);
        var g = ctx.createRadialGradient(o.pr.x, o.pr.y, 0, o.pr.x, o.pr.y, gR);
        g.addColorStop(0, 'rgba(' + base + ',' + (isHot ? 0.5 : 0.22) + ')');
        g.addColorStop(1, 'rgba(' + base + ',0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.pr.x, o.pr.y, gR, 0, TAU); ctx.fill();
        // hex plate
        hexPath(o.pr.x, o.pr.y, R, Math.PI / 6);
        ctx.fillStyle = isHot ? 'rgba(' + base + ',0.20)' : 'rgba(11,18,38,0.86)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(' + base + ',' + (isHot ? 0.95 : 0.42) + ')';
        ctx.lineWidth = isHot ? 1.8 : 1.1; ctx.stroke();
        // glyph
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = isHot ? '#ffffff' : 'rgba(200,222,245,0.85)';
        ctx.font = '600 ' + Math.round(R * 1.05) + 'px system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(GLYPH[o.id] || '•', o.pr.x, o.pr.y + R * 0.04);
        ctx.globalCompositeOperation = 'lighter';
        // label
        var label = o.gate ? L('المراجعة البشرية', 'Human review')
                           : (lang() === 'ar' ? o.def.ar : o.def.en);
        var fs = Math.round(9.5 + o.d * 2) ;
        ctx.font = (isHot ? '700 ' : '500 ') + fs + 'px system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif';
        var tw = ctx.measureText(label).width;
        var ly = o.pr.y + R * 2.15 + 8;
        if (isHot) {
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = 'rgba(6,10,22,0.82)';
          roundRect(ctx, o.pr.x - tw / 2 - 6, ly - 8, tw + 12, 16, 8); ctx.fill();
          ctx.globalCompositeOperation = 'lighter';
        }
        ctx.fillStyle = isHot ? 'rgba(255,240,215,1)' : 'rgba(160,180,206,' + (0.45 + o.d * 0.35) + ')';
        ctx.fillText(label, o.pr.x, ly);
        nodeScreens[o.id] = { x: o.pr.x, y: o.pr.y, r: R };
      });
      ctx.globalCompositeOperation = 'source-over';

      // unconfirmed-case marker orbiting outside the ring
      if (marker) {
        var a = time * 0.5, mp = { x: Math.cos(a) * (RING_R + 0.42), y: 0.62, z: Math.sin(a) * (RING_R + 0.42) };
        var mpr = project(mp.x, mp.y, mp.z);
        if (mpr) {
          ctx.globalCompositeOperation = 'lighter';
          var mg = ctx.createRadialGradient(mpr.x, mpr.y, 0, mpr.x, mpr.y, 20);
          mg.addColorStop(0, 'rgba(236,172,74,0.9)'); mg.addColorStop(1, 'rgba(236,172,74,0)');
          ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mpr.x, mpr.y, 20, 0, TAU); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = 'rgba(255,226,178,0.9)';
          ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('!', mpr.x, mpr.y + 3.5);
        }
      }
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
    }

    function draw() {
      drawSky(); drawPlatform(); drawSwarm(); drawCore(); drawPackets(); drawNodes();
    }
    function frame() { time = time || 1.6; draw(); }
    function loop(ts) {
      raf = requestAnimationFrame(loop);
      if (!alive || !visible) return;
      if (ts - lastF < (quality === 'low' ? 34 : 15)) return;
      var dt = Math.min(0.05, (ts - (lastT || ts)) / 1000);
      lastT = ts; lastF = ts;
      if (!slow) { time += dt; yaw += dt * 0.105; }
      zoom += (targetZoom - zoom) * 0.14;
      var ids = Object.keys(flash);
      for (var i = 0; i < ids.length; i++) { flash[ids[i]] -= dt * 2.2; if (flash[ids[i]] <= 0) delete flash[ids[i]]; }
      draw();
    }

    return {
      resize: resize, start: function () { if (!raf) raf = requestAnimationFrame(loop); },
      stop: function () { if (raf) cancelAnimationFrame(raf); raf = null; },
      setVisible: function (v) { visible = v; },
      setQuality: function (q) { quality = q; rebuild(); if (slow) frame(); },
      frame: frame, isSlow: function () { return slow; },
      setLayer: function (name, on) { layers[name] = on; if (slow) frame(); },
      hot: function (id, on) { if (on) hot[id] = 1; else delete hot[id]; },
      clearHot: function () { hot = {}; },
      handoff: function (from, to) {
        var a = ringPos(SLOTS[from] == null ? SLOTS.gate : SLOTS[from], RING_R);
        var b = ringPos(SLOTS[to] == null ? SLOTS.gate : SLOTS[to], RING_R);
        var mid = { x: (a.x + b.x) / 2, y: Math.max(a.y, b.y) + 0.66, z: (a.z + b.z) / 2 };
        var warm = (from === 'gate' || to === 'gate');
        for (var i = 0; i < 4; i++) {
          packets.push({ p0: a, p1: b, mid: mid, t: -i * 0.08, dur: 0.9,
                         c: warm ? '236,172,74' : '86,196,235' });
        }
        if (packets.length > 36) packets.splice(0, packets.length - 36);
        flash[from] = 1; flash[to] = 1; delete hot[from]; hot[to] = 1;
      },
      select: function (id) { selected = id; },
      marker: function (on) { marker = !!on; },
      zoom: function (delta) { targetZoom = Math.max(0.75, Math.min(2.4, targetZoom + delta)); },
      resetZoom: function () { targetZoom = 1; yaw = 0.55; pitch = -0.30; },
      spin: function (dx) { yaw += dx; },
      pick: function (mx, my) {
        var best = null, bd = 1e9;
        for (var id in nodeScreens) {
          if (!Object.prototype.hasOwnProperty.call(nodeScreens, id)) continue;
          var n = nodeScreens[id];
          var d = Math.sqrt((n.x - mx) * (n.x - mx) + (n.y - my) * (n.y - my));
          if (d < Math.max(40, n.r * 3.2) && d < bd) { bd = d; best = id; }
        }
        return best;
      }
    };
  }

  /* ============================ APP ============================ */
  function boot() {
    var stage = $('#hv-sim');
    if (!stage) return;
    var eng = CORE.createEngine();
    var scene = Scene($('#hv-scene'));
    if (!scene) return;

    var el = {
      scen: $('#scenrow'), gate: $('#gatebar'), status: $('.hudstat'), hud: $('#hud'),
      chips: $('#stagechips'), log: $('#logbody'), kase: $('#casebody'), insp: $('#inspbody'),
      term: $('#term'), miniflow: $('#miniflow'), bars: $('#perfbars'), agents: $('#agentgrid'),
      sheet: $('#sheet'), bd: $('#sheetbd')
    };
    var auto = false, timer = null, speed = 1500, sel = null;

    /* ---------- views / tabs ---------- */
    function show(tab, push) {
      $$('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + tab); });
      $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === tab)); });
      if (tab === 'sim') { requestAnimationFrame(function () { scene.resize(); }); }
      if (push !== false) { try { history.replaceState(null, '', tab === 'sim' ? location.pathname : '#' + tab); } catch (e) {} }
    }
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-tab]') : null;
      if (t) { e.preventDefault(); show(t.getAttribute('data-tab')); }
    });
    var initial = (location.hash || '').replace('#', '');
    if (['how', 'agents', 'about', 'join'].indexOf(initial) >= 0) show(initial, false);

    /* ---------- scenario picker ---------- */
    function renderScen() {
      if (!el.scen) return;
      el.scen.innerHTML = Object.keys(SCENARIOS).map(function (k) {
        var s = SCENARIOS[k];
        return '<button class="scen-btn" data-scen="' + k + '" aria-pressed="' + String(k === eng.st.sid) + '">' +
          '<b>' + esc(lang() === 'ar' ? s.ar : s.en) + '</b><small>' +
          esc(lang() === 'ar' ? s.sub_ar : s.sub_en) + '</small></button>';
      }).join('');
    }

    /* ---------- agents grid ---------- */
    function renderAgents() {
      if (!el.agents) return;
      var all = NODE_DEFS.map(function (n) { return { d: n, gate: false }; });
      all.push({ d: GATE_DEF, gate: true });
      el.agents.innerHTML = all.map(function (o) {
        var d = o.d;
        return '<div class="agent' + (o.gate ? ' gate' : '') + '">' +
          '<small>' + (o.gate ? 'HUMAN GATE' : 'AGENT') + '</small>' +
          '<b>' + esc(lang() === 'ar' ? d.ar : d.en) + '</b>' +
          '<p>' + esc(lang() === 'ar' ? d.role_ar : d.role_en) + '</p>' +
          '<div class="kv"><span>' + L('المدخل', 'Input') + '</span><b>' + esc(lang() === 'ar' ? d.in_ar : d.in_en) + '</b></div>' +
          '<div class="kv"><span>' + L('المخرج', 'Output') + '</span><b>' + esc(lang() === 'ar' ? d.out_ar : d.out_en) + '</b></div>' +
          '<p class="never">' + esc(lang() === 'ar' ? d.never_ar : d.never_en) + '</p></div>';
      }).join('');
    }

    function stageName(id) {
      if (id === 'gate') return L('المراجعة البشرية', 'Human review');
      var f = NODE_DEFS.filter(function (n) { return n.id === id; })[0];
      return f ? (lang() === 'ar' ? f.ar : f.en) : id;
    }
    function statusText() {
      var st = eng.st;
      if (st.paused) return L('بانتظار قرار بشري', 'Awaiting human decision');
      if (st.done) return L('انتهى المسار', 'Run complete');
      if (st.seq > 0) return L('قيد التشغيل', 'Running');
      return L('في الانتظار', 'Standby');
    }

    /* ---------- renderers ---------- */
    function renderHud() {
      var t = eng.telemetry();
      if (el.miniflow) {
        var per = NODE_DEFS.length + 1;
        el.miniflow.innerHTML = new Array(per + 1).join('x').split('x').map(function (_, i) {
          var cls = (i <= eng.st.stage) ? (i === eng.st.stage ? 'done' : 'done') : '';
          if (eng.st.paused && i === eng.st.stage) cls = 'now';

    }
    function renderStatus() {
      if (el.status) el.status.textContent = statusText();
    }
    function renderChips() {

        esc(L('المراجعة البشرية', 'Human review')) + '</button>';

    function renderCase() {

        [L('الحاجة', 'Need'), lang() === 'ar' ? k.need_ar : k.need_en],
        [L('القيود', 'Constraints'), lang() === 'ar' ? k.con_ar : k.con_en],
        [L('المرحلة', 'Stage'), st.last ? stageName(st.last.agent) : '—'],
        [L('النتيجة', 'Outcome'), st.done ? (st.tone === 'ok' ? L('مؤكَّد', 'Confirmed') : L('غير مؤكَّد', 'Unconfirmed')) : L('قيد المعالجة', 'In progress')]

    function renderLog() {

        el.log.innerHTML = '<div class="empty">' + L(
          'السجل فارغ — اختر مساراً واضغط «ابدأ المحاكاة». كل البيانات خيالية.',

          '<div><span class="a">' + esc(stageName(e2.agent)) + '</span>' +
          '<span class="t">' + esc(lang() === 'ar' ? e2.ar : e2.en) + '</span></div></div>';

    function renderInsp() {

        el.insp.innerHTML = '<div class="empty">' + L('المس أي عقدة في المشهد لتعرف دورها وحدودها.',
          'Tap any node in the scene to see its role and its limits.') + '</div>';

        '<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><b style="font-size:14.5px;color:#fff">' +
          esc(lang() === 'ar' ? d.ar : d.en) + '</b><span class="lbl" style="font-size:9.5px;color:' +
          (active ? 'var(--gold)' : 'var(--dim)') + '">' + esc(active ? L('نشط الآن', 'Active') : L('في الانتظار', 'Idle')) + '</span></div>' +
        '<p style="font-size:12.6px;margin-bottom:8px">' + esc(lang() === 'ar' ? d.role_ar : d.role_en) + '</p>' +
        '<div class="kv"><span>' + L('المدخل', 'Input') + '</span><b>' + esc(lang() === 'ar' ? d.in_ar : d.in_en) + '</b></div>' +
        '<div class="kv"><span>' + L('المخرج', 'Output') + '</span><b>' + esc(lang() === 'ar' ? d.out_ar : d.out_en) + '</b></div>' +
        '<p style="font-size:11.6px;color:var(--muted);border-inline-start:2px solid var(--coral);padding-inline-start:8px;margin-top:8px">' +
          esc(lang() === 'ar' ? d.never_ar : d.never_en) + '</p>';
    }

      var st = eng.st;
      if (!st.paused) {
        el.gate.hidden = true; el.gate.innerHTML = ''; scene.hot('gate', false);
        stage.classList.remove('gated');
        return;

      var p = st.paused;
      el.gate.hidden = false;
      var q = lang() === 'ar' ? p.ar : p.en;
      var btns = p.kind === 'gate'
        ? '<button class="btn gold" data-act="approve">' + esc(L(p.approve_ar, p.approve_en)) + '</button>' +
          '<button class="btn ghost danger" data-act="decline">' + esc(L(p.decline_ar, p.decline_en)) + '</button>'

      el.gate.innerHTML = '<div class="gq"><span class="gk">' +
        esc(p.kind === 'gate' ? L('قرار مؤثر', 'Consequential step') : L('توقف وإيضاح', 'Halt and clarify')) +
