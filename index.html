<script>
  /* install-to-home-screen: the manifest is assembled at runtime so the whole
     terminal stays one file with its icon already inside it */
  (function () {
    var icon = document.querySelector('link[rel="apple-touch-icon"]');
    if (!icon || !window.Blob || !URL.createObjectURL) return;
    var m = {
      name: 'HEAVEN · طرفية العمليات', short_name: 'HEAVEN', start_url: '.',
      display: 'standalone', background_color: '#060c1a', theme_color: '#060c1a',
      lang: 'ar', dir: 'rtl',
      icons: [{ src: icon.href, sizes: '64x64', type: 'image/png', purpose: 'any' }]
    };
    /* opened as a lone file (file://) there is no sibling manifest to read, so we
       build one in memory; when the page is served, the real manifest.webmanifest
       beside it is used and nothing here runs */
    if (location.protocol !== 'file:') return;
    var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    var l = document.querySelector('link[rel="manifest"]');
    if (l) l.setAttribute('href', blobUrl);
    else {
      l = document.createElement('link');
      l.rel = 'manifest';
      l.href = blobUrl;
      document.head.appendChild(l);
    }
  })();
</script>

<style>/* ==========================================================================
   HEAVEN · unified command terminal
   One identity, taken from the mark: deep navy ground, a cyan dawn on one
   side, a warm sunset on the other, a cream sun in the middle. Everything
   else — the globe, the pastel timeline, the router — is built from that.
   ========================================================================== */

:root{
  /* ground */
  --bg0:#050a16; --bg1:#070e1e; --bg2:#0a1428;
  --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.055);
  --deep:#040914; --raise:rgba(140,200,255,.06);
  --hair:rgba(146,192,255,.15); --hair2:rgba(146,192,255,.08);
  /* ink */
  --ink:#eef4ff; --ink2:#c2cee9; --muted:#8d9bbe; --dim:#7480a6;   /* dim still clears 4.5:1 on the panel */
  /* the logo's two dawns, plus the pastels they imply */
  --cyan:#6fd8f5;   --cyan-rgb:111,216,245;
  --blue:#8fb4ff;   --blue-rgb:143,180,255;
  --mint:#7fe8cf;   --mint-rgb:127,232,207;
  --gold:#ffd489;   --gold-rgb:255,212,137;
  --peach:#ffb392;  --peach-rgb:255,179,146;
  --rose:#ffa3c2;   --rose-rgb:255,163,194;
  --lilac:#c3b2ff;  --lilac-rgb:195,178,255;
  --sun:#fff3d0;    --sun-rgb:255,243,208;
  /* status */
  --ok:#6ee7b7; --warn:#ffd489; --hold:#ffb392; --alert:#ff9db4;
  /* geometry */
  --r:16px; --r-s:11px; --r-xs:8px;
  --mono:'JBMono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:'Alex','Alexandria',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --shadow:0 24px 60px -44px #000;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg0);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--ui); color:var(--ink); font-size:13.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1100px 620px at 78% -10%, rgba(255,196,140,.10), transparent 62%),
    radial-gradient(900px 560px at 12% -6%, rgba(111,216,245,.12), transparent 60%),
    radial-gradient(1200px 800px at 50% 120%, rgba(195,178,255,.07), transparent 60%),
    var(--bg1);
  background-attachment:fixed;
  min-height:100dvh;overflow-x:hidden;
}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:600}
button{font:inherit;color:inherit}
::selection{background:rgba(111,216,245,.22)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

/* ── primitives ─────────────────────────────────────────────────────────── */
.hud{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bdi{unicode-bidi:isolate}

.panel{
  position:relative;border:1px solid var(--hair);border-radius:var(--r);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:var(--shadow);
  min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
}
.panel::after{                     /* a hairline of dawn along the top edge */
  content:"";position:absolute;inset-inline:14px;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,243,208,.28),transparent);
  opacity:.6;
}
.phead{
  display:flex;align-items:center;gap:8px;min-width:0;
  padding:9px 12px 8px;border-bottom:1px solid var(--hair2);flex:0 0 auto;
}
.glyph{
  font-family:var(--mono);font-size:11px;line-height:1;color:var(--cyan);
  opacity:.9;transform:translateY(-.5px);
}
.ptitle{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.pcap{
  font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;flex:1 1 auto;
}
.pbtn{
  appearance:none;border:1px solid var(--hair);background:rgba(255,255,255,.04);
  color:var(--ink2);border-radius:9px;padding:0 10px;height:26px;font-size:10.5px;
  cursor:pointer;white-space:nowrap;transition:background .18s,border-color .18s,transform .12s;
  margin-inline-start:auto;flex:0 0 auto;
}
.pbtn:hover{background:rgba(255,255,255,.08);border-color:rgba(146,192,255,.3)}
.pbtn:active{transform:translateY(1px)}
.pbtn--solid{
  background:linear-gradient(100deg,rgba(111,216,245,.24),rgba(195,178,255,.22));
  border-color:rgba(111,216,245,.45);color:#fff;
}
.pbtn--wide{flex:1 1 0;height:30px}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:99px;
  border:1px solid var(--hair);background:rgba(255,255,255,.04);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
  white-space:nowrap;
}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip--live{border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.1);color:#a7f3d0}
.chip--hold{border-color:rgba(255,179,146,.45);background:rgba(255,179,146,.12);color:var(--peach)}

/* ── 1 · the command bar ────────────────────────────────────────────────── */
.app{
  height:100dvh;min-height:0;display:flex;flex-direction:column;gap:10px;
  padding:10px 12px 6px;max-width:2400px;margin:0 auto;
}
.bar{
  flex:0 0 auto;height:56px;display:flex;align-items:center;gap:14px;min-width:0;
  padding:0 12px;border:1px solid var(--hair);border-radius:14px;
  background:linear-gradient(180deg,rgba(16,28,52,.9),rgba(8,15,30,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
/* the portal: one clear way out of the terminal into the public site */
.portal{
  position:relative;display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;
  height:34px;padding:0 12px;border-radius:99px;text-decoration:none;
  border:1px solid rgba(var(--gold-rgb),.38);
  background:linear-gradient(100deg,rgba(255,212,137,.16),rgba(255,163,194,.10) 55%,rgba(195,178,255,.12));
  color:var(--gold);transition:border-color .2s,background .2s,transform .15s;
}
.portal:hover{
  border-color:rgba(var(--gold-rgb),.68);
  background:linear-gradient(100deg,rgba(255,212,137,.26),rgba(255,163,194,.16) 55%,rgba(195,178,255,.18));
}
.portal:active{transform:scale(.98)}
.portal__g{display:grid;place-items:center;width:16px;height:16px;flex:0 0 auto}
.portal__g svg{width:16px;height:16px;display:block}
.portal__t{display:flex;align-items:center;gap:7px;min-width:0;line-height:1}
.portal__t b{font-size:12px;font-weight:600;color:var(--gold);white-space:nowrap}
.portal__t span{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:rgba(255,212,137,.72);
  white-space:nowrap;direction:ltr;
}
.portal__dot{
  width:5px;height:5px;border-radius:50%;background:var(--gold);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(var(--gold-rgb),.55);animation:portalBreathe 3.4s ease-in-out infinite;
}
@keyframes portalBreathe{
  0%,100%{box-shadow:0 0 0 0 rgba(var(--gold-rgb),.42)}
  50%{box-shadow:0 0 0 5px rgba(var(--gold-rgb),0)}
}
.app[data-theme="day"] .portal{background:linear-gradient(100deg,#fdf3d8,#fdeef4 55%,#f0edff);border-color:#e3c37a}
.app[data-theme="day"] .portal__t b{color:#8a6400}
.app[data-theme="day"] .portal__t span{color:#a1832f}
.app[data-theme="day"] .portal__dot{background:#9a6a00;animation:none}
@media (prefers-reduced-motion: reduce){ .portal__dot{animation:none} }
@media (max-width:1420px){ .portal__t span{display:none} }
/* when the bar is crowded (≤1660 px) the portal becomes a clean icon button */
@media (min-width:762px) and (max-width:1660px){
  .portal{width:34px;padding:0;justify-content:center;gap:0}
  .portal__t{display:none}
  .portal__dot{position:absolute;inset-block-start:5px;inset-inline-end:5px;width:4px;height:4px}
  .portal__g,.portal__g svg{width:17px;height:17px}
}
@media (max-width:761px){ .portal{display:none} }
.mark{
  width:32px;height:32px;border-radius:10px;object-fit:cover;flex:0 0 auto;
  background:#fdfcf9;box-shadow:0 0 0 1px rgba(255,243,208,.22),0 0 22px -8px rgba(255,212,137,.8);
}
.brand__t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.wordmark{
  display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:15px;
  letter-spacing:.24em;font-weight:600;color:#fff;
}
.wordmark span{
  font-size:8.5px;letter-spacing:.12em;color:#0a1428;background:var(--mint);
  border-radius:4px;padding:1px 4px;transform:translateY(-1px);
}
.brand__s{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.kpis{display:flex;align-items:stretch;gap:0;margin-inline-start:8px;min-width:0;flex-wrap:nowrap}
.kpi{
  display:flex;flex-direction:column;justify-content:center;gap:0;padding:0 13px;
  border-inline-start:1px solid var(--hair2);min-width:0;white-space:nowrap;
}
.kpi:first-child{border-inline-start:0}
.kpi b{font-family:var(--mono);font-size:14.5px;line-height:1.15;letter-spacing:-.01em}
.kpi span{font-size:9px;color:var(--dim);letter-spacing:.02em}
.kpi--cyan b{color:var(--cyan)} .kpi--mint b{color:var(--mint)}
.kpi--gold b{color:var(--gold)} .kpi--peach b{color:var(--peach)}
.bar__grow{flex:1 1 auto}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:0;flex:0 0 auto;padding-inline:12px;border-inline-start:1px solid var(--hair2)}
.clock b{font-size:15.5px;line-height:1.1;color:#fff;letter-spacing:.01em}
.clock .hud{font-size:8px;letter-spacing:.12em}
.badge{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;
  border:1px dashed rgba(255,212,137,.4);border-radius:6px;background:rgba(255,212,137,.07);
  font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#f4d9a4;
  white-space:nowrap;
}
.tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.seg{display:flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden;height:28px;background:rgba(255,255,255,.02)}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:0 9px;min-width:32px;
  cursor:pointer;text-transform:uppercase;transition:background .18s,color .18s;
}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:#fff}
.ico{
  appearance:none;width:28px;height:28px;border-radius:9px;border:1px solid var(--hair);
  background:rgba(255,255,255,.03);color:var(--ink2);cursor:pointer;font-size:12px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:background .18s;
}
.ico:hover{background:rgba(255,255,255,.08)}

/* ── 2 · the deck ───────────────────────────────────────────────────────── */
.deck{
  flex:1 1 auto;min-height:0;
  display:grid;gap:10px;
  grid-template-columns:224px minmax(0,1fr) 348px;
  grid-template-rows:minmax(0,1fr) 138px 250px;
  grid-template-areas:
    "nav globe side"
    "bento bento side"
    "router router side";
}
.nav{grid-area:nav}
.globe{grid-area:globe}
.side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-height:0}
.bento{grid-area:bento}
.router{grid-area:router}

/* ── 3 · stage navigator ────────────────────────────────────────────────── */
.nav__list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;min-height:0;flex:1 1 auto}
.nav__item{
  position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;
  gap:8px;padding:8px 8px;min-height:46px;border-radius:10px;cursor:pointer;border:1px solid transparent;
  background:transparent;text-align:start;width:100%;appearance:none;
  transition:background .2s,border-color .2s,transform .15s;
}
.nav__item:hover{background:rgba(255,255,255,.045)}
.nav__item .n{font-family:var(--mono);font-size:9px;color:var(--dim)}
.nav__item .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.nav__item .t{overflow:hidden}
.nav__item .t b{font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Alexandria runs slightly wide at these sizes: the six stages get a touch more room */
@media (min-width:761px){ .deck{grid-template-columns:212px minmax(0,1fr) 258px} }
@media (max-width:1560px) and (min-width:761px){ .deck{grid-template-columns:200px minmax(0,1fr) 320px} }
.nav__item .t span{
  font-size:9.5px;color:var(--dim);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nav__item .d{width:7px;height:7px;border-radius:50%;border:1px solid var(--hair);background:transparent;flex:0 0 auto}
.nav__item .c{
  font-family:var(--mono);font-size:9px;line-height:1;color:var(--muted);min-width:16px;text-align:center;
  padding:3px 4px;border-radius:6px;border:1px solid var(--hair2);background:rgba(255,255,255,.03);
}
.nav__item.is-on .c{color:var(--ink);border-color:rgba(var(--cyan-rgb),.4);background:rgba(var(--cyan-rgb),.12)}
.nav__item.is-done .d{background:var(--mint);border-color:transparent;box-shadow:0 0 10px rgba(var(--mint-rgb),.5)}
.nav__item.is-done .t b{color:var(--ink2)}
.nav__item.is-on{
  background:linear-gradient(100deg,rgba(var(--cyan-rgb),.14),rgba(var(--lilac-rgb),.08));
  border-color:rgba(var(--cyan-rgb),.42);
  box-shadow:0 0 26px -16px rgba(var(--cyan-rgb),.9);
}
.nav__item.is-on .n{color:var(--cyan)}
.nav__item.is-on .t b{color:#fff}
.nav__item.is-on .d{background:var(--cyan);border-color:transparent;box-shadow:0 0 0 3px rgba(var(--cyan-rgb),.16),0 0 12px rgba(var(--cyan-rgb),.8)}
.nav__foot{overflow:hidden;min-width:0}
.nav__foot .hud{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav__foot .nav__bar{flex:0 1 46px;min-width:14px}
.nav__foot{
  flex:0 0 auto;padding:8px 12px 10px;border-top:1px solid var(--hair2);
  display:flex;align-items:center;gap:8px;justify-content:space-between;
}
.nav__bar{flex:1 1 auto;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.nav__bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--mint));transition:width .4s}

/* ── 4 · mind globe ─────────────────────────────────────────────────────── */
.globe__inner{
  flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 296px;
  gap:10px;padding:8px 10px 4px;
}
.globe{
  background:
    radial-gradient(60% 46% at 50% 108%, rgba(255,190,140,.20), transparent 70%),
    radial-gradient(48% 40% at 50% 106%, rgba(255,243,208,.16), transparent 72%),
    linear-gradient(180deg,var(--panel2),var(--panel));
}
.globe__canvas{position:relative;min-height:0;min-width:0}
.globe__cv{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  cursor:grab;touch-action:pan-y;outline:none;
  -webkit-tap-highlight-color:transparent;
}
.globe__cv.is-grab{cursor:grabbing}
.globe__cv:focus-visible{outline:1px solid rgba(var(--cyan-rgb),.5);outline-offset:-6px;border-radius:50%}

/* the HUD ring: six screen-fixed chips, tethered to the sphere by the canvas */
.hudring{position:absolute;inset:0;pointer-events:none}
.hudchip{
  position:absolute;transform:translate(-50%,-50%);
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  appearance:none;cursor:pointer;pointer-events:auto;
  background:rgba(6,12,26,.74);border:1px solid rgba(var(--hue,111,216,245),.42);
  color:rgb(var(--hue,111,216,245));
  font-family:var(--mono);font-size:10px;line-height:1;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  transition:background .25s,border-color .25s,box-shadow .25s,color .25s,transform .25s;
}
.hudchip:hover{border-color:rgba(var(--hue,111,216,245),.85);transform:translate(-50%,-50%) scale(1.08)}
.hudchip.on{
  background:rgb(var(--hue,111,216,245));color:#07101f;border-color:transparent;
  box-shadow:0 0 0 5px rgba(var(--hue,111,216,245),.16),0 8px 24px -10px rgba(var(--hue,111,216,245),.9);
}
.hudchip.past{background:rgba(6,12,26,.62)}
.globe__hud{position:absolute;inset:0;pointer-events:none}
.globe__hud .hchip{
  position:absolute;display:flex;flex-direction:column;gap:1px;
  padding:5px 9px;border-radius:9px;border:1px solid var(--hair);
  background:rgba(6,12,26,.72);backdrop-filter:blur(6px);pointer-events:auto;
}
.globe__hud .hchip b{font-family:var(--mono);font-size:12px;line-height:1.15}
.globe__hud .hchip span{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hchip--tl{inset-inline-start:4px;top:4px}
.hchip--tr{inset-inline-end:4px;top:4px;text-align:end;align-items:flex-end}
.hchip--bl{inset-inline-start:4px;bottom:4px}
.hchip--br{inset-inline-end:4px;bottom:4px;text-align:end;align-items:flex-end}
.globe__hint{
  position:absolute;left:8px;right:auto;bottom:2px;text-align:start;max-width:56%;
  white-space:nowrap;font-size:7.5px;letter-spacing:.1em;
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  pointer-events:none;opacity:.9;
}
/* paused transport: the room freezes, visibly */
.globe__canvas{position:relative}
.pausetag{
  position:absolute;inset-block-start:6px;inset-inline-start:6px;z-index:6;
  display:none;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;
  background:rgba(11,16,26,.82);border:1px solid rgba(255,212,137,.42);
  color:#ffd489;font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.pausetag b{font-size:8px;color:#ffd489}
#globePanel.is-paused .pausetag{display:inline-flex}
#globePanel.is-paused .globe__cv{filter:saturate(.55) brightness(.94)}
.ico.is-on{background:rgba(255,212,137,.16);border-color:rgba(255,212,137,.45);color:#ffd489}
.app[data-theme="day"] .pausetag{background:rgba(255,252,244,.92);border-color:#e3c37a;color:#8a6400}
.app[data-theme="day"] .pausetag b{color:#8a6400}
.app[data-theme="day"] .ico.is-on{background:#fdf3d8;border-color:#e7cd90;color:#8a6400}

.globe__legend{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 14px 9px;border-top:1px solid var(--hair2);
}
.lg{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.lg i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.lg--need i{background:var(--cyan);box-shadow:0 0 8px rgba(var(--cyan-rgb),.7)}
.lg--free i{background:var(--mint);box-shadow:0 0 8px rgba(var(--mint-rgb),.6)}
.lg--seat i{background:var(--gold);box-shadow:0 0 8px rgba(var(--gold-rgb),.7)}
.lg--path i{background:linear-gradient(90deg,var(--cyan),var(--lilac));border-radius:2px;height:2px;width:16px}
.globe__legend .pbtn{margin-inline-start:auto;height:24px}

/* the live case card, docked beside the globe */
.case{
  align-self:start;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden;
  padding:11px 12px;border:1px solid var(--hair);border-radius:12px;
  background:
    radial-gradient(320px 180px at 80% -30%,rgba(255,212,137,.12),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
}
.case__top{display:flex;align-items:center;gap:7px;min-width:0}
.case__x{
  appearance:none;flex:0 0 auto;width:22px;height:22px;border-radius:7px;cursor:pointer;
  border:1px solid var(--hair);background:rgba(255,255,255,.04);color:var(--muted);
  font-size:10px;line-height:1;display:grid;place-items:center;transition:.18s;
}
.case__x:hover{color:#fff;border-color:rgba(var(--rose-rgb),.5);background:rgba(var(--rose-rgb),.12)}
.case__ref--board{font-family:var(--ink);font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--ink)}

/* ---- the board card: ten cases at once ---- */
.case.is-board{align-self:stretch;justify-content:space-between;gap:8px}
.case.is-board .board__stats{grid-auto-rows:minmax(58px,66px);align-content:start}
.case.is-board .board__swarm{justify-content:space-between;gap:0}
.case.is-board .swarmdot{height:30px}
.case.is-board .case__top .chip{margin-inline-start:auto}
.board__stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.bst{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;
  padding:8px 10px;border-radius:10px;min-width:0;
  border:1px solid var(--hair2);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
}
.bst b{font-family:var(--mono);font-size:22px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.bst span{font-size:10px;color:var(--dim);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.board__lab{display:flex;align-items:center;gap:8px;margin-top:2px}
.board__lab .track{flex:1 1 auto;height:1px;background:var(--hair2)}
.board__swarm{display:flex;align-items:center;gap:2px;padding:2px 0}
.swarmdot{
  appearance:none;border:0;background:transparent;padding:0;cursor:pointer;
  flex:1 1 0;height:26px;display:grid;place-items:center;border-radius:7px;transition:background .18s;
}
.swarmdot:hover{background:rgba(255,255,255,.05)}
.swarmdot i{
  display:block;width:8px;height:8px;border-radius:50%;background:rgba(var(--h),.85);
  box-shadow:0 0 9px rgba(var(--h),.55);transition:transform .18s;
}
.swarmdot.is-done i{background:transparent;border:1px solid rgba(var(--h),.6);box-shadow:none}
.swarmdot.is-here i{transform:scale(1.45);box-shadow:0 0 0 3px rgba(var(--h),.16),0 0 12px rgba(var(--h),.7)}
.board__top{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 8px;align-items:center;
  width:100%;appearance:none;cursor:pointer;text-align:start;
  padding:8px 9px;border-radius:10px;border:1px solid rgba(var(--gold-rgb),.3);
  background:rgba(var(--gold-rgb),.07);transition:background .18s,border-color .18s;
}
.board__top:hover{background:rgba(var(--gold-rgb),.12);border-color:rgba(var(--gold-rgb),.5)}
.board__top .hud{grid-column:1 / -1;font-size:8.5px;color:rgba(var(--gold-rgb),.9)}
.board__top b{font-family:var(--mono);font-size:12px;color:var(--ink)}
.board__top .l{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board__top .go{color:var(--gold);font-size:13px;line-height:1}

.case__ref{font-family:var(--mono);font-size:12px;color:#fff;letter-spacing:.02em}
.case__cat{font-size:11px;color:var(--ink2)}
.case__top .chip{margin-inline-start:auto}
.case__line{font-size:12px;color:var(--ink2);line-height:1.4}
.case__big{
  display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 12px;align-items:end;
}
.case__col{display:flex;flex-direction:column;gap:1px;min-width:0}
.case__col span{font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.case__col b{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case__prov{grid-column:1 / -1;flex-direction:row;align-items:baseline;gap:7px}
.case__prov b{font-size:10.5px}
.case__num{font-size:26px !important;line-height:1;letter-spacing:-.02em}
.case__num small{font-size:10px;color:var(--dim);letter-spacing:0;margin-inline-start:2px}
.case__now{
  display:flex;flex-direction:column;gap:3px;padding:8px 9px;border-radius:10px;
  border:1px solid rgba(var(--gold-rgb),.24);background:rgba(var(--gold-rgb),.07);
}
.case__now span{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--gold-rgb),.85)}
.case__now b{font-size:12.5px;font-weight:500;color:#fff;line-height:1.35}
.case__dots{display:flex;gap:4px;align-items:center}
.case__dots i{flex:1 1 0;height:3px;border-radius:2px;background:rgba(255,255,255,.09)}
.case__dots i.done{background:rgba(var(--mint-rgb),.75)}
.case__dots i.on{background:var(--sun);box-shadow:0 0 10px rgba(var(--sun-rgb),.7)}
.case__meters{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.meter{display:flex;flex-direction:column;gap:3px}
.meter__row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.meter__row span{font-size:10px;color:var(--muted)}
.meter__row b{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.meter__track{height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.meter__track i{display:block;height:100%;border-radius:2px;background:var(--cyan);transition:width .5s}
.meter--gold .meter__track i{background:var(--gold)}
.meter--mint .meter__track i{background:var(--mint)}
.meter--peach .meter__track i{background:var(--peach)}

/* ── 5 · context + dock ─────────────────────────────────────────────────── */
.ctx{flex:0 0 auto}
.ctx .phead{padding-bottom:7px}
.ctx__n{
  margin-inline-start:auto;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.1em;
}
.ctx__body{padding:9px 12px 11px;display:flex;flex-direction:column;gap:9px;min-height:0}
.ctx__stage{display:flex;flex-direction:column;gap:1px}
.ctx__stage b{font-size:16px;font-weight:600;color:#fff;line-height:1.25}
.ctx__stage span{font-size:11px;color:var(--muted);line-height:1.35}
.ctx__duty{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;
  border:1px solid var(--hair);background:rgba(255,255,255,.03);min-width:0;
}
.ctx__duty svg{width:16px;height:16px;flex:0 0 auto}
.ctx__duty .who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ctx__duty .who b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink)}
.ctx__duty .who span{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx__duty .st{margin-inline-start:auto;font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok)}
.ctx__block{display:flex;flex-direction:column;gap:2px}
.ctx__change{font-size:12px;color:var(--ink2);line-height:1.45}
.ctx__never{border-top:1px solid var(--hair2);padding-top:7px}
.ctx__never p{font-size:11.5px;color:var(--peach);line-height:1.4}
.ctx__never p::before{content:"✕ ";opacity:.8}
.ctx__meters{display:flex;flex-direction:column;gap:5px}
.ctx__nav{display:flex;gap:7px;margin-top:2px}

.dock{flex:1 1 auto;min-height:0}
.dock__tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1 0 100%;margin-top:8px;order:9;
}
.dock .phead{flex-wrap:wrap;row-gap:0}
.dtab{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--dim);
  font-size:10px;padding:4px 7px;border-radius:7px;cursor:pointer;white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s;
}
.dtab:hover{color:var(--ink2);background:rgba(255,255,255,.05)}
.dtab.on{color:#fff;background:rgba(111,216,245,.14);border-color:rgba(111,216,245,.35)}
.dock__body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 12px;scrollbar-width:thin;
  display:flex;flex-direction:column}
.dock__body>.qhead{margin-top:2px}
.dock__body.is-hit{animation:panelHit 1.05s ease-out 1}
.dock__body{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 16px),rgba(0,0,0,0));
  mask-image:linear-gradient(180deg,#000 calc(100% - 16px),rgba(0,0,0,0))}
.dock__foot{flex:0 0 auto;border-top:1px solid var(--hair2);padding:9px 12px 10px}
.dback{
  appearance:none;align-self:flex-start;margin-bottom:8px;cursor:pointer;padding:5px 9px;border-radius:8px;
  border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--muted);font-size:10px;
  transition:.18s;
}
.dback:hover{color:var(--ink);border-color:rgba(var(--cyan-rgb),.4);background:rgba(var(--cyan-rgb),.1)}
.dlist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.drow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"r s" "n n";
  gap:1px 8px;align-items:center;width:100%;appearance:none;cursor:pointer;text-align:start;
  padding:6px 7px;border-radius:9px;border:1px solid transparent;background:transparent;transition:.16s;
}
.drow:hover{background:rgba(255,255,255,.045);border-color:var(--hair2)}
.drow .r{grid-area:r;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.drow .n{grid-area:n;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .s{grid-area:s;display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);white-space:nowrap}
.drow .s i{width:5px;height:5px;border-radius:50%;background:rgba(var(--h,111,216,245),.9);flex:0 0 auto}
.dfoot{display:flex;align-items:center;gap:9px;width:100%;appearance:none;cursor:pointer;text-align:start;
  border:1px solid var(--hair);border-radius:10px;padding:7px 9px;
  background:linear-gradient(100deg,rgba(111,216,245,.10),rgba(195,178,255,.08));transition:border-color .18s,background .18s}
.dfoot:hover{border-color:rgba(146,192,255,.34);background:linear-gradient(100deg,rgba(111,216,245,.16),rgba(195,178,255,.12))}
.dfoot .n{font-family:var(--mono);font-size:9px;color:var(--cyan);flex:0 0 auto}
.dfoot .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.dfoot .t b{font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfoot .t span{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfoot .go{margin-inline-start:auto;font-family:var(--mono);font-size:11px;color:var(--cyan);flex:0 0 auto}
.dfoot.is-end{cursor:default;background:rgba(127,232,207,.07);border-color:rgba(127,232,207,.22)}
.dfoot.is-end .n{color:var(--mint)}
.dock__body::-webkit-scrollbar{width:6px}
.dock__body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

/* requester */
.rq__head{display:flex;align-items:flex-start;gap:8px;min-width:0}
.rq__ref{font-family:var(--mono);font-size:13px;color:#fff}
.rq__line{font-size:12px;color:var(--ink2);line-height:1.45;margin-top:2px}
.rq__chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 9px}
.sig{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.sig__row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sig__row span{font-size:10.5px;color:var(--muted)}
.sig__row b{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.sig .meter__track i{background:var(--lilac)}
.sig--prio .meter__track i{background:var(--peach)}
.sig--ttl .meter__track i{background:var(--gold)}
.qhead{display:flex;align-items:center;gap:8px;margin:9px 0 5px}
.qhead .hud{margin:0}
.qhead .track{flex:1 1 auto;height:1px;background-image:linear-gradient(90deg,var(--hair) 50%,transparent 0);background-size:6px 1px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;
  padding:5px 0;border-bottom:1px solid var(--hair2);font-size:11px;color:var(--ink2)}
.qrow:last-child{border-bottom:0}
.qrow .r{font-family:var(--mono);font-size:10px;color:var(--muted)}
.qrow .k{font-size:10px;color:var(--dim)}

/* providers */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pv{
  border:1px solid var(--hair);border-radius:10px;padding:8px 9px;min-width:0;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
}
.pv b{display:block;font-family:var(--mono);font-size:18px;line-height:1.1;color:var(--mint)}
.pv b small{font-size:9px;color:var(--dim);margin-inline-start:2px}
.pv span{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv i{display:block;margin-top:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.pv i em{display:block;height:100%;background:var(--mint);border-radius:2px}

/* matrix */
.mx{display:grid;grid-template-columns:64px repeat(6,minmax(0,1fr));grid-auto-rows:minmax(16px,1fr);gap:4px}
.mx__c{font-family:var(--mono);font-size:7px;letter-spacing:.04em;color:var(--dim);text-align:center;
  display:flex;align-items:flex-end;justify-content:center;line-height:1.1;padding-bottom:2px}
.mx__r{font-size:9.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;min-width:0}
.mx__r b{font-family:var(--mono);font-size:8.5px;color:var(--dim);font-weight:400}
.mx__cell{border-radius:4px;border:1px solid transparent;transition:transform .15s}
.mx__row{display:contents}
.mx__cell:hover{transform:scale(1.04)}
.mx__row.is-on .mx__cell{box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.8)}
.mx__row.is-on .mx__r{color:var(--gold)}
.mx__key{display:flex;align-items:center;gap:6px;margin-top:8px}
.mx__key span{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mx__ramp{flex:1 1 auto;height:4px;border-radius:2px;
  background:linear-gradient(90deg,rgba(111,216,245,.12),rgba(143,180,255,.5),rgba(255,243,208,.95))}

/* operations */
.ops__now{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;
  border:1px solid var(--hair);background:rgba(255,255,255,.03);margin-bottom:8px}
.ops__now .who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.ops__now .who b{font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.ops__now .who span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ops__now .chip{margin-inline-start:auto}
.tk{border:1px solid var(--hair);border-radius:10px;overflow:hidden;margin-bottom:8px}
.tk__row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 9px;
  border-bottom:1px solid var(--hair2);font-size:11px}
.tk__row:last-child{border-bottom:0}
.tk__row span{color:var(--muted)}
.tk__row b{font-family:var(--mono);font-size:10.5px;color:var(--ink2);font-weight:400}
.apr{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:10.5px;color:var(--muted)}
.apr time{font-family:var(--mono);font-size:9px;color:var(--dim)}
.apr i{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.apr .w{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink2)}
.apr .s{margin-inline-start:auto;white-space:nowrap}

/* ── 6 · pastel bento timeline ──────────────────────────────────────────── */
.bento{padding:0}
.bento .phead{padding-bottom:7px}
.bento__track{
  flex:1 1 auto;min-height:0;display:grid;gap:6px;padding:8px 10px 10px;
  grid-template-columns:repeat(8,minmax(0,1fr));
}
.bt{
  position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:start;
  appearance:none;cursor:pointer;border-radius:12px;padding:8px 9px 7px;
  border:1px solid rgba(var(--tile),.30);
  background:
    radial-gradient(120% 96% at 100% -18%,rgba(var(--tile),.34),rgba(var(--tile),.07) 54%,transparent 74%),
    linear-gradient(180deg,rgba(18,26,46,.75),rgba(9,14,28,.9));
  transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden;
}
.bt::before{                    /* one quiet pastel breath at the foot */
  content:"";position:absolute;inset-inline:0;bottom:0;height:56%;
  background:radial-gradient(58% 100% at 50% 100%,rgba(var(--tile),.18),transparent 72%);
  pointer-events:none;
}
.bt:hover{transform:translateY(-2px);border-color:rgba(var(--tile),.5)}
.bt__t{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:rgba(var(--tile),.95);text-transform:uppercase}
.bt__n{font-size:12px;font-weight:600;color:#fff;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt--feed .bt__n{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.02em}
.bt--feed .bt__v{font-size:9.5px}
.bt__v{font-size:10px;color:#d3ddf3;line-height:1.32;margin-top:auto;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt__s{position:absolute;inset-inline-end:8px;top:7px;width:6px;height:6px;border-radius:50%;
  border:1px solid rgba(var(--tile),.5)}
.bt.is-done .bt__s{background:rgba(var(--tile),.9);border-color:transparent;box-shadow:0 0 8px rgba(var(--tile),.6)}
.bt.is-on{
  border-color:rgba(var(--tile),.75);transform:translateY(-3px);
  box-shadow:0 12px 30px -18px rgba(var(--tile),.9),inset 0 0 0 1px rgba(var(--tile),.35);
  background:
    radial-gradient(120% 90% at 80% 0%,rgba(var(--tile),.32),rgba(var(--tile),.10) 60%,transparent 82%),
    linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
}
.bt.is-on .bt__s{background:var(--sun);border-color:transparent;box-shadow:0 0 10px var(--sun)}
.bt.is-on .bt__n{color:#fff}
.bt.is-on .bt__v{color:#e8eeff}
.bento__track .bt:first-child::after{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,rgba(var(--tile),.8),transparent);
}

/* ── 7 · agent router ───────────────────────────────────────────────────── */
.rtabs{display:flex;gap:3px;margin-inline-start:auto;flex:0 0 auto}
.rtab{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--dim);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.18s;
}
.rtab:hover{color:var(--ink2);background:rgba(255,255,255,.05)}
.rtab.on{color:#fff;background:rgba(195,178,255,.16);border-color:rgba(195,178,255,.4)}
.router__grid{
  flex:1 1 auto;min-height:0;display:grid;grid-template-columns:256px minmax(0,1fr);gap:10px;
  padding:9px 10px 10px;
}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;align-content:start;min-height:0;overflow-y:auto;scrollbar-width:none}
.rlist::-webkit-scrollbar{display:none}
.ag{
  display:grid;grid-template-columns:15px minmax(0,1fr) auto;align-items:center;gap:4px;
  padding:4px 5px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:transparent;
  text-align:start;width:100%;appearance:none;transition:background .18s,border-color .18s;
}
.ag:hover{background:rgba(255,255,255,.05)}
.ag svg{width:15px;height:15px;flex:0 0 auto}
.ag .nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ag .nm b{font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .nm i{height:2px;border-radius:1px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px}
.ag .nm i em{display:block;height:100%;background:var(--hue,var(--cyan))}
.ag .st{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--dim)}
.ag.is-on{background:rgba(var(--hue-rgb,111,216,245),.12);border-color:rgba(var(--hue-rgb,111,216,245),.35)}
.ag.is-on .st{color:var(--hue,var(--cyan))}
.ag.is-seat{opacity:.95}

.term{
  display:flex;flex-direction:column;min-height:0;border-radius:11px;overflow:hidden;
  border:1px solid rgba(146,192,255,.16);
  background:
    linear-gradient(180deg,rgba(111,216,245,.05),transparent 30%),
    repeating-linear-gradient(180deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px),
    #040914;
}
.term__head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 9px;
  border-bottom:1px solid rgba(146,192,255,.12);font-family:var(--mono);
  font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-width:0;
}
.term__head .live{display:inline-flex;align-items:center;gap:5px;color:#a7f3d0}
.term__head .live i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
.term__head .flt{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;color:var(--lilac)}
.term__head .flt button{appearance:none;border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;padding:0 2px}
.term__body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 9px;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.term__body::-webkit-scrollbar{width:6px}
.term__body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.ln{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--ink2);
  padding:5px 5px;border-radius:6px;min-width:0;
}
.term__body{gap:3px;padding:8px 10px}
.ln:hover{background:rgba(255,255,255,.035)}
.ln time{flex:0 0 48px;color:#4c5a7d}
.ln .ag2{flex:0 0 auto;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.ln .vb{flex:0 0 auto;color:var(--lilac);font-size:9.5px;letter-spacing:.04em}
.ln .wh{flex:0 1 auto;color:var(--ink2);font-family:var(--ui);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .lead{flex:1 1 12px;min-width:12px;height:1px;align-self:center;border-bottom:1px dotted rgba(146,192,255,.22)}
.ln .out{flex:0 0 auto;color:var(--dim);white-space:nowrap;font-size:8.5px;letter-spacing:.06em}
.ln.is-new{animation:lineIn .5s ease-out both}
.ln .dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-inline-end:4px;transform:translateY(-1px)}
.term__prompt{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 9px 7px;
  border-top:1px solid rgba(146,192,255,.1);font-family:var(--mono);font-size:9.5px;color:var(--dim);
}
.term__sig{color:var(--mint)}
.caret{width:6px;height:12px;background:var(--mint);opacity:.85;animation:blink 1.1s steps(2,end) infinite;display:inline-block}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes lineIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 8 · ticker ─────────────────────────────────────────────────────────── */
.ticker{
  flex:0 0 auto;height:22px;border-top:1px solid var(--hair2);overflow:hidden;
  display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.ticker__in{display:flex;gap:0;white-space:nowrap;animation:marq 64s linear infinite;will-change:transform}
.ticker__in span{
  font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  padding:0 18px;position:relative;
}
.ticker__in span::after{content:"◇";position:absolute;inset-inline-end:-3px;color:rgba(146,192,255,.3)}
@keyframes marq{to{transform:translateX(-50%)}}

@media (max-height:940px) and (min-width:761px){
  .nav__item{min-height:42px;padding:6px 8px}
  .nav__item .t b{font-size:11.5px}
}

/* ── 9 · narrower desktop ───────────────────────────────────────────────── */
@media (max-width:1560px){
  .deck{grid-template-columns:224px minmax(0,1fr) 312px}
  .globe__inner{grid-template-columns:minmax(0,1fr) 268px}
  .kpi{padding:0 10px}
  .kpi b{font-size:14px}
  .bento__track{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media (max-width:1760px){ .badge{display:none} }
@media (max-width:1700px){ .nav .pcap{display:none} }
@media (max-width:1300px){
  .kpis .kpi:nth-child(n+3){display:none}
  .deck{grid-template-columns:176px minmax(0,1fr) 300px}
  .bento__track{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr}
  .deck{grid-template-rows:minmax(0,1fr) 190px 250px}
}

/* ── 10 · portrait 4:5 (1080×1350) ──────────────────────────────────────── */
@media (max-aspect-ratio: 5/4) and (min-width:761px){
  .app{height:100dvh;min-height:0;padding:12px 14px 8px;gap:10px}
  .bar{height:60px}
  .deck{
    flex:1 1 auto;min-height:0;
    grid-template-columns:180px minmax(0,1fr) 332px;
    grid-template-rows:minmax(0,1fr) 150px 326px;
    grid-template-areas:
      "nav globe side"
      "bento bento bento"
      "router router router";
  }
  .globe__inner{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(240px,1fr) auto;gap:6px}
  .globe__canvas{min-height:240px}
  .case{
    display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px 16px;align-items:start;
    padding:9px 12px;border-radius:12px;
  }
  .case.is-board{display:flex;flex-direction:column;align-items:stretch;gap:7px}
  .nav__item .t b{white-space:normal;overflow:visible;text-overflow:clip}
  .nav__item .t span{font-size:10px}
  .case.is-board .board__stats{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:62px}

/* ── 12 · day mode ──────────────────────────────────────────────────────── */
.app[data-theme="day"]{
  --bg0:#eef2fb; --bg1:#f4f7ff; --bg2:#eaf0fb;
  --panel:rgba(255,255,255,.86); --panel2:#ffffff;
  --deep:#ffffff; --raise:#eef4ff;
  --hair:#d5dfef; --hair2:#e6ecf7;
  --ink:#0d1830; --ink2:#26355c; --muted:#54618a; --dim:#66739a;
  --cyan:#0a7fb0; --cyan-rgb:10,127,176;
  --blue:#3c62c8; --blue-rgb:60,98,200;
  --mint:#0b8f74; --mint-rgb:11,143,116;
  --gold:#9a6a00; --gold-rgb:154,106,0;
  --peach:#b25a2c; --peach-rgb:178,90,44;
  --rose:#b03466; --rose-rgb:176,52,102;
  --lilac:#5b4bc4; --lilac-rgb:91,75,196;
  --sun:#8a6400; --sun-rgb:138,100,0;
  --ok:#12793f; --warn:#9a6a00; --hold:#b25a2c; --alert:#b03466;
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 80% -10%, rgba(255,196,140,.20), transparent 62%),
    radial-gradient(900px 560px at 10% -6%, rgba(111,216,245,.22), transparent 60%),
    var(--bg1);
}
.app[data-theme="day"] .bar{background:linear-gradient(180deg,#fff,#f5f9ff)}
.app[data-theme="day"] .mark{box-shadow:0 0 0 1px rgba(10,30,70,.12)}
.app[data-theme="day"] .wordmark,.app[data-theme="day"] .clock b{color:#0d1830}
.app[data-theme="day"] .badge{color:#8a5a00;background:rgba(251,191,36,.16);border-color:rgba(150,100,0,.35)}
.app[data-theme="day"] .ico,.app[data-theme="day"] .seg,.app[data-theme="day"] .pbtn{background:#fff;color:#26355c}
.app[data-theme="day"] .panel{background:#fff;box-shadow:0 18px 44px -40px rgba(16,30,60,.5)}
.app[data-theme="day"] .panel::after{opacity:.9;background:linear-gradient(90deg,transparent,rgba(255,180,120,.5),transparent)}
.app[data-theme="day"] .term{background:#0b1220;border-color:#1c2846}
.app[data-theme="day"] .case{background:linear-gradient(180deg,#fff,#f7faff)}
.app[data-theme="day"] .bt{background:linear-gradient(180deg,rgba(var(--tile),.16),rgba(var(--tile),.05))}
.app[data-theme="day"] .mbar{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,250,255,.995))}
.app[data-theme="day"] .mtab.on{color:#0a7fb0}

/* day: the ink flips, so every piece that assumed a dark page needs its own tone */
.app[data-theme="day"] .bt__n{color:#0d1830}
.app[data-theme="day"] .bt__v{color:#42506f}
.app[data-theme="day"] .bt__t{color:#5b688c}
.app[data-theme="day"] .bt__s{border-color:rgba(10,30,70,.28)}
.app[data-theme="day"] .bt.is-done .bt__s{background:#0b8f74;border-color:transparent}
.app[data-theme="day"] .bt.is-on{
  box-shadow:0 10px 26px -22px rgba(16,30,60,.6),inset 0 0 0 1px rgba(var(--tile),.5);transform:none;
}
.app[data-theme="day"] .case__now{background:rgba(var(--gold-rgb),.08);border-color:rgba(var(--gold-rgb),.3)}
.app[data-theme="day"] .case__now b{color:#3b2c05}
.app[data-theme="day"] .dtab.on,.app[data-theme="day"] .rtab.on{
  color:#0a3f57;background:rgba(var(--cyan-rgb),.13);border-color:rgba(var(--cyan-rgb),.34);
}
.app[data-theme="day"] .dtab:hover,.app[data-theme="day"] .rtab:hover{background:rgba(10,30,70,.05)}
.app[data-theme="day"] .case__dots i{background:rgba(10,30,70,.12)}
.app[data-theme="day"] .case__dots i.done{background:rgba(var(--mint-rgb),.7)}
.app[data-theme="day"] .case__dots i.on{background:var(--sun);box-shadow:0 0 8px rgba(var(--sun-rgb),.5)}
.app[data-theme="day"] .dfoot{background:#f4f9ff;border-color:#dbe5f4}
.app[data-theme="day"] .bst,.app[data-theme="day"] .board__top{background:#f7faff;border-color:#dfe8f6}
.app[data-theme="day"] .case__x{background:#fff;color:#5b688c}
.app[data-theme="day"] .hudchip{background:rgba(255,255,255,.9);border-color:rgba(var(--hue,10,127,176),.45);color:rgb(var(--hue,10,127,176))}

.app[data-theme="day"] .ag.is-on{background:rgba(var(--hue-rgb,111,216,245),.14)}
.app[data-theme="day"] .case__ref{color:var(--ink)}
.app[data-theme="day"] .term{background:#f5f9ff;border-color:#dbe5f4;
  background-image:linear-gradient(180deg,rgba(10,127,176,.05),transparent 30%)}
.app[data-theme="day"] .term__body{color:#22304f}
.app[data-theme="day"] .tk .k,.app[data-theme="day"] .term .ln
.app[data-theme="day"] .globe__legend,.app[data-theme="day"] .ticker{color:#5b688c}

/* ── 13 · reduced motion ────────────────────────────────────────────────── */
/* a case opens like a page turning into place — one short, calm move */
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.994)}to{opacity:1;transform:none}}
.case.is-focus{animation:cardIn .34s cubic-bezier(.2,.7,.3,1) both}
@media (prefers-reduced-motion: reduce){ .case.is-focus{animation:none} }

/* ── 13 · cause → effect ────────────────────────────────────────────────
   Every action leaves a short trace: the control that fired it pulses once,
   the panels it changed glow once. Nothing moves, nothing jumps. */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}
@keyframes srcPulse{
  0%{box-shadow:0 0 0 0 rgba(var(--cyan-rgb),.45)}
  100%{box-shadow:0 0 0 9px rgba(var(--cyan-rgb),0)}
}
.is-src{animation:srcPulse .5s ease-out 1}
@keyframes panelHit{
  0%{border-color:rgba(var(--cyan-rgb),.6);
     box-shadow:inset 0 0 0 1px rgba(var(--cyan-rgb),.22),0 0 36px -14px rgba(var(--cyan-rgb),.55)}
  100%{border-color:var(--hair);box-shadow:none}
}
.panel.is-hit{animation:panelHit 1.1s ease-out 1}
@keyframes beadPulse{
  0%{transform:scale(1);opacity:.35}
  35%{transform:scale(1.5);opacity:1}
  100%{transform:scale(1);opacity:1}
}

<script>/* ==========================================================================
   HEAVEN · the mind globe  (round 6)
   --------------------------------------------------------------------------
   A real sphere on a 2-D canvas, drawn at device pixel ratio. Every point is
   placed on a unit sphere, turned by yaw + pitch, projected orthographically,
   and shaded by its depth: the far side of the grid is dim, the near side is
   bright, so the globe reads as glass rather than a disc of dots.

   The default view is the whole room: ten cases riding six stations, each
   trailed by the agents working it. Nothing waits for a selection — selecting
   one only turns the camera and dims the rest.
   ========================================================================== */
window.HV = window.HV || {};
HV.globe = (function () {
  'use strict';

  var TAU = Math.PI * 2, D = Math.PI / 180;
  var STAGE_HUE = [[111, 216, 245], [127, 232, 207], [255, 212, 137], [255, 179, 146], [195, 178, 255], [143, 180, 255]];

  var cv, ctx, host, ringHost, o = {};
  var W = 0, H = 0, CX = 0, CY = 0, R = 120, ringR = 150, dpr = 1, scale = 1, tScale = 1;
  var yaw = 0.62, pitch = -0.30, vyaw = 0, vpitch = 0, targetYaw = null;
  var dragging = false, moved = false, dragId = null, idle = 9, lastT = 0, raf = 0;
  var stage = 2, focus = null, hoverS = -1, hoverC = -1, reduce = false, booted = false, light = false;
  var stars = [], grid = [], arcs = [], stations = [], nodes = [], packets = [], pulses = [], hits = [], chips = [];
  var dim = {};                       /* the room's current light, refreshed per mode */

  function rnd(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

  /* ---------- geometry ---------- */
  function unit(lat, lon) {
    var la = lat * D, lo = lon * D;
    return { x: Math.cos(la) * Math.cos(lo), y: Math.sin(la), z: Math.cos(la) * Math.sin(lo) };
  }
  function rot(p) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var x1 = p.x * cy + p.z * sy;
    var z1 = -p.x * sy + p.z * cy;
    var y2 = p.y * cp - z1 * sp;
    var z2 = p.y * sp + z1 * cp;
    return { x: x1, y: y2, z: z2 };
  }
  function proj(p) {
    var q = rot(p), r = R * scale;
    return { x: CX + q.x * r, y: CY - q.y * r, z: q.z };
  }
  function nlerp(a, b, t) {
    var x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t, z = a.z + (b.z - a.z) * t;
    var m = Math.hypot(x, y, z) || 1;
    return { x: x / m, y: y / m, z: z / m };
  }
  function arcPts(a, b, n, lift) {
    var out = [], i, p, k;
    for (i = 0; i <= n; i++) {
      p = nlerp(a, b, i / n);
      k = 1 + (lift || 0.05) * Math.sin(Math.PI * (i / n));
      out.push({ x: p.x * k, y: p.y * k, z: p.z * k });
    }
    return out;
  }
  function along(pts, t) {
    t = Math.max(0, Math.min(0.9999, t));
    var f = t * (pts.length - 1), i = Math.floor(f), k = f - i;
    var a = pts[i], b = pts[i + 1] || a;
    return nlerp(a, b, k);
  }

  /* ---------- build the scene ---------- */
  function makeScene() {
    var r = rnd(11), i;

    /* starfield behind the glass: screen-space, parallax by yaw */
    stars = [];
    for (i = 0; i < 120; i++) {
      stars.push({ x: r(), y: r(), s: 0.4 + r() * 1.3, a: 0.10 + r() * 0.5, ph: r() * TAU, d: 0.3 + r() * 0.9 });
    }

    /* graticule */
    grid = [];
    var lat, lon, pts, k;
    for (lat = -60; lat <= 60; lat += 30) {
      pts = [];
      for (i = 0; i <= 72; i++) pts.push(unit(lat, i / 72 * 360));
      grid.push(pts);
    }
    for (lon = 0; lon < 360; lon += 30) {
      pts = [];
      for (i = 0; i <= 72; i++) pts.push(unit(-90 + i / 72 * 180, lon));
      grid.push(pts);
    }

    /* the six stations on one tilted orbit */
    stations = HV.stages.map(function (s, n) {
      return { k: n, p: unit(16, n * 60 + 8), hue: STAGE_HUE[n], n: s.n };
    });

    /* station to station rails */
    arcs = stations.map(function (a, n) {
      var b = stations[(n + 1) % stations.length];
      return { k: n, pts: arcPts(a.p, b.p, 34, 0.055), hue: STAGE_HUE[n] };
    });

    /* the cases: nodes near their station, each with its own colour */
    nodes = (HV.cases || []).map(function (c, n) {
      return { i: n, c: c, p: unit(c.lat, c.lon), hue: (HV.caseHue ? HV.caseHue(c) : '111,216,245').split(',').map(Number), ph: n * 0.7 };
    });

    /* ---------- the swarm ---------- */
    packets = [];
    nodes.forEach(function (nd, n) {
      var home = stations[nd.c.stage];
      var next = stations[(nd.c.stage + 1) % stations.length];
      var route = arcPts(nd.p, home.p, 16, 0.03).concat(arcPts(home.p, next.p, 26, 0.06).slice(1));
      var back = arcPts(next.p, home.p, 20, 0.05);
      packets.push({ pts: route, t: (n * 0.17) % 1, sp: 0.055 + (n % 3) * 0.012, hue: nd.hue, ci: n, w: 1, home: home });
      packets.push({ pts: back, t: (n * 0.31) % 1, sp: 0.045 + (n % 2) * 0.014, hue: nd.hue, ci: n, w: 1, home: home });
    });
    /* ambient traffic: agents crossing between stations, no case attached */
    var rr = rnd(29);
    for (i = 0; i < 68; i++) {
      var a1 = stations[Math.floor(rr() * 6)], b1 = stations[Math.floor(rr() * 6)];
      if (a1 === b1) b1 = stations[(a1.k + 1) % 6];
      packets.push({
        pts: arcPts(a1.p, b1.p, 20, 0.03 + rr() * 0.05), t: rr(), sp: 0.09 + rr() * 0.1,
        hue: STAGE_HUE[a1.k], ci: null, w: 0.5
      });
    }
  }

  /* ---------- a small cache for the five big gradients ----------
     They are re-filled every frame but only change with the canvas size or the
     room's light, so we build them once instead of sixty times a second. */
  var gradCache = null, gradKey = '';
  function grads() {
    var key = W + 'x' + H + (light ? 'd' : 'n');
    if (gradCache && gradKey === key) return gradCache;
    var bg = ctx.createRadialGradient(CX, CY * 0.9, R * 0.2, CX, CY, Math.max(W, H) * 0.72);
    if (light) {
      bg.addColorStop(0, 'rgba(190,222,255,.55)');
      bg.addColorStop(0.55, 'rgba(226,238,255,.35)');
      bg.addColorStop(1, 'rgba(240,246,255,0)');
    } else {
      bg.addColorStop(0, 'rgba(22,44,84,.55)');
      bg.addColorStop(0.55, 'rgba(8,16,34,.22)');
      bg.addColorStop(1, 'rgba(4,8,18,0)');
    }
    var at = ctx.createRadialGradient(CX - R * 0.12, CY - R * 0.16, R * 0.86, CX, CY, R * 1.22);
    at.addColorStop(0, 'rgba(111,216,245,0)');
    at.addColorStop(0.62, 'rgba(111,216,245,.12)');
    at.addColorStop(0.86, 'rgba(143,180,255,.07)');
    at.addColorStop(1, 'rgba(143,180,255,0)');
    var body = ctx.createRadialGradient(CX - R * 0.42, CY - R * 0.46, R * 0.1, CX, CY, R * 1.06);
    if (light) {
      body.addColorStop(0, '#e2f0ff'); body.addColorStop(0.36, '#c3dbf6');
      body.addColorStop(0.74, '#9dc2e8'); body.addColorStop(1, '#7aa7d8');
    } else {
      body.addColorStop(0, '#1d4a80'); body.addColorStop(0.34, '#123159');
      body.addColorStop(0.72, '#0a1c38'); body.addColorStop(1, '#050d1c');
    }
    var limb = ctx.createRadialGradient(CX + R * 0.66, CY + R * 0.74, R * 0.16, CX + R * 0.30, CY + R * 0.36, R * 1.30);
    limb.addColorStop(0, light ? 'rgba(60,96,150,.24)' : 'rgba(0,2,8,.42)');
    limb.addColorStop(0.55, light ? 'rgba(60,96,150,.08)' : 'rgba(0,2,8,.16)');
    limb.addColorStop(1, 'rgba(0,0,0,0)');
    var spec = ctx.createRadialGradient(CX - R * 0.34, CY - R * 0.40, 0, CX - R * 0.34, CY - R * 0.40, R * 0.60);
    spec.addColorStop(0, light ? 'rgba(255,255,255,.38)' : 'rgba(196,238,255,.14)');
    spec.addColorStop(0.55, light ? 'rgba(255,255,255,.08)' : 'rgba(196,238,255,.03)');
    spec.addColorStop(1, 'rgba(255,255,255,0)');
    var rim = ctx.createLinearGradient(CX - R, CY - R, CX + R, CY + R);
    rim.addColorStop(0, 'rgba(160,230,255,.85)');
    rim.addColorStop(0.42, 'rgba(143,180,255,.35)');
    rim.addColorStop(0.7, 'rgba(195,178,255,.22)');
    rim.addColorStop(1, 'rgba(255,212,137,.55)');
    gradCache = { bg: bg, at: at, body: body, limb: limb, spec: spec, rim: rim };
    gradKey = key;
    return gradCache;
  }

  /* ---------- sizing ---------- */
  function resize() {
    if (!cv) return;
    var box = host.getBoundingClientRect();
    dpr = Math.min(2.2, window.devicePixelRatio || 1);
    W = Math.max(120, Math.round(box.width));
    H = Math.max(120, Math.round(box.height));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H / 2;
    R = Math.min(W, H) / 2 - Math.min(43, H * 0.105);
    ringR = Math.min(R + Math.min(24, R * 0.15), Math.min(W, H) / 2 - 17);
    gradCache = null;
    placeChips();
    draw(performance.now(), 0);
  }

  function placeChips() {
    if (!ringHost) return;
    chips.forEach(function (c, n) {
      var a = (-90 + n * 60) * D;
      c.style.left = (CX + Math.cos(a) * ringR).toFixed(1) + 'px';
      c.style.top = (CY + Math.sin(a) * ringR).toFixed(1) + 'px';
    });
  }

  /* ---------- the frame ---------- */
  var t0 = 0;
  function draw(ts, dt) {
    if (!ctx) return;
    var t = ts / 1000;
    ctx.clearRect(0, 0, W, H);

    var G = grads();
    /* --- the air behind the glass --- */
    ctx.fillStyle = G.bg;
    ctx.fillRect(0, 0, W, H);

    var i, n, p, q;
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      var sx = ((s.x + yaw * 0.035 * s.d) % 1 + 1) % 1 * W;
      var sy = s.y * H;
      var tw = 0.55 + 0.45 * Math.sin(t * 0.9 + s.ph);
      ctx.globalAlpha = s.a * tw * (light ? 0.5 : 1);
      ctx.fillStyle = light ? '#7fa6d8' : '#cfe6ff';
      ctx.beginPath(); ctx.arc(sx, sy, s.s, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* --- atmosphere --- */
    ctx.fillStyle = G.at;
    ctx.beginPath(); ctx.arc(CX, CY, R * 1.24, 0, TAU); ctx.fill();

    /* --- the sphere, lit from the upper left --- */
    ctx.fillStyle = G.body;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.fill();

    /* limb shadow: the far side rolls away from the light */
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.clip();
    ctx.fillStyle = G.limb; ctx.fillRect(CX - R, CY - R, R * 2, R * 2);
    /* glass: a soft specular bloom over the lit quadrant */
    ctx.fillStyle = G.spec; ctx.fillRect(CX - R, CY - R, R * 2, R * 2);
    ctx.restore();

    /* the quiet sun inside: the logo's arch as a core */
    var sun = ctx.createRadialGradient(CX - R * 0.3, CY - R * 0.34, 0, CX - R * 0.3, CY - R * 0.34, R * 0.95);
    sun.addColorStop(0, 'rgba(255,243,208,' + (0.16 + 0.03 * Math.sin(t / 2.4)).toFixed(3) + ')');
    sun.addColorStop(0.5, 'rgba(255,212,137,.05)');
    sun.addColorStop(1, 'rgba(255,212,137,0)');
    ctx.fillStyle = sun;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.fill();

    /* --- graticule: far side first, then near side --- */
    drawGrid();

    /* --- station rails --- */
    for (i = 0; i < arcs.length; i++) {
      var on = i === stage;
      strokePath(arcs[i].pts, 'rgba(' + hue(arcs[i].hue) + ',' + (on ? '.55' : '.20') + ')', on ? 1.5 : 1);
    }

    /* --- pulses left by arriving agents --- */
    for (i = pulses.length - 1; i >= 0; i--) {
      var pu = pulses[i];
      pu.r += dt * 46; pu.a -= dt * 0.9;
      if (pu.a <= 0) { pulses.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(pu.x, pu.y, pu.r, 0, TAU);
      ctx.strokeStyle = 'rgba(' + hue(pu.hue) + ',' + pu.a.toFixed(2) + ')';
      ctx.lineWidth = 1; ctx.stroke();
    }

    /* --- the swarm --- */
    hits = [];
    var order = packets.slice().sort(function (a, b) { return rot(along(a.pts, a.t)).z - rot(along(b.pts, b.t)).z; });
    for (i = 0; i < order.length; i++) drawPacket(order[i], t, dt);

    /* --- nodes: cases then stations, back to front --- */
    var draws = [];
    nodes.forEach(function (nd) {
      var q2 = proj(nd.p);
      draws.push({ z: q2.z, fn: function () { drawCaseNode(nd, q2, t); } });
    });
    stations.forEach(function (st2) {
      var q3 = proj(st2.p);
      draws.push({ z: q3.z, fn: function () { drawStation(st2, q3, t); } });
    });
    draws.sort(function (a, b) { return a.z - b.z; });
    draws.forEach(function (d) { d.fn(); });

    /* --- rim: a lit edge and a cool halo --- */
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R - 0.5, 0, TAU);
    ctx.strokeStyle = G.rim; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.restore();

    /* specular kiss, upper-left */
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, Math.PI * 1.02, Math.PI * 1.52);
    ctx.strokeStyle = 'rgba(214,242,255,.5)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();

    /* the astrolabe: a fine ring of ticks around the glass */
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R + 15, 0, TAU);
    ctx.strokeStyle = light ? 'rgba(30,74,134,.20)' : 'rgba(150,205,255,.10)';
    ctx.lineWidth = 1; ctx.stroke();
    for (i = 0; i < 72; i++) {
      var ang = (i / 72) * TAU + yaw * 0.12;
      var big = i % 6 === 0;

      }
    });
    var pt = document.getElementById('mt-portal'), pr = HV.str[ar ? 'ar' : 'en'].portal;
    if (pt) {
      var lbl = document.getElementById('mtPortalTxt');
      if (lbl) lbl.textContent = pr.label;
      pt.setAttribute('aria-label', pr.aria);
      pt.setAttribute('title', pr.aria);
    }
  }

  function mShow(id) {
    if (!views[id]) return;
    curView = id;
    Object.keys(views).forEach(function (k) { views[k].classList.toggle('is-on', k === id); });
    Array.prototype.forEach.call(document.querySelectorAll('.mtab'), function (b) {
      var on = b.getAttribute('data-mv') === id;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    views[id].scrollTop = 0;
  }

  function mSyncGuide() {
    if (!mOn || !barEl) return;
    var s = state.stage, ar = lang === 'ar', st = HV.stages[s];
    Array.prototype.forEach.call(document.querySelectorAll('#mdots button'), function (b, i) {
      b.classList.toggle('done', i < s);
      b.classList.toggle('on', i === s);
    });
    $('mgTitle').textContent = ar ? st.ar : st.en;
    $('mgSub').textContent = (state.sel == null ? (ar ? 'الغرفة' : 'room') : state.ref) + ' · ' + (s + 1) + ' / 6';
    $('mNextTxt').textContent = s >= 5 ? (ar ? 'من جديد' : 'restart') : (ar ? 'التالي' : 'next');
  }

  function mMeasure() {
    if (!barEl) return;
    document.documentElement.style.setProperty('--mbar', (barEl.offsetHeight || 100) + 'px');
  }

  /* ---------- boot ---------- */
  function boot() {
    if (booted) return; booted = true;
    /* the address bar wins: paint the document language before the first render,
       because every string helper reads it (ui.js · isAr) */
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    applyDir();
    setTheme(theme);
    HV.ui.renderAll(state);
    wire();
    HV.globe.mount($('globe'), {
      onPick: function (i) { setStage(i); },
      onCase: function (i) { setCase(i); },
      onHover: function (kind, i) {
        var n = $('globeHint'); if (!n) return;
        if (kind === 'stage') n.textContent = HV.stages[i].n + ' · ' + (lang === 'ar' ? HV.stages[i].ar : HV.stages[i].en);
        else if (kind === 'case') n.textContent = HV.cases[i].ref + ' · ' + (lang === 'ar' ? HV.cases[i].line.ar : HV.cases[i].line.en);
        else hintDefault();
      }
    });
    HV.globe.setStage(state.stage, false);
    mInit();
    if (qs.get('capture') === '1') {
      document.body.classList.add('is-capture');
      var tools = document.querySelector('.tools');
      if (tools) tools.style.display = 'none';
    }
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
