<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="HEAVEN — interactive simulation: watch a need become a coordinated possibility for help. محاكاة تفاعلية.">
<title>HEAVEN — Interactive Multi-Agent Simulation</title>
<style>
:root{
  --bg:#02040a; --navy:#0b1026; --ink:#eef1ff; --dim:#8f9bb8; --faint:#5a6685;
  --cyan:#7fd4e8; --blue:#3f8cff; --teal:#53e0c8; --violet:#b48cff;
  --gold:#f5c86e; --amber:#ff9a3c; --green:#4ade80; --red:#f87171;
  --line:rgba(127,212,232,.16); --line2:rgba(127,212,232,.30);
  --card:rgba(10,16,36,.78); --radius:12px;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  min-height:100vh; line-height:1.7; overflow-x:hidden; font-size:16px;}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:6px;}
[hidden]{display:none !important;}
a{color:var(--cyan);}
/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:8px;
  padding:8px 12px; background:rgba(2,4,10,.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;}
.sitelogo{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink);
  font-weight:800; letter-spacing:.14em; font-size:.8rem;}
.sitelogo img{width:28px; height:auto;}
.honest{font-size:.62rem; letter-spacing:.08em; color:var(--amber);
  border:1px solid rgba(255,154,60,.45); border-radius:999px; padding:3px 10px;
  white-space:nowrap;}
.topbtns{display:flex; gap:6px; margin-inline-start:auto; align-items:center;}
.tbtn{background:transparent; border:1px solid var(--line); color:var(--ink);
  border-radius:999px; padding:7px 14px; font-size:.84rem; cursor:pointer; min-height:40px;}
.tbtn[aria-pressed="true"]{border-color:var(--cyan); color:var(--cyan);}
.tbtn.warn[aria-pressed="true"]{border-color:var(--amber); color:var(--amber);}
select.tbtn{appearance:none; padding-inline-end:14px;}
/* ---------- stage ---------- */
.stageWrap{position:relative; height:58vh; min-height:380px; overflow:hidden;
  border-bottom:1px solid var(--line);}
#gl{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation;}
#glFallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
#glFallback img{width:140px; opacity:.9;}
#tagLayer{position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
.atag{position:absolute; transform:translate(-50%,-50%); text-align:center;
  font-size:.66rem; letter-spacing:.06em; color:var(--dim); white-space:nowrap;
  background:rgba(2,4,10,.66); border:1px solid var(--line); border-radius:999px;
  padding:3px 10px; pointer-events:auto; cursor:pointer; max-width:44vw;
  overflow:hidden; text-overflow:ellipsis; transition:border-color .4s,color .4s;}
.atag b{display:block; font-size:.7rem; color:var(--ink); font-weight:700;}
.atag.on{color:var(--cyan); border-color:var(--line2);}
.atag.sel{border-color:var(--gold); color:var(--gold);}
.atag.dim{opacity:.35;}
#caseBanner{position:absolute; z-index:6; bottom:10px; inset-inline:10px;
  background:rgba(2,4,10,.72); border:1px solid var(--line); border-radius:10px;
  padding:8px 14px; font-size:.82rem; color:var(--ink); display:flex; gap:10px;
  align-items:center; backdrop-filter:blur(6px);}
#caseBanner .dot{width:9px; height:9px; border-radius:50%; background:var(--cyan);
  box-shadow:0 0 10px var(--cyan); flex:none;}
#caseBanner small{color:var(--dim);}
/* ---------- ops area ---------- */
.ops{max-width:1280px; margin:0 auto; padding:14px 12px 30px;}
.ctlBar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.btn{display:inline-block; padding:11px 20px; border-radius:10px; border:1px solid var(--line);
  background:rgba(20,30,60,.6); color:var(--ink); font-size:.9rem; cursor:pointer;
  min-height:48px; text-decoration:none;
  transition:transform .22s ease, box-shadow .3s ease, background .3s ease, border-color .3s ease;}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(135deg,var(--blue),#22b8d4); border:0; font-weight:700;}
.btn.amber{border-color:rgba(255,154,60,.55); color:var(--amber);}
.btn.green{border-color:rgba(74,222,128,.5); color:var(--green);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4; cursor:default;}
.btn:disabled:active{transform:none;}
.stepper{display:flex; gap:4px; margin:10px 0 4px; overflow-x:auto; padding-bottom:6px;}
.step{flex:1 0 auto; min-width:86px; text-align:center; font-size:.68rem; color:var(--faint);
  border-top:2px solid var(--line); padding-top:6px; white-space:nowrap;}
.step.done{color:var(--green); border-color:var(--green);}
.step.now{color:var(--cyan); border-color:var(--cyan);}
/* mobile tabs */
.tabs{display:flex; gap:6px; margin:8px 0; position:sticky; top:57px; z-index:20;
  background:rgba(2,4,10,.9); padding:6px 0; backdrop-filter:blur(8px);}
.tab{flex:1; background:transparent; border:1px solid var(--line); color:var(--dim);
  border-radius:9px; padding:9px 4px; font-size:.8rem; cursor:pointer; min-height:44px;}
.tab[aria-selected="true"]{color:var(--ink); border-color:var(--cyan); background:rgba(63,140,255,.12);}
.panel{display:none;}
.panel.show{display:block;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px;}
.card h3{margin:0 0 8px; font-size:.95rem; letter-spacing:.04em;}
.card h3 .sub{display:block; font-size:.76rem; color:var(--dim); font-weight:400;}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:.85rem;}
.kv dt{color:var(--dim);} .kv dd{margin:0;}
.pill{display:inline-block; font-size:.68rem; letter-spacing:.06em; border:1px solid var(--line);
  border-radius:999px; padding:2px 10px; color:var(--dim); margin:1px 2px;}
.pill.work{border-color:var(--cyan); color:var(--cyan);}
.pill.wait{border-color:var(--amber); color:var(--amber);}
.pill.done{border-color:var(--green); color:var(--green);}
.pill.bad{border-color:var(--red); color:var(--red);}
.pill.idle{opacity:.7;}
.agentrow{display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:8px;
  cursor:pointer; border:1px solid transparent; min-height:48px;}
.agentrow:active{background:rgba(63,140,255,.08);}
.agentrow.sel{border-color:var(--gold); background:rgba(245,200,110,.06);}
.agentrow .swatch{width:12px; height:12px; border-radius:3px; flex:none;}
.agentrow .nm{flex:1; font-size:.86rem;}
.resrow{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0;
  cursor:pointer; font-size:.85rem;}
.resrow.sel{border-color:var(--gold);}
.resrow.dead{opacity:.45;}
.resrow.lit{border-color:var(--green);}
.resrow b{color:var(--ink);}
.crit{display:flex; gap:6px; align-items:baseline; font-size:.78rem; color:var(--dim); padding:2px 0;}
.crit .y{color:var(--green);} .crit .n{color:var(--red);}
.term{background:#01030a; border:1px solid var(--line); border-radius:10px;
  font-family:var(--mono); font-size:.72rem; line-height:1.65; max-height:300px;
  overflow-y:auto; padding:10px 12px; direction:ltr; text-align:left;}
.term .ln{white-space:pre-wrap; word-break:break-word; padding:1px 0; border-bottom:1px dotted rgba(127,212,232,.08);}
.term .sq{color:var(--faint); margin-right:8px;}
.term .k-handoff{color:var(--cyan);} .term .k-search{color:var(--blue);}
.term .k-review,.term .k-exception{color:var(--amber);} .term .k-confirmed{color:var(--green);}
.term .k-decline,.term .k-nomatch{color:var(--red);} .term .k-case{color:#fff;}
.term .k-agent{color:var(--dim);} .term .k-task{color:var(--violet);}
.term .k-clarify,.term .k-structured,.term .k-match,.term .k-propose,.term .k-approved,
.term .k-accepted,.term .k-awaiting,.term .k-retry{color:var(--teal);}
.decisionBox{border:1px solid rgba(255,154,60,.5); border-radius:10px; padding:12px;
  background:rgba(255,154,60,.05); margin:8px 0;}
.decisionBox .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.decisionBox .btns .btn{flex:1 1 30%;}
/* inspector bottom sheet */
.sheet{position:fixed; z-index:60; bottom:0; inset-inline:0; max-height:62vh; overflow-y:auto;
  background:rgba(6,10,24,.97); border-top:1px solid var(--line2); border-radius:16px 16px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -12px 40px rgba(0,0,0,.6);}
.sheet h3{margin:0 0 6px; font-size:1rem;}
.sheet .x{position:absolute; top:10px; inset-inline-end:12px;}
.meterRow{display:flex; gap:8px; align-items:center; font-size:.78rem; color:var(--dim); margin-top:8px;}
footer{border-top:1px solid var(--line); padding:20px 14px 44px; text-align:center;
  color:var(--dim); font-size:.8rem;}
footer nav{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:8px;}
/* ---------- desktop ---------- */
@media (min-width:900px){
  .stageWrap{height:72vh;}
  .tabs{display:none;}
  .panel{display:block !important;}
  .opsGrid{display:grid; grid-template-columns:290px 1fr 340px; gap:12px; align-items:start;}
  .opsCol{display:flex; flex-direction:column;}
  .term{max-height:420px;}
  .sheet{top:76px; bottom:auto; inset-inline-end:12px; inset-inline-start:auto; width:360px;
    max-height:calc(100vh - 100px); border:1px solid var(--line2); border-radius:14px;}
  .atag{font-size:.72rem;}
}
@media (max-width:559px){
  .atag:not(.on){display:none;}
  .atag.on{font-size:.78rem; padding:5px 14px;}
  .decisionBox .btns .btn{flex:1 1 100%;}
  .ctlBar .btn{flex:1 1 100%;}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
  html{scroll-behavior:auto;}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="sitelogo" href="index.html"><img src="assets/heaven-mark-transparent.png" alt="HEAVEN"><span>HEAVEN</span></a>
  <span class="honest" data-i18n="honest"></span>
  <div class="topbtns">
    <button class="tbtn" id="langBtn">EN</button>
    <button class="tbtn" id="sndBtn" aria-label="sound">🔊</button>
    <button class="tbtn" id="pauseBtn" data-i18n="pause"></button>
    <button class="tbtn" id="calmBtn" aria-pressed="false"></button>
    <select class="tbtn" id="qualitySel" aria-label="quality"></select>
  </div>
</header>

<section class="stageWrap" id="stageWrap">
  <canvas id="gl"></canvas>
  <div id="glFallback" hidden><img src="assets/heaven-mark-transparent.png" alt="HEAVEN"></div>
  <div id="tagLayer"></div>
  <div id="caseBanner"><span class="dot" id="caseDot"></span><div><div id="caseLine"></div><small id="caseSub"></small></div></div>
</section>

<div class="ops">
  <div class="ctlBar" id="ctlBar"></div>
  <div class="stepper" id="stepper"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="opsGrid" id="opsGrid">
    <div class="opsCol" data-col="case">
      <div class="panel" data-panel="case">
        <div class="card"><h3><span data-i18n="cCase"></span><span class="sub" data-i18n="cCaseSub"></span></h3><div id="caseCard"></div></div>
        <div class="card"><h3><span data-i18n="cFlow"></span><span class="sub" data-i18n="cFlowSub"></span></h3><div id="flowCard"></div></div>
        <div class="card" id="reviewCard" hidden><h3><span data-i18n="cReview"></span><span class="sub" data-i18n="cReviewSub"></span></h3><div id="reviewBox"></div></div>
        <div class="card" id="excCard" hidden><h3><span data-i18n="cExc"></span></h3><div id="excBox"></div></div>
      </div>
    </div>
    <div class="opsCol" data-col="agents">
      <div class="panel" data-panel="agents">
        <div class="card"><h3><span data-i18n="cAgents"></span><span class="sub" data-i18n="cAgentsSub"></span></h3><div id="agentList"></div></div>
        <div class="card"><h3><span data-i18n="cRes"></span><span class="sub" data-i18n="cResSub"></span></h3><div id="resList"></div></div>
      </div>
    </div>
    <div class="opsCol" data-col="events">
      <div class="panel" data-panel="events">
        <div class="card"><h3><span data-i18n="cEvents"></span><span class="sub" data-i18n="cEventsSub"></span></h3><div class="term" id="term"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <button class="tbtn x" id="sheetX">✕</button>
  <h3 id="sheetTitle"></h3>
  <div id="sheetBody"></div>
</div>

<footer>
  <nav>
    <a href="index.html" data-i18n="fHome"></a>
    <a href="https://perchance.org/heaven-ai" data-i18n="fApp"></a>
  </nav>
  <div data-i18n="fNote"></div>
</footer>

<script>
/* HEAVEN Ops — deterministic client-side simulation engine (DOM-free).
   7 agents + orchestrator. All data fictional demonstration data.
   Usage: const sim = createSim(seed); sim.on(e=>...); sim.startCase('full'); ... */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const AGENTS = [
  { id: "intake",  color: 0x7fd4e8, ar: "وكيل الاستقبال",        en: "Intake Agent" },
  { id: "verify",  color: 0xb48cff, ar: "وكيل التحقق والسياق",    en: "Context & Verification" },
  { id: "discover",color: 0x3f8cff, ar: "وكيل اكتشاف الموارد",    en: "Resource Discovery" },
  { id: "match",   color: 0x53e0c8, ar: "وكيل المطابقة والتقييم", en: "Matching & Evaluation" },
  { id: "coord",   color: 0xf5c86e, ar: "وكيل التنسيق",           en: "Coordination" },
  { id: "human",   color: 0xff9a3c, ar: "بوابة الإشراف البشري",   en: "Human Oversight" },
  { id: "follow",  color: 0x4ade80, ar: "وكيل المتابعة والنتائج", en: "Follow-up & Outcomes" },
];

const RESOURCES = [
  { id: "kitchen", ar: "مطبخ المجتمع — الرياض", en: "Community Kitchen — Riyadh",
    attrs: { daily: true, distKm: 6, lang: "ar", needsId: false, slots: 14, days: "daily" } },
  { id: "van", ar: "شاحنة بنك الطعام", en: "Food Bank Van",
    attrs: { daily: false, distKm: 12, lang: "ar", needsId: false, slots: 8, days: "tue-thu" } },
  { id: "voucher", ar: "قسائم البقالة التجريبية", en: "Grocery Voucher Pilot",
    attrs: { daily: true, distKm: 4, lang: "en", needsId: true, slots: 2, days: "daily" } },
  { id: "pantry", ar: "مخزن الحي الشمالي", en: "North District Pantry",
    attrs: { daily: false, distKm: 18, lang: "ar", needsId: true, slots: 5, days: "weekly" } },
];

const NEED = { category: "food-temp", city: "Riyadh", lang: "ar", needsDaily: true,
  hasId: false, maxDistKm: 10, duration: "1week", priority: "gentle-urgent" };

function evalCriteria(res) {
  const a = res.attrs, out = [];
  out.push({ key: "daily", pass: !NEED.needsDaily || a.daily,
    ar: "توفر يومي", en: "daily availability" });
  out.push({ key: "dist", pass: a.distKm <= NEED.maxDistKm,
    ar: "المسافة " + a.distKm + " كم (الحد " + NEED.maxDistKm + ")", en: "distance " + a.distKm + " km (limit " + NEED.maxDistKm + ")" });
  out.push({ key: "lang", pass: a.lang === NEED.lang,
    ar: "اللغة: " + (a.lang === "ar" ? "العربية" : "الإنجليزية"), en: "language: " + (a.lang === "ar" ? "Arabic" : "English") });
  out.push({ key: "id", pass: !a.needsId || NEED.hasId,
    ar: a.needsId ? "يتطلب هوية (غير متوفرة)" : "لا يتطلب هوية", en: a.needsId ? "ID required (not available)" : "no ID required" });
  out.push({ key: "slots", pass: a.slots > 0,
    ar: "السعة: " + a.slots, en: "capacity: " + a.slots });
  const fails = out.filter(c => !c.pass).length;
  return { criteria: out, viable: fails === 0, fails };
}

function createSim(seed) {
  const rng = mulberry32(seed == null ? 20261013 : seed);
  const listeners = [];
  const RES = RESOURCES.map(r => ({ ...r, attrs: { ...r.attrs } })); // per-instance copy: capacity evolves locally
  const S = {
    seed, tick: 0, seq: 0,
    phase: "idle",           // idle|intake|clarify|verify|discover|match|coordinate|review|family|follow|outcome
    caseOpen: false,
    structured: null, gaps: [],
    searchResults: [],       // [{resId, viable, fails, criteria}]
    shortlist: [],
    proposed: null,          // resId
    reviewDecision: null,
    familyAccepted: null,
    outcome: null,           // confirmed|awaiting|closed-unconfirmed|declined|no-match|escalated
    outcomeNote: null,
    escalated: false,
    agents: {},              // id -> {state, taskAr, taskEn}
    tasks: [],               // orch queue [{id, owner, label, state}]
    exceptions: [],
  };
  AGENTS.forEach(a => { S.agents[a.id] = { state: "idle", taskAr: "—", taskEn: "—" }; });

  function emit(kind, agentId, ar, en, data) {
    S.seq++; S.tick++;
    const e = { seq: S.seq, tick: S.tick, kind, agent: agentId, ar, en, data: data || null };
    listeners.forEach(f => { try { f(e); } catch (_) {} });
    return e;
  }
  function setAgent(id, state, taskAr, taskEn) {
    S.agents[id] = { state, taskAr: taskAr || S.agents[id].taskAr, taskEn: taskEn || S.agents[id].taskEn };
    emit("agent", id, taskAr || "", taskEn || "", { state });
  }
  function handoff(from, to, ar, en) {
    emit("handoff", from, ar, en, { from, to });
  }
  function queueTask(id, owner, ar, en) {
    S.tasks.push({ id, owner, ar, en, state: "queued" });
    emit("task", owner, "مهمة في الطابور: " + ar, "task queued: " + en, { task: id, state: "queued" });
  }
  function runTask(id, st) {
    const t = S.tasks.find(x => x.id === id);
    if (t) { t.state = st; emit("task", t.owner, "مهمة " + t.ar + ": " + st, "task " + t.en + ": " + st, { task: id, state: st }); }
  }
  function need(cond, ar, en) {
    if (!cond) return { error: en };
    return null;
  }

  const api = {
    on(f) { listeners.push(f); return api; },
    snapshot() { return JSON.parse(JSON.stringify({ ...S, rngState: undefined })); },
    agents: AGENTS, resources: RES,

    reset(newSeed) {
      const fresh = createSim(newSeed == null ? S.seed : newSeed);
      Object.keys(fresh).forEach(k => { if (k !== "on") api[k] = fresh[k]; });
      // rebind methods kept on api; copy state over
      const st = fresh.snapshot();
      Object.keys(st).forEach(k => { S[k] = st[k]; });
      S.seed = st.seed;
      emit("system", null, "أُعيد تشغيل السيناريو (بذرة " + S.seed + ")", "scenario restarted (seed " + S.seed + ")", { seed: S.seed });
      return api;
    },

    startCase(mode) {
      const bad = need(S.phase === "idle", "لا يمكن البدء الآن", "cannot start now");
      if (bad) return bad;
      S.phase = "intake"; S.caseOpen = true;
      setAgent("intake", "working", "يستقبل رسالة الأسرة ويستخرج التفاصيل", "receiving the family message, extracting details");
      emit("case", "intake", "طلب جديد: أسرة في الرياض تحتاج مساعدة غذائية مؤقتة", "new request: Riyadh household needs temporary food assistance", { mode });
      queueTask("structure", "intake", "هيكلة الطلب", "structure request");
      if (mode === "incomplete") {
        S.gaps = ["city", "duration"];
        S.phase = "clarify";
        runTask("structure", "needs-info");
        setAgent("intake", "done", "اكتمل الاستقبال الأولي", "initial intake done");
        setAgent("verify", "working", "رصد نواقص: المدينة والمدة", "found gaps: city and duration");
        handoff("intake", "verify", "الطلب إلى التحقق", "request to verification");
        emit("clarify", "verify", "معلومات ناقصة (المدينة، المدة) — أُعيد للتوضيح بدل التخمين", "missing info (city, duration) — returned for clarification instead of guessing", { gaps: S.gaps });
      } else {
        S.structured = { ...NEED };
        S.phase = "verify";
        runTask("structure", "done");
        setAgent("intake", "done", "اكتملت الهيكلة", "structuring complete");
        handoff("intake", "verify", "طلب مهيكل إلى التحقق", "structured request to verification");
        emit("structured", "verify", "طلب مهيكل: غذاء مؤقت · الرياض · العربية · أسبوع", "structured: temp food · Riyadh · Arabic · 1 week", {});
      }
      return { ok: true };
    },

    completeDetails() {
      const bad = need(S.phase === "clarify", "لا يوجد توضيح معلق", "no pending clarification");
      if (bad) return bad;

    pCol[i*3] = Math.min(1, tmpC.r * v + 0.25); pCol[i*3+1] = Math.min(1, tmpC.g * v + 0.25); pCol[i*3+2] = Math.min(1, tmpC.b * v + 0.25);

}
function flowTick(dt) {

  pGeo.setDrawRange(0, n);
  for (let i = 0; i < n; i++) {
    const e = pEdge[i];
    if (!e || pLife[i] <= 0) { pPos[i*3+1] = -999; continue; }
    pT[i] += pSp[i] * dt / (e.pts.length / 36);
    pLife[i] -= dt;
    if (pT[i] >= 1 || pLife[i] <= 0) { pPos[i*3+1] = -999; pEdge[i] = null; continue; }
    const tt = Math.max(0, pT[i]);
    const fi = Math.min(e.pts.length - 2, tt * (e.pts.length - 1)), i0 = fi | 0, fr = fi - i0;
    const A = e.pts[i0], B = e.pts[i0 + 1];
    pPos[i*3] = A.x + (B.x - A.x) * fr;

}
// ambient dust
const ND = 420, dPos = new Float32Array(ND * 3);
for (let i = 0; i < ND; i++) { dPos[i*3] = (R() - .5) * 14; dPos[i*3+1] = (R() - .5) * 9; dPos[i*3+2] = -2 - R() * 5; }
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute("position", new THREE.BufferAttribute(dPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x5f7398,
  size: 0.035, transparent: true, opacity: 0.4, depthWrite: false }));
scene.add(dust);

/* ---------- tags ---------- */
const tagLayer = document.getElementById("tagLayer");
const tags = {}; // key -> el
function rebuildTags(showRes) {
  tagLayer.innerHTML = "";
  Object.keys(tags).forEach(k => delete tags[k]);
  const mk = (key, title, sub) => {
    const el = document.createElement("div");
    el.className = "atag"; el.innerHTML = "<b></b><span></span>";
    el.querySelector("b").textContent = title;
    el.querySelector("span").textContent = sub;
    el.addEventListener("click", () => {
      const g = groups[key];
      if (g && g.hit) pickEntity(g.hit.userData.pick);
    });
    tagLayer.appendChild(el); tags[key] = el;
  };
  AG.forEach(a => mk("agent:" + a.id, lang === "ar" ? a.ar : a.en, ""));
  mk("gateway", lang === "ar" ? "بوابة بشرية" : "human gateway", "");
  if (showRes) RS.forEach(r => mk("res:" + r.id, lang === "ar" ? r.ar : r.en, ""));
}
const proj = new THREE.Vector3();
let activeKey = null, selKey = null;
function updateTags() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const mobile = camera.aspect < 0.8;
  Object.keys(tags).forEach(key => {
    const el = tags[key], g = groups[key];
    if (!g) { el.style.display = "none"; return; }
    if (mobile && key !== activeKey && key !== selKey && key.indexOf("agent:") === 0 && !el.classList.contains("on")) {
      // mobile shows only active/selected agent tags (CSS also gates .on)
    }
    proj.copy(g.group.position).project(camera);
    el.style.left = ((proj.x * 0.5 + 0.5) * w) + "px";
    el.style.top = ((-proj.y * 0.5 + 0.5) * h) + "px";
    el.classList.toggle("on", key === activeKey);
    el.classList.toggle("sel", key === selKey);
    el.classList.toggle("dim", !!g.dim && key !== activeKey && key !== selKey);
  });
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const hitList = [];
function refreshHits() {
  hitList.length = 0;
  Object.keys(groups).forEach(k => { if (groups[k].hit) hitList.push(groups[k].hit); });
}
canvas.addEventListener("pointerdown", ev => {
  const r = canvas.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(hitList, false);
  if (hits.length) pickEntity(hits[0].object.userData.pick);
});
function pickEntity(pick) {
  if (!pick) { selKey = null; }
  else selKey = (pick.type === "agent" ? "agent:" + pick.id : pick.type === "res" ? "res:" + pick.id : "gateway");
  if (window.HEAVEN_UI && window.HEAVEN_UI.select) window.HEAVEN_UI.select(pick);
  if (selKey && groups[selKey]) lookWant.copy(groups[selKey].group.position);
  else lookWant.set(0, 0.2, 0);
  renderOnce();
}
api.pick = pickEntity;

/* ---------- event reactions ---------- */
function activateAgent(id, hot) {
  activeKey = "agent:" + id;
  Object.keys(groups).forEach(k => {
    if (k.indexOf("agent:") === 0) groups[k].active = (k === activeKey ? 1 : Math.max(0, groups[k].active - 0.4));
  });
  if (hot) burst("core>agent:" + id, 20, 0x9fe8ff, 0.9, 1.2);
}
function resVisual(resId, st) {
  const g = groups["res:" + resId]; if (!g) return;
  g.resState = st;
  const edge = "agent:discover>res:" + resId;
  const tint = (hex, op) => { if (g.oct) g.oct.material.color.set(hex); if (g.rsp) { g.rsp.material.color.set(hex); g.rsp.material.opacity = op; } };

  else if (st === "viable") { g.dim = 0; setEdge(edge, 0.9, 0x4ade80); tint(0x4ade80, 0.7); }
  else if (st === "rejected") { g.dim = 0.75; setEdge(edge, 0.08, 0x553333); tint(0x664444, 0.15); }
  else if (st === "proposed") { g.dim = 0; setEdge(edge, 1.0, 0xf5c86e); tint(0xf5c86e, 0.8); }
  else if (st === "referred") { setEdge("gateway>res:" + resId, 0.95, 0x4ade80); tint(0x4ade80, 0.8); }
  else if (st === "outstanding") { tint(0xff9a3c, 0.7); }
  else if (st === "closed") { g.dim = 0.6; tint(0x5a6685, 0.2); }
  else { g.dim = 0.5; tint(0x3f8cff, 0.4); }
}
api.event = function (e) {
  if (!api.ok) return;
  const D = e.data || {};
  switch (e.kind) {
    case "case":
      beacon.visible = true; beaconGlow.visible = true;
      beacon.position.copy(edges["ext>agent:intake"] ? edges["ext>agent:intake"].pts[0] : entityAnchor("agent:intake"));
      beaconWant.copy(entityAnchor("agent:intake"));
      burst("ext>agent:intake", 30, 0xffffff, 0.7, 1.6);
      activateAgent("intake"); break;
    case "handoff":
      if (D.from === "intake" || D.from === "verify" || D.from === "discover" || D.from === "match" || D.from === "coord" || D.from === "human") {
        const map = { intake: "agent:intake", verify: "agent:verify", discover: "agent:discover", match: "agent:match", coord: "agent:coord", human: "gateway" };
        const a = map[D.from], b = D.to === "human" ? "gateway" : "agent:" + D.to;
        let key = null;
        if (edges[a + ">" + b]) key = a + ">" + b;
        else if (edges["core>" + b]) key = "core>" + b;
        if (key) burst(key, 24, D.to === "human" ? 0xffc37a : 0x9fe8ff, 0.8, 1.6);
        if (b === "gateway") { groups.gateway.active = 1; }
        else activateAgent(D.to);
        if (D.to !== "human") beaconWant.copy(entityAnchor(b));
      }
      break;
    case "agent":
      if (e.agent && groups["agent:" + e.agent]) {
        groups["agent:" + e.agent].active = D.state === "working" || D.state === "waiting" ? 1 : 0.25;
        if (D.state === "working") activeKey = "agent:" + e.agent;
      }
      break;
    case "search":
      resVisual(D.res, "checking");
      burst("agent:discover>res:" + D.res, 16, 0x7fb8ff, 0.9, 1.2);
      setTimeout(() => resVisual(D.res, D.viable ? "viable" : "rejected"), 700);
      break;
    case "match": break;
    case "propose":
      resVisual(D.res, "proposed");
      burst("agent:coord>gateway", 26, 0xf5c86e, 0.7, 1.8);
      break;
    case "review": {
      const gw = groups.gateway; gw.awaiting = true; gw.active = 1;
      break;
    }
    case "approved":
      groups.gateway.awaiting = false;
      resVisual(D.res, "referred");
      burst("gateway>res:" + D.res, 40, 0x4ade80, 0.6, 2.2);
      beaconWant.copy(entityAnchor("res:" + D.res));
      break;
    case "gateway-decline": case "family-decline": case "nomatch":
      groups.gateway.awaiting = false;
      if (D.res) resVisual(D.res, "closed");
      break;
    case "accepted":
      beaconWant.copy(entityAnchor("res:" + D.res));
      burst("gateway>res:" + D.res, 24, 0xffffff, 0.5, 2.0);
      break;
    case "confirmed": {
      const g = groups["res:" + D.res];
      if (g) { g.active = 1; }

      break;
    }
    case "awaiting": case "closed-unconfirmed": case "exception": {

      if (id && groups["res:" + id]) { resVisual(id, "outstanding"); groups["res:" + id].active = 0.6; }

}
api.resetVisual = function () {

/* ---------- configure / layout ---------- */
api.configure = function (opts) {

}
addEventListener("resize", () => { buildEntities(); refreshHits(); rebuildTags(camera.aspect >= 0.8); layout(); });

/* ---------- quality ---------- */
const QDEF = [
  { dpr: 1, core: 350, cloud: 28, glow: false },
  { dpr: 1.5, core: 650, cloud: 48, glow: true },
  { dpr: 2, core: 900, cloud: 64, glow: true },

api.setQuality = function (q) {
  api.quality = q;

};
function applyQ() {
  const Q = QDEF[api.qLevel];

/* ---------- main loop ---------- */
let simT = 0, last = performance.now(), raf = 0;
const tmpV = new THREE.Vector3();
function advance(dt) {
  simT += api.calm ? dt * 0.45 : dt;

  ring1.rotation.z = simT * 0.05; ring2.rotation.z = -simT * 0.04;
  dust.rotation.y = simT * 0.004;

  Object.keys(groups).forEach(k => {
    const g = groups[k];
    const target = (k === activeKey ? 1 : g.active * 0.5) * (1 - (g.dim || 0) * 0.7);
    g.pulse = (g.pulse || 0) + ((target || 0) - (g.pulse || 0)) * Math.min(1, dt * 3);
    if (g.sprite) {
      const bs = g.sprite.userData.base || 1.4;

}
function renderOnce() {

  advance(0.016); api.paused = keep;
}
api.renderOnce = renderOnce;
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (document.hidden || api.paused) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  autoQ(now);
  advance(dt);
}
api.step = dt => advance(Math.min(0.5, dt || 0.05));
api.setPaused = v => { api.paused = v; };
api.setCalm = v => { api.calm = v; };
api.stats = () => ({ fps: Math.round(fpsEMA), q: api.qLevel });
api.dbg = { scene, camera, renderer, groups, edges };
layout();
api.setQuality("auto");
if (reduced) { advance(0.016); api.paused = true; }
else raf = requestAnimationFrame(frame);
}

  taskQ: "Task queue", noRes: "No results yet — run discovery",
  viable: "viable", rejected: "rejected", proposedTag: "proposed", referredTag: "referred",
  inspRole: "Role", inspTask: "Current task", inspIn: "Input", inspOut: "Output",
  inspWhy: "Reason", inspNext: "Next", inspState: "State", inspEvents: "Events",
  close: "Close",
  outNames: { confirmed: "Confirmed outcome", awaiting: "Awaiting confirmation", "closed-unconfirmed": "Closed unconfirmed", declined: "Closed without referral", "no-match": "No match", escalated: "Escalated to human" },
  needLine: "temp food · Riyadh · Arabic · 1 week · gently urgent",
  agentPurpose: [
    "Receives the request in plain language, structures it, finds gaps.",
    "Checks completeness and consistency, minimizes excess data.",
    "Searches the fictional directory, scores each candidate on explicit criteria.",
    "Compares need vs resources, produces a reasoned shortlist.",
    "Prepares the referral, checks duplicates, tracks ownership.",
    "Pauses the workflow for decisions — approval is never automatic.",
    "Tracks the referral, asks what happened, records evidence-based outcomes."
  ],
  agentIn: ["Family message", "Structured request", "Verified request + directory", "Screening results", "Chosen candidate", "Proposed referral + reason", "Referral status"],
  sndOn: "Mute", sndOff: "Sound",
}};
let lang = "ar";
let sim = null, SEED = 20261013;
let autoTimer = 0, autoOn = false;
let selected = null; // {type,id}
let lastEv = null;
let termCount = 0;
const $ = id => document.getElementById(id);
const t = () => T[lang];

/* sound (tiny, optional) */
let AC = null, soundOn = true, master = null;
function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.12; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type, g, w) {
  if (!AC || !soundOn) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    const t0 = AC.currentTime + (w || 0);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(g || 0.4, t0 + 0.015);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(gn); gn.connect(master); o.start(t0); o.stop(t0 + d + 0.05);
  } catch (e) {}
}
const SFX = {
  click() { tone(660, 0.07, "triangle", 0.35); },
  tick() { tone(520, 0.08, "sine", 0.25); },
  good() { tone(523, 0.12, "sine", 0.4); tone(784, 0.2, "sine", 0.35, 0.1); },
  bad() { tone(220, 0.16, "triangle", 0.35); },
};
document.addEventListener("pointerdown", audioInit);
document.addEventListener("keydown", audioInit);

/* ---------- sim wiring ---------- */
function newSim(seed) {
  sim = createSim(seed);
  sim.on(onEvent);
  if (window.HEAVEN_SC && window.HEAVEN_SC.ok) {
    window.HEAVEN_SC.configure({ agents: sim.agents, resources: sim.resources, lang });
  }
  renderAll();
}
function onEvent(e) {
  lastEv = e;
  appendTerm(e);
  if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.event(e);
  if (e.kind === "confirmed") SFX.good();
  else if (/decline|nomatch|exception/.test(e.kind)) SFX.bad();
  else SFX.tick();
  renderDynamic();
}
window.HEAVEN_UI = {
  select(pick) { selected = pick; renderInspector(); renderAgents(); },
  proposed() { const s = sim && sim.snapshot(); return s ? s.proposed : null; },
};

/* ---------- terminal ---------- */
function appendTerm(e) {
  const box = $("term");
  const d = document.createElement("div");
  d.className = "ln";
  const line = document.createElement("span");
  line.className = "k-" + e.kind;
  line.textContent = (lang === "ar" ? e.ar : e.en) + "  ";
  const sq = document.createElement("span");
  sq.className = "sq"; sq.textContent = "#" + e.seq + " t+" + e.tick;
  d.appendChild(line); d.appendChild(sq);
  box.appendChild(d);
  while (box.children.length > 120) box.firstChild.remove();
  box.scrollTop = box.scrollHeight;
  termCount++;
}

/* ---------- renders ---------- */
function phaseStep(phase) {
  const map = { idle: -1, intake: 0, clarify: 0, verify: 1, discover: 2, match: 3, coordinate: 4, review: 5, family: 6, follow: 7, outcome: 8 };
  return map[phase] == null ? -1 : map[phase];
}
function renderStepper() {
  const s = sim.snapshot(), cur = phaseStep(s.phase);
  const done = s.phase === "outcome";
  $("stepper").innerHTML = t().steps.map((x, i) =>
    '<div class="step' + (done || i < cur ? " done" : "") + (i === cur && !done ? " now" : "") + '">' + x + "</div>").join("");
  const now = $("stepper").querySelector(".now");
  if (now) now.scrollIntoView({ inline: "center", block: "nearest" });
}
function renderBanner() {
  const s = sim.snapshot();
  if (s.phase === "idle") { $("caseLine").textContent = t().idle; $("caseSub").textContent = t().bannerIdle; return; }
  $("caseLine").textContent = lastEv ? (lang === "ar" ? lastEv.ar : lastEv.en) : s.phase;
  $("caseSub").textContent = s.outcome ? t().outNames[s.outcome] : t().steps[Math.min(7, phaseStep(s.phase))];
  $("caseDot").style.background = s.outcome === "confirmed" ? "var(--green)" : s.phase === "review" ? "var(--amber)" : "var(--cyan)";
}
function lastEvent() { return null; }
function renderCase() {
  const s = sim.snapshot();
  let h = "<dl class='kv'>";
  h += "<dt>IN</dt><dd>" + t().needLine + "</dd>";
  h += "<dt>φ</dt><dd>" + (s.phase === "idle" ? t().idle : t().steps[Math.min(7, phaseStep(s.phase))]) + "</dd>";
  if (s.outcome) h += "<dt>Σ</dt><dd><span class='pill " + (s.outcome === "confirmed" ? "done" : s.outcome === "awaiting" || s.outcome === "escalated" ? "wait" : "bad") + "'>" + t().outNames[s.outcome] + "</span></dd>";
  if (s.outcomeNote) h += "<dt>✎</dt><dd>" + (lang === "ar" ? "ملاحظة: " : "note: ") + s.outcomeNote + "</dd>";
  h += "</dl>";
  $("caseCard").innerHTML = h;
}
function renderFlow() {
  const s = sim.snapshot();
  let h = "<div style='font-size:.82rem;color:var(--dim)'>" + t().taskQ + "</div><div>";
  if (!s.tasks.length) h += "<span class='pill idle'>—</span>";
  h += s.tasks.map(x => "<span class='pill " + (x.state === "done" ? "done" : x.state === "waiting" || x.state === "needs-info" ? "wait" : x.state === "failed" ? "bad" : "work") + "'>" + x[lang === "ar" ? "ar" : "en"] + ": " + x.state + "</span>").join("");
  h += "</div>";
  if (s.proposed) {
    const r = sim.resources.find(x => x.id === s.proposed);
    h += "<div style='margin-top:6px;font-size:.85rem'>→ " + (lang === "ar" ? r.ar : r.en) +
      " <span class='pill " + (s.outcome === "confirmed" ? "done" : "work") + "'>" + (s.outcome === "confirmed" ? t().referredTag : t().proposedTag) + "</span></div>";
  }
  $("flowCard").innerHTML = h;
  // review card
  const show = s.phase === "review";
  $("reviewCard").hidden = !show;
  if (show) {
    const r = sim.resources.find(x => x.id === s.proposed);
    $("reviewBox").innerHTML = "<div class='decisionBox'><div style='font-size:.88rem'>" +
      (lang === "ar" ? r.ar : r.en) + "</div><div class='btns'>" +
      "<button class='btn green' data-dec='approve'>" + t().bApprove + "</button>" +
      "<button class='btn amber' data-dec='decline'>" + t().bDecline + "</button>" +
      "<button class='btn ghost' data-dec='clarify'>" + t().bClar + "</button></div></div>";
    $("reviewBox").querySelectorAll("[data-dec]").forEach(b =>
      b.addEventListener("click", () => { SFX.click(); stopAuto(); sim.reviewDecision(b.getAttribute("data-dec")); }));
  }
  // exceptions
  $("excCard").hidden = !s.exceptions.length;
  $("excBox").innerHTML = s.exceptions.map(x => "<div><span class='pill wait'>" + (lang === "ar" ? x.ar : x.en) + "</span></div>").join("");
}
function renderAgents() {
  const s = sim.snapshot();
  $("agentList").innerHTML = sim.agents.map((a, i) => {
    const st = s.agents[a.id];
    const cls = st.state === "working" ? "work" : st.state === "waiting" ? "wait" : st.state === "done" ? "done" : "idle";
    return "<div class='agentrow" + (selected && selected.type === "agent" && selected.id === a.id ? " sel" : "") + "' data-ag='" + a.id + "'>" +
      "<span class='swatch' style='background:#" + a.color.toString(16).padStart(6, "0") + "'></span>" +
      "<span class='nm'>" + (lang === "ar" ? a.ar : a.en) + "</span>" +
      "<span class='pill " + cls + "'>" + t().stWords[st.state] + "</span></div>";
  }).join("");
  $("agentList").querySelectorAll(".agentrow").forEach(el =>
    el.addEventListener("click", () => {
      SFX.click();
      const pick = { type: "agent", id: el.getAttribute("data-ag") };
      selected = pick;
      if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.pick(pick);
      else { renderInspector(); renderAgents(); }
    }));
}
function renderRes() {
  const s = sim.snapshot();
  if (!s.searchResults.length) { $("resList").innerHTML = "<div style='color:var(--dim);font-size:.84rem'>" + t().noRes + "</div>"; return; }
  $("resList").innerHTML = s.searchResults.map(sr => {
    const r = sim.resources.find(x => x.id === sr.resId);
    const cls = sr.resId === s.proposed ? "sel" : sr.viable ? "lit" : "dead";
    const tag = sr.resId === s.proposed ? t().proposedTag : sr.viable ? t().viable : t().rejected;
    let h = "<div class='resrow " + cls + "' data-res='" + sr.resId + "'><b>" + (lang === "ar" ? r.ar : r.en) + "</b> " +
      "<span class='pill " + (sr.viable ? "done" : "bad") + "'>" + tag + "</span>";
    sr.criteria.forEach(c => {
      h += "<div class='crit'><span class='" + (c.pass ? "y" : "n") + "'>" + (c.pass ? "✓" : "✗") + "</span><span>" + (lang === "ar" ? c.ar : c.en) + "</span></div>";
    });
    return h + "</div>";
  }).join("");
  $("resList").querySelectorAll(".resrow").forEach(el =>
    el.addEventListener("click", () => {
      SFX.click();
      const pick = { type: "res", id: el.getAttribute("data-res") };
      selected = pick;
      if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.pick(pick);
      else renderInspector();
    }));
}
function controlsFor(s) {
  const B = [];
  const btn = (label, fn, cls) => B.push({ label, fn, cls: cls || "" });
  if (s.phase === "idle") {
    btn(t().start, () => sim.startCase("full"), "primary");
    btn(t().startInc, () => sim.startCase("incomplete"));
  } else if (s.phase === "clarify") btn(t().bComplete, () => sim.completeDetails(), "primary");
  else if (s.phase === "verify") btn(t().bDiscover, () => sim.runDiscovery(), "primary");
  else if (s.phase === "review") {
    btn(t().bApprove, () => sim.reviewDecision("approve"), "primary");
    btn(t().bDecline, () => sim.reviewDecision("decline"), "amber");
    btn(t().bClar, () => sim.reviewDecision("clarify"));
  } else if (s.phase === "match") {
    s.shortlist.forEach(id => {
      const r = sim.resources.find(x => x.id === id);
      btn(t().bPropose + ": " + (lang === "ar" ? r.ar : r.en), () => sim.propose(id), "primary");
    });
    btn(t().bNoFit, () => sim.declareNoFit(), "amber");
  } else if (s.phase === "family") {
    btn(t().bAccept, () => sim.familySay(true), "primary");
    btn(t().bFamDecline, () => sim.familySay(false), "amber");
  } else if (s.phase === "follow") {
    btn(t().bDelivered, () => sim.followup("delivered"), "primary");
    btn(t().bNoAnswer, () => sim.followup("noanswer"));
    btn(t().bSkip, () => sim.followup("skip"), "amber");
  } else if (s.phase === "outcome" && s.outcome === "no-match") {
    btn(t().bRetry, () => sim.retrySearch(), "primary");
    btn(t().bEsc, () => sim.escalate(), "amber");
    btn(t().bRestart, () => restart(), "ghost");
  } else if (s.phase === "outcome") btn(t().bRestart, () => restart(), "primary");
  return B;
}
function renderControls() {
  const s = sim.snapshot();
  const C = $("ctlBar"); C.innerHTML = "";
  controlsFor(s).forEach(b => {
    const el = document.createElement("button");
    el.className = "btn " + b.cls; el.textContent = b.label;
    el.addEventListener("click", () => { SFX.click(); stopAuto(); b.fn(); });
    C.appendChild(el);
  });
  const au = document.createElement("button");
  au.className = "btn ghost"; au.textContent = autoOn ? t().stop : t().auto;
  au.addEventListener("click", () => { SFX.click(); toggleAuto(); });
  C.appendChild(au);
  if (s.phase !== "idle") {
    const rp = document.createElement("button");
    rp.className = "btn ghost"; rp.textContent = t().replay;
    rp.addEventListener("click", () => { SFX.click(); replay(); });
    C.appendChild(rp);
  }
}
function renderInspector() {
  const box = $("sheet");
  if (!selected) { box.hidden = true; return; }
  const s = sim.snapshot();
  let title = "", h = "";
  if (selected.type === "agent") {
    const i = sim.agents.findIndex(a => a.id === selected.id);
    const a = sim.agents[i], st = s.agents[a.id];
    title = (lang === "ar" ? a.ar : a.en);
    h = "<div><span class='pill " + (st.state === "working" ? "work" : st.state === "waiting" ? "wait" : st.state === "done" ? "done" : "idle") + "'>" + t().stWords[st.state] + "</span></div>";
    h += "<dl class='kv'><dt>" + t().inspRole + "</dt><dd>" + t().agentPurpose[i] + "</dd>";
    h += "<dt>" + t().inspTask + "</dt><dd>" + (lang === "ar" ? st.taskAr : st.taskEn) + "</dd>";
    h += "<dt>" + t().inspIn + "</dt><dd>" + t().agentIn[i] + "</dd></dl>";
  } else if (selected.type === "res") {
    const r = sim.resources.find(x => x.id === selected.id);
    title = (lang === "ar" ? r.ar : r.en);
    const sr = s.searchResults.find(x => x.resId === r.id);
    h = "<dl class='kv'><dt>km</dt><dd>" + r.attrs.distKm + "</dd><dt>lang</dt><dd>" + r.attrs.lang +
      "</dd><dt>slots</dt><dd>" + r.attrs.slots + "</dd><dt>days</dt><dd>" + r.attrs.days + "</dd></dl>";
    if (sr) h += sr.criteria.map(c => "<div class='crit'><span class='" + (c.pass ? "y" : "n") + "'>" + (c.pass ? "✓" : "✗") + "</span><span>" + (lang === "ar" ? c.ar : c.en) + "</span></div>").join("");
    else h += "<div style='color:var(--dim)'>" + t().noRes + "</div>";
  } else {
    title = lang === "ar" ? "بوابة الإشراف البشري" : "Human Oversight Gateway";
    h = "<div style='font-size:.88rem'>" + (s.phase === "review" ? t().cReviewSub : t().agentPurpose[5]) + "</div>";
  }
  $("sheetTitle").textContent = title;
  $("sheetBody").innerHTML = h;
  box.hidden = false;
}
function renderAll() {
  if (!sim) return;
  renderStepper(); renderBanner(); renderCase(); renderFlow();
  renderAgents(); renderRes(); renderControls(); renderInspector();
}
function renderDynamic() {
  renderStepper(); renderBanner(); renderCase(); renderFlow();
  renderAgents(); renderRes(); renderControls();
}

/* ---------- flow control ---------- */
function restart() { stopAuto(); selected = null; $("term").innerHTML = ""; newSim(SEED); }
function replay() { stopAuto(); selected = null; $("term").innerHTML = ""; newSim(SEED); autoStep(); }
function autoStep() {
  const s = sim.snapshot();
  const order = ["idle", "clarify", "verify", "match", "review", "family", "follow"];
  if (order.includes(s.phase)) {
    if (s.phase === "review") sim.reviewDecision("approve");
    else if (s.phase === "family") sim.familySay(true);
    else if (s.phase === "follow") sim.followup("delivered");
    else if (s.phase === "idle") sim.startCase("full");
    else if (s.phase === "clarify") sim.completeDetails();
    else if (s.phase === "verify") sim.runDiscovery();
    else if (s.phase === "match") {
      if (s.shortlist.length) sim.propose(s.shortlist[0]); else sim.declareNoFit();
    }
  } else stopAuto();
}
function toggleAuto() {
  autoOn = !autoOn;
  clearInterval(autoTimer);
  if (autoOn) { autoTimer = setInterval(() => { if (!document.hidden) autoStep(); }, 3400); }
  renderControls();
}
function stopAuto() { if (!autoOn) return; autoOn = false; clearInterval(autoTimer); renderControls(); }

/* ---------- tabs ---------- */
function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  t().tabs.forEach((label, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", (i === 0 ? "true" : "false"));
    b.textContent = label;
    b.addEventListener("click", () => {
      SFX.click();
      tabs.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", "false"));
      b.setAttribute("aria-selected", "true");
      const keys = ["case", "agents", "events"];
      document.querySelectorAll(".panel").forEach(p =>
        p.classList.toggle("show", p.getAttribute("data-panel") === keys[i]));
    });
    tabs.appendChild(b);
  });
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("show", p.getAttribute("data-panel") === "case"));
}

/* ---------- lang ---------- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  $("langBtn").textContent = l === "ar" ? "EN" : "عربي";
  $("sndBtn").textContent = soundOn ? "🔊" : "🔇";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t()[el.getAttribute("data-i18n")]; });
  const q = $("qualitySel");
  q.innerHTML = t().quality.map((x, i) => "<option value='" + ["auto", "low", "med", "high"][i] + "'>" + x + "</option>").join("");
  q.value = window.HEAVEN_SC ? window.HEAVEN_SC.quality : "auto";
  $("calmBtn").textContent = document.body.classList.contains("calm") ? t().calmOn : t().calm;
  renderTabs(); renderAll();
  if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.setLang(l);
}

/* ---------- boot ---------- */
function boot() {
  if (typeof createSim === "undefined") { setTimeout(boot, 100); return; }
  if (!window.HEAVEN_SC) { setTimeout(boot, 100); return; }
  $("langBtn").addEventListener("click", () => { SFX.click(); setLang(lang === "ar" ? "en" : "ar"); });
  $("sndBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    $("sndBtn").textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) { audioInit(); SFX.click(); }
  });
  $("pauseBtn").addEventListener("click", () => {
    if (!(window.HEAVEN_SC && window.HEAVEN_SC.ok)) return;
    const sc = window.HEAVEN_SC;
    sc.setPaused(!sc.paused);
    $("pauseBtn").textContent = sc.paused ? t().resume : t().pause;
  });
  $("calmBtn").addEventListener("click", () => {
    const on = !document.body.classList.contains("calm");
    document.body.classList.toggle("calm", on);
    $("calmBtn").textContent = on ? t().calmOn : t().calm;
    $("calmBtn").setAttribute("aria-pressed", on ? "true" : "false");
    if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.setCalm(on);
    SFX.tick();
  });
  $("qualitySel").addEventListener("change", ev => {
    if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.setQuality(ev.target.value);
    SFX.click();
  });
  $("sheetX").addEventListener("click", () => {
    selected = null; renderInspector(); renderAgents();
    if (window.HEAVEN_SC && window.HEAVEN_SC.ok) window.HEAVEN_SC.pick(null);
  });
  setLang("ar");
  newSim(SEED);
}
if (document.readyState !== "loading") boot();
else document.addEventListener("DOMContentLoaded", boot);

</script>
