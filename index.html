<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="HEAVEN — شاهد كيف تتحول حاجة إلى إمكانية منسقة للمساعدة. Watch a need become a coordinated possibility for help.">
<title>HEAVEN — Build the Place We Wish Existed</title>
<style>
:root{
  --bg:#02040a; --navy:#0b1026; --ink:#eef1ff; --dim:#8f9bb8;
  --cyan:#7fd4e8; --blue:#3f8cff; --orange:#ff9a3c; --gold:#f5c86e;
  --line:rgba(127,212,232,.16); --card:rgba(13,20,44,.72);
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  min-height:100vh; line-height:1.75; overflow-x:hidden; font-size:16.5px;}
html{scroll-behavior:smooth;}
:focus-visible{outline:2px solid var(--cyan); outline-offset:3px; border-radius:6px;}
[hidden]{display:none !important;}
a{color:var(--cyan);}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:10px 16px; background:rgba(2,4,10,.82); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;}
.sitelogo{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink);
  font-weight:800; letter-spacing:.14em; font-size:.85rem;}
.sitelogo img{width:30px; height:auto;}
.sitelogo small{color:var(--dim); font-weight:400; letter-spacing:0;}
.sitenav{display:flex; gap:14px; flex-wrap:wrap; margin-inline-start:auto;}
.sitenav a{color:var(--dim); text-decoration:none; font-size:.86rem;}
.langbtn{background:transparent; border:1px solid var(--line); color:var(--ink);
  border-radius:999px; padding:8px 18px; font-size:.92rem; cursor:pointer; min-height:44px;}
.hero{position:relative; min-height:92vh; display:flex; flex-direction:column; overflow:hidden;}
.stageBox{position:absolute; inset:0;}
@media (max-width:559px){
  .hero{min-height:0;}
  .stageBox{position:relative; inset:auto; height:56vh; flex:none;}
  /* one focal point at a time: only the active stage tag shows */
  .stageTag{display:none;}
  .stageTag.on{display:block; font-size:.8rem; padding:5px 14px;}
  /* progressive disclosure: calm single column, resting idle steps */
  .steps6{grid-template-columns:1fr; gap:12px;}
  .step{padding:15px 16px; font-size:.9rem;}
  .step:not(.on){opacity:.7;}
  /* spacious touch controls: full-width stacked buttons */
  .controls .btn{flex:1 1 100%; min-height:52px; font-size:.92rem;}
  .heroCtas .btn{flex:1 1 100%;}
  .metrics{gap:10px;}
  .metric{flex:1 1 28%; padding:10px 8px;}
  .metric b{font-size:1.3rem;}
  .card{padding:22px 18px;}
  .stream{font-size:.86rem;}
}
#gl{position:absolute; inset:0; width:100%; height:100%; display:block;}
#glFallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
#glFallback img{width:150px; opacity:.9;}
.stageLayer{position:absolute; inset:0; pointer-events:none; z-index:6;}
.stageTag{position:absolute; transform:translate(-50%,-50%); text-align:center; font-size:.68rem;
  letter-spacing:.12em; color:var(--dim); white-space:nowrap; transition:color .6s;
  background:rgba(2,4,10,.62); border:1px solid var(--line); border-radius:999px; padding:3px 10px;}
.stageTag b{display:block; font-size:.72rem; color:var(--ink);}
.stageTag.on{color:var(--cyan);}
.stageTag.on b{color:#fff; text-shadow:0 0 12px var(--cyan);}
.heroInner{position:relative; z-index:5; max-width:720px; margin:0 auto; width:100%;
  padding:22px 18px 30px; text-align:center; margin-top:auto;}
.kicker{font-size:.75rem; letter-spacing:.3em; color:var(--cyan);}
.heroInner h1{font-size:clamp(1.35rem,5.4vw,2.6rem); line-height:1.35; margin:.35em 0 .15em; font-weight:800;}
.heroInner h1 .slogan{color:var(--gold);}
.heroInner .lede{color:var(--dim); font-size:.98rem; margin:.4em 0 1em;}
.simChip{display:inline-block; font-size:.72rem; letter-spacing:.2em; color:var(--orange);
  border:1px solid rgba(255,154,60,.4); border-radius:999px; padding:4px 14px; margin-bottom:8px;}
.heroCtas{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
.heroCtas .btn{flex:1 1 40%; white-space:nowrap;}
.btn{display:inline-block; padding:12px 22px; border-radius:12px; border:1px solid var(--line);
  background:rgba(20,30,60,.6); color:var(--ink); font-size:.95rem; cursor:pointer;
  min-height:48px; text-decoration:none;
  transition:transform .25s ease, box-shadow .3s ease, background .3s ease, border-color .3s ease;}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(135deg,var(--blue),#22b8d4); border:0; font-weight:700;}
.btn.warn{border-color:rgba(255,154,60,.5); color:var(--orange);}
.btn.ghost{background:transparent;}
.metrics{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0 4px;}
.metric{background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:6px 12px; font-size:.72rem; color:var(--dim); letter-spacing:.06em;}
.metric b{display:block; font-size:1.05rem; color:#fff;}
.stream{max-width:560px; margin:10px auto 0; min-height:60px; font-size:.84rem; color:var(--dim); text-align:start;}
.stream div{padding:4px 0; border-inline-start:2px solid var(--line); padding-inline-start:12px; margin:6px 0; animation:breatheIn 1.4s ease both;}
@keyframes breatheIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.stream div.fresh{border-color:var(--cyan); color:var(--ink);}
.panel{position:relative; z-index:5; max-width:620px; margin:0 auto; width:100%; padding:0 20px 34px; scroll-margin-top:72px;}
#orchBar{overflow-x:auto; white-space:nowrap; padding-bottom:8px; -webkit-overflow-scrolling:touch;}
#orchBar .tag{margin-bottom:4px;}
body.calm .stageTag{display:none;}
body.calm .stageTag.on{display:block;}
@media (min-width:760px){ .panel{max-width:720px;} }
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
.card h2{margin:.1em 0 .4em; font-size:1.25rem;}
.card h2 .sub{display:block; font-size:.85rem; color:var(--dim); font-weight:400;}
.steps6{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0;}
.step{background:rgba(8,14,32,.7); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:.8rem;}
.step b{display:block; color:var(--cyan); font-size:.72rem; letter-spacing:.1em;}
.step.on{border-color:var(--cyan); box-shadow:0 0 18px rgba(127,212,232,.25);}
.scenario{min-height:120px;}
.scenario .q{font-size:.95rem; margin:.4em 0;}
.resGrid{display:grid; gap:8px; margin:10px 0;}
.res{border:1px solid var(--line); border-radius:10px; padding:10px; font-size:.85rem; text-align:start;}
.res b{color:var(--gold);}
.res.fit{border-color:var(--cyan);}
.res.dim{opacity:.75;}
.tag{display:inline-block; font-size:.68rem; letter-spacing:.1em; border:1px solid var(--line);
  border-radius:999px; padding:2px 10px; color:var(--dim); margin-inline-end:6px;}
.tag.hot{border-color:var(--orange); color:var(--orange);}
.tag.ok{border-color:#4ade80; color:#4ade80;}
.tag.info{border-color:var(--cyan); color:var(--cyan);}
.controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.controls .btn{min-height:44px; padding:9px 16px; font-size:.85rem;}
details.info{border:1px solid var(--line); border-radius:10px; margin:8px 0; background:rgba(8,14,32,.55);}
details.info summary{cursor:pointer; padding:12px 14px; font-weight:700; min-height:48px;}
details.info .body{padding:0 14px 14px; color:var(--dim); font-size:.9rem;}
footer{border-top:1px solid var(--line); padding:22px 18px 40px; text-align:center; color:var(--dim); font-size:.82rem;}
footer nav{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;}
@media (min-width:760px){ .steps6{grid-template-columns:repeat(3,1fr);} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} html{scroll-behavior:auto;} }
</style>
</head>
<body>
<header class="topbar">
  <a class="sitelogo" href="index.html"><img src="assets/heaven-mark-transparent.png" alt="HEAVEN"><span>HEAVEN <small data-i18n="logoSub"></small></span></a>
  <nav class="sitenav">
    <a href="#simulation" data-i18n="navSim"></a>

  <div class="stageBox">

</div>

</div>

<div class="panel" id="act">
  <div class="card" style="text-align:center">

</footer>

<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
const canvas = document.getElementById("gl");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function webglOK() {
  try {
    const c = document.createElement("canvas");
    return !!(c.getContext("webgl2") || c.getContext("webgl"));
  } catch (e) { return false; }
}
const api = { ok: false, paused: false, focus: -1, stage: 0, togglePause() {}, setFocus() {}, setPaused() {} };
window.HEAVEN3D = api;
if (!webglOK()) {
  canvas.hidden = true;
  document.getElementById("glFallback").hidden = false;
} else {
  api.ok = true;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  const DPR = Math.min(devicePixelRatio || 1, innerWidth < 560 ? 1.25 : 1.75);
  renderer.setPixelRatio(DPR);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 50);
  camera.position.set(0, 0.15, 3.7);
  // ---- morph geometry: one topology, three forms ----
  const NU = 150, NV = 96;
  const count = (NU + 1) * (NV + 1);
  const pS = new Float32Array(count * 3), pC = new Float32Array(count * 3), pT = new Float32Array(count * 3);
  const uv = new Float32Array(count * 2);
  const sgn = v => v < 0 ? -1 : 1;
  const EXP = 2 / 4.6, A = 1.04, R = 0.8, RR = 0.35;
  let p = 0, q = 0;
  for (let iv = 0; iv <= NV; iv++) for (let iu = 0; iu <= NU; iu++) {
    const u = iu / NU * Math.PI * 2, v = iv / NV * Math.PI;
    const sx = Math.sin(v) * Math.cos(u), sy = Math.sin(v) * Math.sin(u), sz = Math.cos(v);
    pS[p] = sx; pS[p + 1] = sy; pS[p + 2] = sz;
    pC[p] = A * sgn(sx) * Math.pow(Math.abs(sx), EXP);
    pC[p + 1] = A * sgn(sy) * Math.pow(Math.abs(sy), EXP);
    pC[p + 2] = A * sgn(sz) * Math.pow(Math.abs(sz), EXP);
    const u2 = iu / NU * Math.PI * 2, v2 = iv / NV * Math.PI * 2;
    pT[p] = (R + RR * Math.cos(v2)) * Math.cos(u2);
    pT[p + 1] = (R + RR * Math.cos(v2)) * Math.sin(u2);
    pT[p + 2] = RR * Math.sin(v2);
    uv[q] = iu / NU * 3; uv[q + 1] = iv / NV;
    p += 3; q += 2;
  }
  const idx = [];
  for (let iv = 0; iv < NV; iv++) for (let iu = 0; iu < NU; iu++) {
    const a = iv * (NU + 1) + iu, b = a + 1, c = a + NU + 1, e = c + 1;
    idx.push(a, c, b, b, c, e);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pS.slice(), 3));
  geo.setAttribute("aCube", new THREE.BufferAttribute(pC, 3));
  geo.setAttribute("aTorus", new THREE.BufferAttribute(pT, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const VERT = `
    attribute vec3 aCube; attribute vec3 aTorus;
    uniform float wA; uniform float wB; uniform float wC; uniform float uTime;
    varying vec2 vUv; varying float vBand;
    void main(){
      vUv = uv;
      vec3 pos = position * wA + aCube * wB + aTorus * wC;
      vBand = 0.5 + 0.5 * sin(uv.y * 46.0 - uTime * 0.45 + uv.x * 4.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`;
  // ---- typographic surface texture ----
  function makeTextTexture() {
    const c = document.createElement("canvas"); c.width = 2048; c.height = 1024;
    const x = c.getContext("2d");
    const en = ["NEED IDENTIFIED", "RESOURCE DISCOVERED", "POTENTIAL MATCH", "HUMAN REVIEW REQUIRED",
      "REFERRAL INITIATED", "FOLLOW-UP PENDING", "OUTCOME NOT YET CONFIRMED", "PRIVACY PROTECTED",
      "STRUCTURED REQUEST", "AVAILABILITY CHECK", "LOCATION MATCH", "AWAITING RESPONSE"];
    const ar = ["تم رصد حاجة", "تم اكتشاف مورد", "تطابق محتمل", "مراجعة بشرية مطلوبة",
      "بدأت الإحالة", "متابعة معلقة", "النتيجة غير مؤكدة بعد", "الخصوصية محمية"];
    let seed = 7;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let i = 0; i < 120; i++) {
      const useAr = rnd() < 0.35;
      const word = useAr ? ar[(rnd() * ar.length) | 0] : en[(rnd() * en.length) | 0];
      const big = rnd() < 0.14;
      x.font = (big ? "700 " : "400 ") + ((big ? 26 + rnd() * 18 : 13 + rnd() * 12) | 0) + 'px sans-serif';
      const px = rnd() * 2048, py = rnd() * 1024;
      x.save(); x.translate(px, py); x.rotate((rnd() - 0.5) * 0.5);
      const col = rnd();
      x.fillStyle = col < 0.35 ? "rgba(255,255,255," + (big ? 0.6 : 0.25) + ")"
        : col < 0.8 ? "rgba(127,212,232," + (big ? 0.6 : 0.24) + ")"
        : "rgba(245,200,110," + (big ? 0.55 : 0.22) + ")";
      x.fillText(word, 0, 0); x.restore();
    }
    for (let i = 0; i < 900; i++) {
      x.fillStyle = "rgba(160,190,230," + (0.1 + rnd() * 0.25) + ")";
      x.fillRect(rnd() * 2048, rnd() * 1024, 1 + rnd() * 8, 1);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
    return t;
  }
  const uniforms = {
    wA: { value: 1 }, wB: { value: 0 }, wC: { value: 0 },
    uTime: { value: 0 }, uTex: { value: makeTextTexture() },
    uHi: { value: new THREE.Color(0x3f8cff) }, uOp: { value: 0.66 }
  };
  const surf = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms, vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D uTex; uniform float uTime; uniform vec3 uHi; uniform float uOp;
      varying vec2 vUv; varying float vBand;
      void main(){
        vec2 tuv = vec2(vUv.x + uTime * 0.005, vUv.y);
        vec4 tx = texture2D(uTex, tuv);
        vec3 glass = vec3(0.06, 0.125, 0.30);
        vec3 col = tx.rgb * (0.3 + 0.5 * vBand) + uHi * 0.10 + glass;
        float a = uOp * clamp(tx.a * 0.85 + 0.30, 0.0, 1.0);
        gl_FragColor = vec4(col, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide
  }));
  const wire = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms, vertexShader: VERT,
    fragmentShader: `uniform vec3 uHi; void main(){ gl_FragColor = vec4(uHi * 0.5, 0.05); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, wireframe: true
  }));
  const shell = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms, vertexShader: VERT.replace("gl_Position",
      "vec3 pp = pos * 1.025; gl_PointSize = 2.2; gl_Position"),
    fragmentShader: `void main(){ vec2 c = gl_PointCoord - 0.5; if (dot(c,c) > 0.25) discard; gl_FragColor = vec4(0.6,0.85,1.0,0.22); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  // fix shell vertex: recompute with offset (VERT replace above is fragile) -> use dedicated shader
  shell.material.vertexShader = `
    attribute vec3 aCube; attribute vec3 aTorus;
    uniform float wA; uniform float wB; uniform float wC; uniform float uTime;
    void main(){
      vec3 pos = (position * wA + aCube * wB + aTorus * wC) * 1.025;
      gl_PointSize = 1.7;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`;
  shell.material.needsUpdate = true;
  const core = new THREE.Group();
  core.add(surf, wire);
  core.rotation.x = 0.25;
  core.scale.setScalar(0.62);
  scene.add(core);
  // glow sprite
  function glowTex() {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, "rgba(90,140,255,0.55)"); g.addColorStop(0.5, "rgba(60,90,200,0.18)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.28 }));
  glow.scale.set(2.0, 2.0, 1);
  scene.add(glow);
  // ---- six stage nodes ----
  const NODES = [];
  for (let i = 0; i < 6; i++) {
    const a = (-90 + i * 60) * Math.PI / 180;
    NODES.push(new THREE.Vector3(Math.cos(a) * 2.45, Math.sin(a) * 1.55, -0.4));
  }
  const nodeGeo = new THREE.BufferGeometry().setFromPoints(NODES);
  const NODE_COL = [0x7fd4e8, 0xb48cff, 0x3f8cff, 0xf5c86e, 0xff9a3c, 0x4ade80];
  nodeGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(NODE_COL.flatMap(h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255])), 3));
  const nodePts = new THREE.Points(nodeGeo, new THREE.PointsMaterial({ size: 7, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.85 }));
  scene.add(nodePts);
  const lineGeo = new THREE.BufferGeometry();
  const lp = new Float32Array(6 * 2 * 3);
  for (let i = 0; i < 6; i++) { lp.set([0, 0, 0], i * 6); lp.set(NODES[i].toArray(), i * 6 + 3); }
  lineGeo.setAttribute("position", new THREE.BufferAttribute(lp, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x2a6cb8, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false });
  scene.add(new THREE.LineSegments(lineGeo, lineMat));
  // streams: center -> nodes

const STEP_ORD = { intro: 0, clarify: 1, structured: 2, resources: 3, compare: 4, review: 5, decision: 6, followup: 7, outFull: 8, outOpen: 8, outSkip: 8, outDeclined: 8, outNoMatch: 8 };
function orchTasks() {
  const o = STEP_ORD[sc.step], t = T[lang].orchStates;
  const st = runAt => o < runAt ? "queued" : o === runAt ? "running" : "done";
  const tasks = [
    [0, 2, "structure"], [1, 4, "verify"], [3, 4, "discover"],
    [5, 7, "route"], [5, 7, "human"], [7, 8, "follow"]
  ];
  const names = ["structure", "verify", "discover", "route", "human", "follow"];
  return tasks.map((tk, i) => {
    let s = o < tk[0] ? "queued" : o <= tk[1] ? (i === 4 && o >= tk[0] && o <= tk[1] ? "waiting" : "running") : "done";
    if (sc.step === "clarify" && i === 0) s = "needsinfo";
    if (sc.step === "outNoMatch" && i === 2) s = "failed";
    if (sc.step === "outNoMatch" && i > 2) s = "queued";
    if ((sc.step === "outSkip" || sc.step === "outDeclined") && i === 5) s = "closed";
    if (sc.step === "outOpen" && i === 5) s = "waiting";
    return [names[i], s];
  }).map(x => "<span class='tag " + (x[1] === "running" ? "info" : x[1] === "waiting" || x[1] === "failed" || x[1] === "needsinfo" ? "hot" : x[1] === "done" ? "ok" : "") + "'>" + x[0] + ": " + t[x[1]] + "</span>").join(" ");
}
function renderOrch() {
  $("orchBar").innerHTML = "<div class='small' style='margin-bottom:4px'>" + T[lang].orchTitle + "</div><div>" + orchTasks() + "</div>";
}
function focus(i) { if (window.HEAVEN3D && window.HEAVEN3D.ok) window.HEAVEN3D.setFocus(i); }
function resetScenario() { sc.step = "intro"; sc.logged = {}; focus(-1); renderScenario(); }
function autoStep() {
  const order = { intro: 0, clarify: 0, structured: 0, resources: 0, compare: 0, review: 0, decision: 0, followup: 0, outNoMatch: 0 };
  const btns = [...$("scControls").querySelectorAll("button")];
  const primary = btns.find(b => b.classList.contains("primary")) || btns[0];
  if (primary && sc.step in order) primary.click();
  else stopAuto();
}
function toggleAuto() {
  sc.auto = !sc.auto;
  clearInterval(sc.timer);
  if (sc.auto) { sc.timer = setInterval(() => { if (!document.hidden) autoStep(); }, 3600); renderScenario(); }
}
function stopAuto() {
  if (!sc.auto) return;
  sc.auto = false; clearInterval(sc.timer); renderScenario();
}
function setLang(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  $("langBtn").textContent = l === "ar" ? "EN" : "عربي";
  $("sndBtn").textContent = soundOn ? "🔊" : "🔇";
  $("sndBtn").setAttribute("aria-label", t[soundOn ? "sndOn" : "sndOff"]);
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.getAttribute("data-i18n")]; });
  syncCalmBtn();
  renderMetrics();
  const cn = document.createElement("div");
  cn.style.cssText = "width:100%;text-align:center;font-size:.72rem;color:var(--dim);";
  cn.textContent = t.countersNote;
  $("metrics").appendChild(cn);
  for (let i = 0; i < 6; i++) setTag(i);
  renderSteps(lastStage < 0 ? 0 : lastStage);
  $("infoList").innerHTML = t.info.map(x =>
    "<details class='info'><summary>" + x[0] + "</summary><div class='body'>" + x[1] + "</div></details>").join("");
  renderScenario();
  if (window.HEAVEN3D && window.HEAVEN3D.ok) {
    $("pauseBtn").hidden = false;
  } else { $("pauseBtn").hidden = true; }
}
$("langBtn").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
$("sndBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sndBtn").textContent = soundOn ? "🔊" : "🔇";
  $("sndBtn").setAttribute("aria-label", T[lang][soundOn ? "sndOn" : "sndOff"]);
  if (soundOn) { audioInit(); SFX.click(); }
});
function syncCalmBtn() {
  const calm = document.body.classList.contains("calm");
  $("calmBtn").textContent = calm ? T[lang].ctaCalmOn : T[lang].ctaCalm;
  $("calmBtn").setAttribute("aria-pressed", calm ? "true" : "false");
}
$("calmBtn").addEventListener("click", () => {
  document.body.classList.toggle("calm");
  syncCalmBtn(); SFX.tick();
});
$("pauseBtn").addEventListener("click", () => {
  if (!(window.HEAVEN3D && window.HEAVEN3D.ok)) return;
  const p = window.HEAVEN3D.togglePause();
  $("pauseBtn").textContent = p ? T[lang].ctaResume : T[lang].ctaPause;
});
$("watchBtn").addEventListener("click", () => {
  document.getElementById("simulation").scrollIntoView({ behavior: "smooth" });
  if (!sc.auto) toggleAuto();
});
setLang("ar");


</script>
</body>
