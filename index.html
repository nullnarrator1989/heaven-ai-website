<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="HEAVEN — لنبنِ المكان الذي تمنّينا وجوده. Build the Place We Wish Existed.">
<title>HEAVEN — لنبنِ المكان الذي تمنّينا وجوده | Build the Place We Wish Existed</title>
<style>
:root{
  --night:#0b1026; --night2:#141b3d; --gold:#f5c86e; --gold2:#ffe3a3;
  --cyan:#7fd4e8; --ink:#eef1ff; --dim:#9aa3c7; --card:#1a2247; --line:#2c3763;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:radial-gradient(120% 90% at 50% 0%, #1b2450 0%, var(--night) 60%, #05070f 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  min-height:100vh; line-height:1.7;
}
[hidden]{display:none !important;}
.wrap{max-width:680px; margin:0 auto; padding:18px 16px 60px;}
.topbar{position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 4px; margin-bottom:10px; flex-wrap:wrap;
  background:linear-gradient(180deg, rgba(11,16,38,.96), rgba(11,16,38,.82));}
.sitelogo{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--gold);
  font-weight:800; letter-spacing:.12em; font-size:.85rem;}
.sitelogo img{width:32px; height:auto;}
.sitenav{display:flex; gap:12px; flex-wrap:wrap;}
.sitenav a{color:var(--ink); font-size:.85rem; text-decoration:none;}
.sitenav a:active{text-decoration:underline;}
.langbtn{background:transparent; border:1px solid var(--line); color:var(--ink);
  border-radius:999px; padding:8px 16px; font-size:.95rem; cursor:pointer; min-height:44px;}
.hero{text-align:center; padding:26px 0 10px;}
.hero img{width:120px; height:auto; display:block; margin:0 auto;}
.hero h1{font-size:2rem; letter-spacing:.28em; margin:.4em 0 .1em; text-indent:.28em;}
.hero .slogan{color:var(--gold2); font-size:1.25rem; font-weight:700; margin:.2em 0;}
.hero .lede{color:var(--dim); margin:.6em 0 1em;}
.cta{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
.btn{display:block; width:100%; margin:0; padding:13px 14px; border-radius:12px;
  border:1px solid var(--line); background:#232c5c; color:var(--ink);
  font-size:1rem; line-height:1.6; cursor:pointer; min-height:48px; text-align:center; text-decoration:none;}
.btn small{display:block; font-size:.82rem; color:var(--dim);}
.btn.primary{background:var(--gold); border-color:var(--gold); color:#241a05; font-weight:700;}
.btn.primary small{color:#5a4a1c;}
.btn.ghost{background:transparent;}
.btn .ar{display:block; font-size:.92em;}
.card{background:linear-gradient(180deg,var(--card),#151b3a); border:1px solid var(--line);
  border-radius:var(--radius); padding:18px 16px; margin:14px 0;}
.card h2{margin:.1em 0 .4em; font-size:1.3rem;}
.card h2 .ar{display:block; font-size:1.02rem; color:var(--gold2);}
.small{font-size:.85rem; color:var(--dim);}
.notice{border:1px dashed var(--gold); border-radius:var(--radius); padding:12px 14px; margin:12px 0; font-size:.9rem;}
.notice strong{color:var(--gold2);}
.council{display:flex; gap:10px; margin:12px 0;}
.councilor{flex:1; text-align:center; background:#141a3c; border:1px solid var(--line);
  border-radius:12px; padding:10px 6px;}
.councilor img{width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--gold);}
.councilor strong{display:block; margin-top:6px; font-size:.9rem;}
.councilor span{font-size:.75rem; color:var(--dim); display:block; line-height:1.5;}
ol.steps{margin:.5em 0; padding-inline-start:1.3em;}
ol.steps li{margin-bottom:8px;}
.paths{display:flex; flex-direction:column; gap:10px;}
.path{background:#141a3c; border:1px solid var(--line); border-radius:12px; padding:12px;}
.path h3{margin:0 0 4px; color:var(--gold2); font-size:1.05rem;}
footer{margin-top:26px; text-align:center;}
footer a{color:var(--gold2);}
.dawn{text-align:center; padding:20px 0 6px;}
.dawn a{display:inline-block; margin:8px 6px; padding:14px 26px; border-radius:12px;
  background:var(--gold); color:#241a05; font-weight:800; text-decoration:none; min-height:48px;}
.dawn a .ar{display:block; font-size:.85em; font-weight:600;}
.dawn a.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:600;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important;}
}
@media (min-width:560px){ .hero h1{font-size:2.4rem;} .wrap{padding-top:22px;} .cta{flex-direction:row;} .paths{flex-direction:row;} .path{flex:1;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="sitelogo" href="index.html"><img src="assets/heaven-mark-transparent.png" alt="HEAVEN"><span>HEAVEN</span></a>
    <nav class="sitenav">
      <a href="#experience" data-i18n="navExp"></a>
      <a href="#about" data-i18n="navAbout"></a>
      <a href="#how" data-i18n="navHow"></a>
      <a href="#involved" data-i18n="navJoin"></a>
    </nav>
    <button class="langbtn" id="langBtn" aria-label="Language / اللغة">EN</button>
  </div>

  <section class="hero">
    <img src="assets/heaven-mark-transparent.png" alt="HEAVEN" id="heroMark">
    <h1>HEAVEN</h1>
    <div class="slogan" data-i18n="slogan"></div>
    <p class="lede" data-i18n="heroLede"></p>
    <div class="cta">
      <a class="btn primary" href="threads-of-light.html" data-i18n-html="ctaPlay"></a>
      <a class="btn ghost" href="#about" data-i18n-html="ctaLearn"></a>
      <a class="btn ghost" href="https://perchance.org/heaven-ai" data-i18n-html="ctaOpen"></a>
    </div>
  </section>

  <section class="card" id="experience">
    <h2 data-i18n-html="expH"></h2>
    <p data-i18n="expP"></p>
    <div class="council">
      <div class="councilor">
        <img src="assets/noor.png" alt="" id="imgNoor">
        <strong data-i18n="noorN"></strong>
        <span data-i18n="noorQ"></span>
      </div>
      <div class="councilor">
        <img src="assets/idris.png" alt="" id="imgIdris">
        <strong data-i18n="idrisN"></strong>
        <span data-i18n="idrisQ"></span>
      </div>
      <div class="councilor">
        <img src="assets/salim.png" alt="" id="imgSalim">
        <strong data-i18n="salimN"></strong>
        <span data-i18n="salimQ"></span>
      </div>
    </div>
    <div class="notice" data-i18n-html="expFire"></div>
    <a class="btn primary" href="threads-of-light.html" data-i18n-html="ctaPlay"></a>
  </section>

  <section class="card" id="about">
    <h2 data-i18n-html="aboutH"></h2>
    <p data-i18n="aboutP"></p>
  </section>

  <section class="card" id="mission">
    <h2 data-i18n-html="misH"></h2>
    <p data-i18n-html="misP"></p>
    <p data-i18n-html="visP"></p>
  </section>

  <section class="card" id="how">
    <h2 data-i18n-html="howH"></h2>
    <ol class="steps" id="howSteps"></ol>
    <div class="notice" data-i18n-html="howSafe"></div>
  </section>

  <section class="card" id="involved">
    <h2 data-i18n-html="joinH"></h2>
    <div class="paths">
      <div class="path"><h3 data-i18n="joinNeedH"></h3><p class="small" data-i18n="joinNeedP"></p></div>
      <div class="path"><h3 data-i18n="joinGiveH"></h3><p class="small" data-i18n="joinGiveP"></p></div>
      <div class="path"><h3 data-i18n="joinFirstH"></h3><p class="small" data-i18n="joinFirstP"></p></div>
    </div>
    <div class="cta">
      <a class="btn primary" href="https://perchance.org/heaven-ai" data-i18n-html="ctaOpen"></a>
      <a class="btn ghost" href="threads-of-light.html" data-i18n-html="ctaPlay"></a>
    </div>
  </section>

  <section class="dawn" id="openapp">
    <h2 data-i18n-html="dawnH"></h2>
    <p class="small" data-i18n="dawnP"></p>
    <a href="https://perchance.org/heaven-ai"><span data-i18n="dawnGo"></span><span class="ar" data-i18n="dawnGoAr"></span></a>
  </section>

  <footer class="small">
    <div data-i18n-html="footLinks"></div>
    <div style="margin-top:8px" data-i18n="footNote"></div>
  </footer>
</div>
<script>
"use strict";
const T = {
ar:{
  slogan:"لنبنِ المكان الذي تمنّينا وجوده",
  navExp:"التجربة", navAbout:"عن HEAVEN", navHow:"كيف تعمل", navJoin:"شارك",
  heroLede:"مشروع تنسيق إنساني في مرحلة مبكرة، يهدف إلى تقريب المساعدة ممن يحتاجها — دون ضجيج ودون وعود زائفة. ابدأ من القصة، أو تعرّف على المشروع، أو انتقل مباشرة إلى المنصة.",
  ctaPlay:"العب خيوط النور", ctaLearn:"تعرّف على HEAVEN", ctaOpen:"افتح منصة HEAVEN",
  expH:"خيوط النور",
  expP:"تجربتنا التفاعلية المميزة: حيٌّ خيالي، ثلاث ليالٍ، وجيران يحتاجون من يُصغي ويختار بعناية. ثلاثة مرشدين خياليين يرافقونك — كلٌّ بطريقة تفكير مختلفة.",
  noorN:"نور · المستمعة", noorQ:"من قد يتألم، وماذا يحتاج؟",
  idrisN:"إدريس · الاستراتيجي", idrisQ:"كيف نصل الموارد المتاحة؟",
  salimN:"سالم · الشكاك", salimQ:"ما الذي قد يسوء، ومن قد نغفل عنه؟",
  expFire:"<strong>كل من في اللعبة خيالي.</strong> شخصيات اللعبة وطلباتها خيالية ولا تمثل طلبات مساعدة حقيقية. لا حسابات ولا نقاط ولا بيانات تغادر جهازك.",
  aboutH:"عن HEAVEN",
  aboutP:"HEAVEN مشروع في مرحلة مبكرة يعالج مشكلة تنسيق لا مشكلة تعاطف: كثير من الناس يريدون المساعدة وكثير يحتاجونها، لكن الوصول بينهم صعب. يخدم المشروع طالبي المساعدة والمتطوعين الأفراد والمنظمات القادرة على العون. لا ننشر أرقاماً عن حجم المجتمع أو نتائج ميدانية، ولا ندّعي تشغيلاً ذاتياً مستمراً أو قدرات لم تُثبت بعد.",
  misH:"الرسالة والرؤية",
  misP:"<strong>رسالتنا:</strong> جعل طلب المساعدة أسهل، وتقديمها أكثر أماناً، وتنسيقها أوضح.",
  visP:"<strong>رؤيتنا:</strong> عالمٌ لا يضيع فيه طلب صادق بسبب غياب التنسيق، ولا تُهدَر فيه يدٌ ممدودة بسبب غياب الطريق.",
  howH:"كيف تعمل HEAVEN",
  howSteps:["يصف طالب المساعدة حاجته بكلماته البسيطة.","يسجّل الأفراد والمنظمات ما يستطيعون تقديمه فعلاً.","قد يساعد الذكاء الاصطناعي في تنظيم الطلب واقتراح تطابقات محتملة وصياغة أوضح.","المساعدة الحقيقية يقدمها البشر: الطعام والمأوى والمواصلات والرعاية والتعليم وغيرها من الأفعال الواقعية.","يتم التواصل مباشرة بين الطرفين؛ لا تضمن المنصة نتيجة ولا تراقب اللقاءات الواقعية."],
  howSafe:"<strong>السلامة أولاً:</strong> في حالات الطوارئ يجب الاتصال بخدمات الطوارئ المحلية. القوائم والروابط المعروضة ليست تحققاً مستقلاً من الأشخاص أو المنظمات.",
  joinH:"شارك",
  joinNeedH:"أحتاج مساعدة",
  joinNeedP:"صِف حاجتك، وستعمل HEAVEN على تنسيق استجابة ممكنة. HEAVEN مشروع في بدايته، والمساعدة الفعلية مرهونة بتوفر الأشخاص والموارد — وتسعى HEAVEN إلى التعامل مع كل طلب بجدية ولطف.",
  joinGiveH:"أريد المساعدة",
  joinGiveP:"سجّل ما تستطيع تقديمه فعلاً، ضمن وقتك وقدرتك.",
  joinFirstH:"أريد أن أفهم أولاً",
  joinFirstP:"العب خيوط النور، ثم اقرأ الرسالة وطريقة العمل.",
  dawnH:"الباب مفتوح",
  dawnP:"القصة انتهت، لكن الفكرة تبدأ هنا. ادخل إلى منصة HEAVEN الحقيقية — بلطف، وبصدق، وخطوة واحدة في كل مرة.",
  dawnGo:"افتح منصة HEAVEN", dawnGoAr:"",
  footLinks:'<a href="index.html">صفحة HEAVEN</a> · <a href="threads-of-light.html">خيوط النور</a> · <a href="https://perchance.org/heaven-ai">منصة HEAVEN</a>',
  footNote:"لا توجد قناة تواصل رسمية معلنة بعد. الروابط أعلاه هي الروابط المعتمدة الوحيدة.",
  altMark:"شعار HEAVEN",
  altNoor:"صورة نور، مرشدة خيالية", altIdris:"صورة إدريس، مرشد خيالي", altSalim:"صورة سالم، مرشد خيالي"
},
en:{
  slogan:"Build the Place We Wish Existed",
  navExp:"Experience", navAbout:"About", navHow:"How it works", navJoin:"Get involved",
  heroLede:"An early-stage humanitarian coordination project, helping assistance reach the people who need it — quietly, carefully, and without false promises. Begin with the story, learn about the project, or go directly to the platform.",
  ctaPlay:"Play Threads of Light", ctaLearn:"Learn about HEAVEN", ctaOpen:"Open the HEAVEN platform",
  expH:"Threads of Light",
  expP:"Our signature interactive story: a fictional neighborhood, three nights, and neighbors who need careful listening and thoughtful choices. Three fictional guides accompany you — each thinking in a different way.",
  noorN:"Noor · The Listener", noorQ:"“Who might be hurting, and what do they need?”",
  idrisN:"Idris · The Strategist", idrisQ:"“How can we connect the available resources?”",
  salimN:"Salim · The Skeptic", salimQ:"“What could go wrong, and whom might we overlook?”",
  expFire:"<strong>Everyone in the game is fictional.</strong> The game's characters and requests are fictional and do not represent real requests for assistance. No accounts, scores, or data leave your device.",
  aboutH:"About HEAVEN",
  aboutP:"HEAVEN is an early-stage project addressing a coordination problem, not a compassion problem: many people want to help and many need help, but finding each other is difficult. It serves people seeking assistance, individual volunteers, and organizations able to provide support. We publish no community-size figures or field outcomes, and we claim no continuous autonomous operation or undemonstrated capabilities.",
  misH:"Mission & Vision",
  misP:"<strong>Our mission:</strong> make asking for help easier, offering help safer, and coordinating help clearer.",
  visP:"<strong>Our vision:</strong> a world where no sincere request is lost for lack of coordination, and no willing hand is wasted for lack of a path.",
  howH:"How HEAVEN Works",
  howSteps:["A person describes their need in plain words.","Individuals and organizations register what they can genuinely provide.","AI may help organize the request, suggest possible matches, and clarify wording.","Real help comes from people: food, shelter, transport, care, teaching, and other real-world acts.","Both sides communicate directly; the platform guarantees no outcome and does not supervise real-world meetings."],
  howSafe:"<strong>Safety first:</strong> in emergencies, contact local emergency services. Listings and links here are not independent verification of people or organizations.",
  joinH:"Get Involved",
  joinNeedH:"I need help",
  joinNeedP:"Describe your need, and HEAVEN can help coordinate a possible response. HEAVEN is an early-stage project, and real assistance depends on the people and resources available — HEAVEN aims to treat every request with seriousness and kindness.",
  joinGiveH:"I want to help",
  joinGiveP:"Register only what you can genuinely provide, within your time and capacity.",
  joinFirstH:"I want to understand first",
  joinFirstP:"Play Threads of Light, then read the mission and how it works.",
  dawnH:"The Door Is Open",
  dawnP:"The story ends; the idea begins here. Enter the real HEAVEN platform — gently, honestly, one step at a time.",
  dawnGo:"Open the HEAVEN platform", dawnGoAr:"",
  footLinks:'<a href="index.html">HEAVEN home</a> · <a href="threads-of-light.html">Threads of Light</a> · <a href="https://perchance.org/heaven-ai">HEAVEN platform</a>',
  footNote:"No official contact channel has been announced yet. The links above are the only verified links.",
  altMark:"HEAVEN emblem",
  altNoor:"Portrait of Noor, a fictional guidance persona", altIdris:"Portrait of Idris, a fictional guidance persona", altSalim:"Portrait of Salim, a fictional guidance persona"
}};
let lang = "ar";
function setLang(l){
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.getElementById("langBtn").textContent = l === "ar" ? "EN" : "عربي";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.getAttribute("data-i18n")]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.getAttribute("data-i18n-html")]; });
  const hs = document.getElementById("howSteps");
  hs.innerHTML = "";
  t.howSteps.forEach(s => { const li = document.createElement("li"); li.textContent = s; hs.appendChild(li); });
  document.getElementById("heroMark").alt = t.altMark;
  document.getElementById("imgNoor").alt = t.altNoor;
  document.getElementById("imgIdris").alt = t.altIdris;
  document.getElementById("imgSalim").alt = t.altSalim;
}
document.getElementById("langBtn").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
setLang("ar");
</script>
</body>
</html>
